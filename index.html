/* Exécutée sur une page de résultats (recopiée dans le favori, donc sans commentaire
   ni retour à la ligne obligatoire) : Leboncoin donne ses annonces en données
   structurées ; ailleurs, chaque lien vers une annonce (identifiant de 6 chiffres
   ou plus) est rattaché à la carte qui l'entoure, dont on lit prix, surface, pièces,
   ville et photo. */
function lireListePage(){
  try {
    var estAnnonce = function(p){ var seg = p.split("/").filter(Boolean), s = seg[seg.length - 1] || ""; return /\d{6,}/.test(p) || /^(?=.*\d)(?=.*[A-Za-z])[A-Za-z0-9]{8,}(\.htm)?$/.test(s) || (/^annonces?$/.test(seg[0] || "") && seg.length >= 3); };
    if(estAnnonce(location.pathname)) return [];
    var res = [], vus = {};
    var num = function(s){ return parseFloat(String(s).replace(/[\s\u00a0\u202f.]/g, "").replace(",", ".")); };
    var ajoute = function(o){ var k = String(o.u || "").split(/[?#]/)[0]; if(!k || vus[k]) return; vus[k] = 1; res.push(o); };
    var etatTxt = function(t0){ var s = String(t0 || "").toLowerCase().replace(/(aucuns?|pas de|sans)\s+(gros\s+|petits\s+)?travaux[^.\n]*/g, ""); return /(état de|en|vendu en)\s+plateau|plateau [àa] (r[ée]nover|am[ée]nager)|enti[eè]rement [àa] r[ée]nover|r[ée]novation (compl[eè]te|totale|lourde)|tout [àa] refaire|gros travaux/.test(s) ? "plateau" : /[àa] r[ée]nover|travaux (importants|[àa] pr[ée]voir)/.test(s) ? "travaux" : /[àa] rafra[iî]chir|rafra[iî]chissement/.test(s) ? "rafraichir" : ""; };
    var procTxt = function(t0){ return /proc[ée]dure (en cours|judiciaire)|plan de sauvegarde/.test(String(t0 || "").toLowerCase().replace(/(aucune|pas de|sans)\s+proc[ée]dure[^.\n]*/g, "")) ? 1 : 0; };
    try {
      var n = document.getElementById("__NEXT_DATA__"), j = n && JSON.parse(n.textContent), sd = j && j.props && j.props.pageProps && j.props.pageProps.searchData;
      ((sd && sd.ads) || []).forEach(function(a){
        var at = {}; (a.attributes || []).forEach(function(x){ at[x.key] = x; });
        if(at.real_estate_type && !/maison|appartement/i.test(at.real_estate_type.value_label || "")) return;
        var im = a.images || {};
        ajoute({ u:a.url, t:a.subject, p:[].concat(a.price)[0], s:at.square && num(at.square.value), r:at.rooms && +at.rooms.value,
          k:at.real_estate_type && at.real_estate_type.value_label, v:a.location && a.location.city, z:a.location && a.location.zipcode,
          la:a.location && a.location.lat, lo:a.location && a.location.lng, d:at.energy_rate && at.energy_rate.value,
          i:im.small_url || im.thumb_url || (im.urls || [])[0], e:etatTxt(a.subject + " " + (a.body || "")), q:procTxt(a.body) });
      });
    } catch(e){}
    if(res.length) return res.slice(0, 80);
    var ici = location.hostname.replace(/^www\./, "");
    [].slice.call(document.querySelectorAll("a[href]")).forEach(function(a){
      try {
        var url = new URL(a.href);
        if(url.hostname.replace(/^www\./, "") !== ici || !estAnnonce(url.pathname) || vus[a.href.split(/[?#]/)[0]]) return;
        var c = a, txt = "";
        for(var k = 0; k < 8 && c; k++){ txt = c.innerText || ""; if(/€/.test(txt) && /m²|m2/.test(txt)) break; c = c.parentElement; }
        if(!c || !/€/.test(txt) || !/m²|m2/.test(txt) || txt.length > 2500) return;
        var nbIds = function(el){ var ids = {}; [].slice.call(el.querySelectorAll("a[href]")).forEach(function(x){ if(estAnnonce(x.pathname || "")) ids[x.href.split(/[?#]/)[0]] = 1; }); return Object.keys(ids).length; };
        if(nbIds(c) > 1) return;
        for(var k2 = 0; k2 < 6 && c.parentElement && nbIds(c.parentElement) <= 1 && (c.parentElement.innerText || "").length < 2500; k2++) c = c.parentElement;
        txt = c.innerText || "";
        var prix = null, m, re = /(\d{1,3}(?:[ \u00a0\u202f.]\d{3})+|\d{5,7})[ \u00a0\u202f]?€(?!\s*\/)/g;
        while((m = re.exec(txt))){ var v = num(m[1]); if(v >= 10000 && v <= 5e6){ prix = v; break; } }
        var s = (txt.match(/(\d+(?:[.,]\d+)?)\s?m(?:²|2)(?![\w\/])/) || [])[1];
        var r = (txt.match(/(\d+)\s?pi[eè]ces?/i) || txt.match(/\bT(\d)\b/) || [])[1] || (/studio/i.test(txt) ? 1 : null);
        var lieu = txt.match(/([A-ZÀ-Ý][A-Za-zÀ-ÿ'’\-]+(?:[ \-][A-Za-z0-9À-ÿ'’\-]+){0,3})\s*\((\d{5})\)/) || txt.match(/(\d{5})\s+([A-ZÀ-Ý][A-Za-zÀ-ÿ'’\-]+(?:[ \-][A-Za-zÀ-ÿ'’\-]+){0,3})/);
        var ville = lieu ? (/^\d/.test(lieu[1]) ? lieu[2] : lieu[1]) : "", cp = lieu ? (/^\d/.test(lieu[1]) ? lieu[1] : lieu[2]) : "";
        var dep = !lieu && txt.match(/([A-ZÀ-Ý][A-Za-zÀ-ÿ'’\-]+(?:[ \-][A-Za-zÀ-ÿ'’\-]+){0,3})\s*\((\d{2}|2[AB])\)/);
        if(dep) ville = dep[1];
        var slug = !ville && url.pathname.match(/\/annonces?\/[a-z]+-([a-z0-9\-]+?)(?:-(\d{5}))?(?:-quartier-.*)?-r\d+$/);
        if(slug){ ville = slug[1].replace(/(^|-)([a-z])/g, function(x, s1, l){ return s1 + l.toUpperCase(); }); cp = slug[2] || ""; }
        var dpe = (txt.match(/(?:DPE|énergie)\s*:?\s*([A-G])\b/i) || txt.match(/^\s*([A-G])\s*$/m) || [])[1];
        var img = null, aire = 0;
        [].slice.call(c.querySelectorAll("img")).forEach(function(x){ var b = x.getBoundingClientRect(), s2 = b.width * b.height; if(b.width >= 100 && s2 > aire){ aire = s2; img = x; } });
        var src = img ? (img.currentSrc || img.getAttribute("data-src") || img.src || "") : "";
        ajoute({ u:a.href.split(/[?#]/)[0], t:"",
          p:prix, s:s && num(s), r:r && +r, k:/maison|villa/i.test(txt) ? "Maison" : "Appartement", v:ville, z:cp, d:dpe, i:/^https?:/.test(src) ? src : "", e:etatTxt(txt), q:procTxt(txt) });
      } catch(e){}
    });
    return res.slice(0, 80);
  } catch(e){ return []; }
}

/* ---------------- photos ----------------
   On garde les adresses des photos dans la fiche ; le service worker en garde une
   copie sur l'appareil dès qu'elles sont chargées (hors ligne, annonce retirée…). */
const photosBien = b => (b.photos && b.photos.length ? b.photos : b.vignette ? [b.vignette] : []);
const imgAttr = u => 'src="' + esc(u) + '" alt="" referrerpolicy="no-referrer" onerror="this.remove()"';
function prechargerPhotos(b){ photosBien(b).concat(b.vignette || []).forEach(u => { const i = new Image(); i.referrerPolicy = "no-referrer"; i.src = u; }); }
/* mes photos (visite) : réduites puis rangées dans IndexedDB, qui accepte bien plus
   que le stockage local ; la fiche ne garde que leurs identifiants (b.mesPhotos) */
const IDB = {
  db:null,
  ouvrir(){
    return this.db || (this.db = new Promise((ok, ko) => {
      const r = indexedDB.open("rendement", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("photos", { keyPath:"id" });
      r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
    }));
  },
  async op(mode, fn){
    const db = await this.ouvrir();
    return new Promise((ok, ko) => {
      const tx = db.transaction("photos", mode), r = fn(tx.objectStore("photos"));
      tx.oncomplete = () => ok(r && r.result); tx.onerror = () => ko(tx.error);
    });
  },
  get(id){ return this.op("readonly", s => s.get(id)); },
  put(o){ return this.op("readwrite", s => s.put(o)); },
  del(id){ return this.op("readwrite", s => s.delete(id)); },
  cles(){ return this.op("readonly", s => s.getAllKeys()); }
};
function reduirePhoto(file, max = 1600){
  return new Promise((ok, ko) => {
    const u = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b => b ? ok(b) : ko(new Error("conversion")), "image/jpeg", 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(u); ko(new Error("image illisible")); };
    img.src = u;
  });
}
async function ajouterPhotos(files){
  const b = bienCourant(); if(!b || !files.length) return;
  if(!window.indexedDB){ toast("Ce navigateur ne permet pas de garder des photos"); return; }
  toast("Enregistrement de " + files.length + " photo" + (files.length > 1 ? "s" : "") + "…");
  let n = 0, erreur = null;
  for(const fi of files){
    try {
      const blob = await reduirePhoto(fi), id = uid();
      await IDB.put({ id, bien:b.id, blob, d:Date.now() });
      (b.mesPhotos = b.mesPhotos || []).push(id); n++;
    } catch(e){ erreur = e; }
  }
  b.maj = Date.now(); sauverB();
  // demande au navigateur de ne pas effacer ces données en cas de manque de place
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  toast(n ? n + " photo" + (n > 1 ? "s" : "") + " ajoutée" + (n > 1 ? "s" : "")
    : erreur && !/illisible|conversion/.test(erreur.message) ? "Le navigateur refuse de garder des photos (navigation privée ?)" : "Photo illisible");
  if(vue === "analyse") rendreAnalyse();
}
const urlsMes = new Map();
async function urlMaPhoto(id){
  if(urlsMes.has(id)) return urlsMes.get(id);
  const r = await IDB.get(id).catch(() => null);
  const u = r && r.blob ? URL.createObjectURL(r.blob) : "";
  urlsMes.set(id, u);
  return u;
}
/* les <img data-ph> reçoivent leur image une fois lue dans IndexedDB */
function remplirPhotos(racine){
  if(!racine || !window.indexedDB) return;
  racine.querySelectorAll("img[data-ph]").forEach(async img => { const u = await urlMaPhoto(img.dataset.ph); if(u) img.src = u; else img.remove(); });
}
function vignette(b){
  const u = b.vignette || photosBien(b)[0], m = (b.mesPhotos || [])[0];
  return u ? '<img class="vign" loading="lazy" ' + imgAttr(u) + '>' : m ? '<img class="vign" data-ph="' + esc(m) + '" alt="">' : "";
}
function bandePhotos(b){
  const l = photosBien(b), m = b.mesPhotos || [];
  if(!l.length && !m.length) return '<div class="btns" style="margin:0 0 10px"><button class="btn petit" data-act="ajout-photo">＋ Photos de visite</button></div>';
  return '<div class="photos">' + l.map((u, i) => '<img loading="lazy" data-act="photo" data-i="' + i + '" ' + imgAttr(u) + '>').join("") +
    m.map((id, j) => '<img class="mienne" data-act="photo" data-i="' + (l.length + j) + '" data-ph="' + esc(id) + '" alt="">').join("") +
    '<button class="ajout-photo" data-act="ajout-photo"><span>＋</span>Photo</button></div>';
}
function ouvrirPhotos(i){
  const b = bienCourant(); if(!b) return;
  const l = photosBien(b), m = b.mesPhotos || [];
  if(!l.length && !m.length) return;
  $("#modal").innerHTML = '<div class="visio"><div class="defil">' + l.map(u => '<img ' + imgAttr(u) + '>').join("") + m.map(id => '<img data-ph="' + esc(id) + '" alt="">').join("") + '</div>' +
    '<button class="suppr-ph hide" data-act="suppr-photo">Supprimer</button><button class="fermer" data-act="fermer-modal" aria-label="Fermer">✕</button><div class="cpt"></div></div>';
  remplirPhotos($("#modal"));
  const d = $("#modal .defil"), maj = () => {
    const k = Math.round(d.scrollLeft / d.clientWidth);
    $("#modal .cpt").textContent = (k + 1) + " / " + d.children.length + (k >= l.length ? " · ma photo" : "");
    $("#modal .suppr-ph").classList.toggle("hide", k < l.length);
  };
  d.scrollLeft = i * d.clientWidth; d.addEventListener("scroll", maj); maj();
}
/* photos qui n'appartiennent plus à aucun bien : copies d'annonce en cache et photos de visite */
async function nettoyerPhotos(){
  if(window.caches) try {
    const c = await caches.open("rendement-photos");
    const garder = new Set(biens.flatMap(b => photosBien(b).concat(b.vignette || [])));
    for(const r of await c.keys()) if(!garder.has(r.url)) c.delete(r);
  } catch(e){}
  if(window.indexedDB) try {
    const miennes = new Set(biens.flatMap(b => b.mesPhotos || []));
    for(const id of await IDB.cles()) if(!miennes.has(id)) IDB.del(id);
  } catch(e){}
}

      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-5.6-6-10.5a6 6 0 0 1 12 0C18 15.4 12 21 12 21Z"/><circle cx="12" cy="10.5" r="2.2"/></svg></button>' : "") +
    '<select id="tri">' +
    [["score","Meilleur score"],["renta","Rendement"],["cf","Cash-flow"],["prix","Prix"],["recent","Récents"]].map(([k, n]) => '<option value="' + k + '"' + (k === tri ? " selected" : "") + '>' + n + '</option>').join("") + '</select></div>';
  if(!l.length) h += '<div class="carte vide note">Aucun bien pour l\'instant. Colle une annonce ci-dessus.</div>';
  if(affichage === "carte" && l.length) h += '<div id="carte" class="carte-biens"></div>';
  else for(const { b, o } of l){
    const baisse = b.hist && b.hist.length ? b.hist[0].prix - b.prix : 0;

      '<div class="pastille" style="background:' + (o.ok ? o.couleur : "var(--gris)") + '">' + (o.ok ? o.score : "–") + '</div>' +
      '<div class="inf"><div class="t">' + esc(b.titre || "Sans titre") + (b.statut && b.statut !== "à voir" ? '<span class="statut">' + esc(b.statut) + '</span>' : "") + '</div>' +
      '<div class="s">' + esc([b.ville, b.prix ? eur(b.prix) : "", b.surface ? fmtN(b.surface) + " m²" : "", b.dpe ? "DPE " + b.dpe : ""].filter(Boolean).join(" · ")) +
      (baisse > 0 ? ' · <span style="color:var(--bon)">−' + eur(baisse) + '</span>' : "") + '</div>' +
      (o.ok ? '<div class="k"><span>Brut <b>' + pct(o.brut) + '</b></span><span>Net <b>' + pct(o.net) + '</b></span><span>Cash-flow <b>' + sgn(o.cfNet) + '</b>/mois</span></div>' : "") +
      '</div>' + vignette(b) + (modeComp ? '<span class="coche' + (choisi ? " on" : "") + '">✓</span>'

      (selComp.length >= 2 ? '<button class="btn pri petit" data-act="lancer-comp">Comparer →</button>' : "") + '</div></div>';

/* une ligne par indicateur : [libellé, (b, o) => [valeur pour classer, texte], sens] ; sens 1 = plus haut c'est mieux, -1 = plus bas, 0 = pas de classement */
const LIGNES_COMP = [
  ["Le bien"],

  ["Prix affiché", b => [+b.prix, eur(b.prix)], -1],

function rendreComparer(){
  const l = selComp.map(id => biens.find(b => b.id === id)).filter(Boolean).map(b => ({ b, o:calc(b) }));
  let h = '<div class="outils" style="margin-top:16px"><button class="btn petit" data-act="vue-biens">← Biens</button><div class="esp"></div></div>';
  if(l.length < 2){ $("#v-comparer").innerHTML = h + '<div class="carte note">Choisis 2 ou 3 biens dans la liste avec le bouton « Comparer ».</div>'; return; }
  const g = ' style="grid-template-columns:repeat(' + l.length + ',1fr)"';
  h += '<div class="comp-tete"' + g + '>' + l.map(({ b, o }) => '<div class="comp-col" data-act="ouvrir-comp" data-id="' + b.id + '"><div class="pastille" style="background:' + (o.ok ? o.couleur : "var(--gris)") + '">' + (o.ok ? o.score : "–") + '</div>' +
    '<div class="comp-t">' + esc(b.titre || "Sans titre") + '</div><div class="comp-v" style="color:' + (o.ok ? o.couleur : "var(--gris)") + '">' + (o.ok ? o.verdict[0] : "incomplet") + '</div></div>').join("") + '</div>';
  h += '<div class="carte">';
  for(const [nom, fn, sens] of LIGNES_COMP){
    if(!fn){ h += '<div class="comp-sec">' + nom + '</div>'; continue; }
    const vals = l.map(({ b, o }) => fn(b, o));
    const nums = vals.map(v => v[0]).filter(v => v != null && isFinite(v));
    const best = sens && nums.length > 1 && Math.min(...nums) !== Math.max(...nums) ? (sens > 0 ? Math.max(...nums) : Math.min(...nums)) : null;
    h += '<div class="comp-l"><div class="comp-n">' + nom + '</div><div class="comp-vals"' + g + '>' +
      vals.map(v => '<div' + (best != null && v[0] === best ? ' class="mieux"' : "") + '>' + v[1] + '</div>').join("") + '</div></div>';
  }
  h += '</div><div class="note" style="margin:10px 0">En vert : le meilleur des biens comparés sur la ligne. Touche un bien pour ouvrir son analyse.</div>';
  $("#v-comparer").innerHTML = h;
}

/* partage (appli Leboncoin) ou lien seul : seuls le titre et le lien arrivent,
   on demande juste ce qui manque, au même endroit que le résultat */
const CHAMPS_PARTAGE = ["prix", "surface", "ville", "loyer", "dpe"];
function cartePartage(b, lect){
  const tous = [].concat(...CHAMPS.map(g => g.l));
  const manq = CHAMPS_PARTAGE.filter(k => b[k] == null || b[k] === "");
  const lu = lect.trouves.filter(k => k !== "titre").map(k => LIBELLES[k]);
  if(!manq.length) return "";
  return '<div class="carte partage"><b>Annonce reçue' + (b.source ? " de " + esc(b.source) : "") + '</b>' +
    '<div class="note" style="margin-top:2px">' + (lu.length ? "Déjà lu : " + lu.join(", ") + ". " : "") + 'Le partage ne transmet que le titre et le lien : complète ici, tout se recalcule au fur et à mesure.</div>' +
    '<div class="champs" style="margin-top:10px">' + manq.map(k => champHTML(tous.find(c => c.k === k), b, [])).join("") + '</div>' +
    '<div class="note" style="margin-top:8px">Loyer et DPE facultatifs (loyer estimé d\'après le marché). Pour tout remplir d\'un coup : ouvre l\'annonce dans le navigateur et touche le favori « → Rendement ».</div></div>';
}

function champHTML(c, b, trouves){
  const v = b[c.k];
  const cls = "champ" + (c.large ? " large" : "") + (trouves.includes(c.k) ? " trouve" : "");
  if(c.t === "check") return '<div class="champ large"><label class="bascule"><span>' + c.n + '</span><input type="checkbox" data-k="' + c.k + '"' + (v ? " checked" : "") + '></label></div>';
  if(c.t === "select") return '<div class="' + cls + '"><label>' + c.n + '</label><div class="in"><select data-k="' + c.k + '">' + c.o.map(([k, n]) => '<option value="' + esc(k) + '"' + (String(v || "") === k ? " selected" : "") + '>' + n + '</option>').join("") + '</select></div></div>';
  return '<div class="' + cls + '"><label>' + c.n + '</label><div class="in"><input ' + (c.t === "num" ? 'inputmode="decimal" ' : "") + 'data-k="' + c.k + '" data-t="' + c.t + '" value="' + esc(v == null || (c.est === "travaux" && !+v) ? "" : (c.t === "num" ? String(v).replace(".", ",") : v)) + '"' + (c.est ? ' data-est="' + c.est + '"' : "") + '>' + (c.u ? '<span class="u">' + c.u + '</span>' : "") + '</div></div>';
}

      if(k === "coloc"){ if(v && !b.meuble) b.meuble = true; sauverB(); rendreAnalyse(); }   // les champs de colocation apparaissent
    });
  });
}

/* simulation de négociation : ne touche pas au bien tant qu'on ne la retient pas */
let simNego = 0, simPour = null;
function bienSimule(b){
  if(simPour !== b.id) simNego = 0;
  return simNego && b.prix ? Object.assign({}, b, { prix: Math.round(b.prix * (1 - simNego / 100) / 100) * 100 }) : b;
}
function majSim(b0, b, o){
  const s = $("#sim"); if(!s) return;
  s.classList.toggle("hide", !(+b0.prix > 0 && o.ok));
  const r = $("#sim-r"); if(document.activeElement !== r) r.value = simNego;
  $("#sim-t").textContent = simNego ? "À " + eur(b.prix) + " (−" + simNego + " %) : tous les chiffres ci-dessus sont recalculés." : "Fais glisser pour voir l'effet d'une baisse de prix.";
  $("#sim-ok").classList.toggle("hide", !simNego);
}

/* couleur de chaque indicateur : vert = objectif tenu, orange = proche, rouge = loin */
function tons(o){
  const obj = P.objectif / 100, objNet = P.base === "nette" ? obj : obj * 0.75;
  return {
    objNet,
    brut: o.brut >= obj ? "bon" : o.brut >= obj * 0.8 ? "moyen" : "mauvais",
    net: o.net >= objNet ? "bon" : o.net >= objNet * 0.8 ? "moyen" : "mauvais",
    cf: o.cfNet >= 0 ? "bon" : o.cfNet >= -100 ? "moyen" : "mauvais",
    m2: o.ecartPrix == null ? "" : o.ecartPrix <= 0 ? "bon" : o.ecartPrix <= 0.1 ? "moyen" : "mauvais",
    offre: o.nego <= 0 ? "bon" : o.nego <= 0.1 ? "moyen" : "mauvais"
  };
}
const TON = { bon:"var(--bon)", moyen:"var(--moyen)", mauvais:"var(--mauvais)", "":"" };
const DPE_C = { A:"#2e8b57", B:"#5aa845", C:"#a6c43a", D:"#d9b414", E:"#f0a02c", F:"#e0632b", G:"#c9302c" };
const tuile = (l, v, d, t, jauge) => '<div class="kpi ' + (t || "") + '"><div class="l">' + l + '</div><div class="v">' + v + '</div>' +
  (jauge != null ? '<div class="barre"><i style="width:' + clamp(jauge, 0, 1) * 100 + '%"></i></div>' : "") + '<div class="d">' + d + '</div></div>';

function synthese(b, o){
  const t = tons(o), C = 2 * Math.PI * 42;
  const sous = [b.ville, b.surface ? fmtN(b.surface) + " m²" : "", b.pieces ? (+b.pieces === 1 ? "studio" : "T" + b.pieces) : "", b.meuble ? "meublé" : ""].filter(Boolean).map(esc).join(" · ");
  const dpe = (b.dpe ? '<span class="dpe" style="background:' + DPE_C[b.dpe] + '">DPE ' + b.dpe + '</span>' : '<span class="dpe" style="background:var(--gris)">DPE ?</span>') +
    (o.etat && o.etat !== "bon" ? '<span class="dpe" style="background:' + (o.etat === "plateau" ? "var(--mauvais)" : "var(--moyen)") + '">' + ETATS[o.etat].n + '</span>' : "") +
    (b.coproProcedure ? '<span class="dpe" style="background:var(--mauvais)">Copro sous procédure</span>' : "");
  const nR = o.alertes.filter(a => a[0] === "var(--mauvais)").length, nA = o.alertes.filter(a => a[0] !== "var(--gris)").length;
  return '<div class="carte syn"><div class="syn-tete">' +
      '<div class="anneau p"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="42" fill="none" stroke="var(--carte2)" stroke-width="10"/><circle cx="48" cy="48" r="42" fill="none" stroke="' + o.couleur + '" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + (C * o.score / 100) + ' ' + C + '"/></svg><div class="v"><div><b>' + o.score + '</b><small>/ 100</small></div></div></div>' +
      '<div class="inf"><div class="verdict" style="color:' + o.couleur + '">' + o.verdict[0] + '</div><div class="syn-titre">' + esc(b.titre || "Sans titre") + '</div><div class="syn-sous">' + (sous ? '<span>' + sous + '</span>' : "") + dpe + '</div></div></div>' +
    '<div class="verdict-s">' + o.verdict[1] + '</div>' +
    '<div class="syn-prix"><div><div class="l">' + (simNego ? "Prix simulé" : "Prix affiché") + '</div><div class="gros">' + eur(b.prix) + '</div><div class="d note">' + eur(o.cout) + ' tout compris</div></div>' +
      '<div class="fl">→</div>' +
      '<div style="text-align:right"><div class="l">Offre max · ' + fmtN(P.objectif, 1) + ' % ' + (P.base === "nette" ? "net" : "brut") + '</div><div class="gros" style="color:' + TON[t.offre] + '">' + eur(Math.round(o.offre / 500) * 500) + '</div><div class="d" style="color:' + TON[t.offre] + '">' + (o.nego <= 0 ? "objectif atteint" : "−" + pct(o.nego, 0) + " à négocier") + '</div></div></div>' +
    '<div class="kpis k3">' +
      tuile("Brut", pct(o.brut), "objectif " + fmtN(P.objectif, 1) + " %", t.brut, o.brut / (P.objectif / 100)) +
      tuile("Net", pct(o.net), "après charges", t.net, o.net / t.objNet) +
      tuile("Net-net", pct(o.netNet), "après impôt", "", null) +
      tuile("Cash-flow", sgn(o.cfNet), o.moisTravaux ? "/mois une fois loué" : !P.credit ? "/mois, sans crédit" : simTaux != null ? "/mois, à " + fmtN(simTaux, 2) + " %" : "/mois, crédit inclus", t.cf, null) +
      tuile("Loyer", eur(o.loyer), b.coloc ? o.chambres + " chambres" + (o.loyerEstime ? ", estimé" : "") : o.loyerEstime ? "estimé (marché)" : o.loyerMarche ? "marché ≈ " + eur(o.loyerMarche) : "saisi", "", null) +
      tuile("Prix / m²", eur(o.prixM2), o.ecartPrix == null ? "marché inconnu" : (o.ecartPrix >= 0 ? "+" : "−") + pct(Math.abs(o.ecartPrix), 0) + (o.refVentes ? " vs ventes" : " vs marché"), t.m2, null) +
    '</div>' + flux(o) +
    (nA ? '<button class="syn-al' + (nR ? " r" : "") + '" data-act="voir-alertes"><span>⚠ ' + nA + ' point' + (nA > 1 ? "s" : "") + ' d\'attention</span>›</button>' : "") +
  '</div>';
}
/* où part le loyer chaque mois : charges, crédit, impôt, et ce qui reste (ou ce qu'il faut ajouter) */
function flux(o){
  const ch = (o.vacance + o.charges) / 12, cr = o.mens, im = o.impot / 12, cf = o.cfNet;
  const tot = Math.max(o.loyer, ch + cr + im, 1);
  const seg = [["Charges", ch, "var(--gris)"], ["Crédit", cr, "var(--acc)"], ["Impôt", im, "var(--moyen)"]];
  if(cf > 0) seg.push(["Reste", cf, "var(--bon)"]);
  const vis = seg.filter(s => s[1] > 0.5);
  return '<div class="flux"><div class="flux-t"><span>Le loyer de ' + eur(o.loyer) + ' / mois</span><b style="color:' + (cf >= 0 ? "var(--bon)" : "var(--mauvais)") + '">' + (cf >= 0 ? "il reste " + sgn(cf) : "tu ajoutes " + eur(-cf)) + '</b></div>' +

/* projection : chiffres clés, graphique, phrase de synthèse, détail, tests de résistance */
function vueProjection(b, o){

      '. Avec ' + sgn(fin.cumul) + ' de cash-flow cumulé et ton apport de ' + eur(o.apport) + ', tu t\'enrichis de <b>' + sgn(s.enrichissement) + '</b>.</div>' +
    '<details class="pli"><summary>Année par année</summary><table class="t"><tr><td class="note">Année</td><td class="r note">Cash-flow/an</td><td class="r note">Crédit dû</td><td class="r note">Si revente</td></tr>' +
      s.annees.map(x => '<tr><td>' + x.a + '</td><td class="r">' + sgn(x.cf) + '</td><td class="r">' + eur(x.restant) + '</td><td class="r">' + kEur(x.enrichi) + '</td></tr>').join("") + '</table></details>' +
    '<div class="note" style="margin-top:8px">Hypothèses : bien +' + fmtN(P.revalo, 1) + ' %/an, loyers +' + fmtN(P.hausseLoyer, 1) + ' %/an, charges +' + fmtN(P.hausseCharges, 1) +
      ' %/an (Réglages → Projection). Régime : ' + s.nom + ', le plus avantageux en ' + (b.meuble ? "meublé" : "location nue") + ' (voir Fiscalité).</div></div>';

function grapheProjection(s){
  const ys = s.annees.map(x => Math.round(x.enrichi)), W = 320, H = 150, gx = 42, dx = 8, hy = 10, by = 22;
  const min = Math.min(0, ...ys), max = Math.max(0, ...ys), e = max - min || 1;
  const X = i => gx + i * (W - gx - dx) / Math.max(1, ys.length - 1), Y = v => hy + (max - v) / e * (H - hy - by);
  const pts = ys.map((v, i) => [+X(i).toFixed(1), +Y(v).toFixed(1)]);
  const k = v => (Math.abs(v) >= 1000 ? fmtN(v / 1000, 0) + " k€" : fmtN(v, 0) + " €").replace("-", "−");
  const grad = [max, 0, min].filter((v, i, l) => l.indexOf(v) === i);
  const ans = ys.map((v, i) => i + 1).filter(a => a === 1 || a % 5 === 0);
  return '<div class="graphe" data-pts="' + esc(JSON.stringify(pts)) + '" data-ys="' + esc(JSON.stringify(ys)) + '" data-w="' + W + '">' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Enrichissement net selon l\'année de revente">' +
    grad.map(v => '<line x1="' + gx + '" x2="' + (W - dx) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="var(--ligne)" stroke-width="1"' + (v === 0 ? "" : ' stroke-dasharray="2 3"') + '/>' +
      '<text x="' + (gx - 6) + '" y="' + (Y(v) + 3.5) + '" text-anchor="end" font-size="9.5" fill="var(--gris)">' + k(v) + '</text>').join("") +
    '<path d="M' + X(0) + ',' + Y(0) + ' L' + pts.map(p => p.join(",")).join(" L") + ' L' + X(ys.length - 1) + ',' + Y(0) + ' Z" fill="var(--acc)" opacity=".12"/>' +
    '<polyline points="' + pts.map(p => p.join(",")).join(" ") + '" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
    ans.map(a => '<text x="' + X(a - 1) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="9.5" fill="var(--gris)">' + (a === 1 ? "an 1" : a) + '</text>').join("") +
    '<line class="g-curseur" y1="' + hy + '" y2="' + (H - by) + '" stroke="var(--gris)" stroke-width="1" stroke-dasharray="2 2"/>' +
    '<circle class="g-point" r="4" fill="var(--acc)" stroke="var(--carte)" stroke-width="2"/></svg><div class="g-info"></div></div>';
}
/* survol (ou doigt) sur le graphique : l'année la plus proche et son enrichissement */
function brancherGraphe(){
  const g = $("#ong-autre .graphe"); if(!g) return;
  const svg = g.querySelector("svg"), pts = JSON.parse(g.dataset.pts), ys = JSON.parse(g.dataset.ys), W = +g.dataset.w;
  const cur = svg.querySelector(".g-curseur"), pt = svg.querySelector(".g-point"), info = g.querySelector(".g-info");
  const montrer = i => {
    const [x, y] = pts[i];
    cur.setAttribute("x1", x); cur.setAttribute("x2", x); pt.setAttribute("cx", x); pt.setAttribute("cy", y);
    info.innerHTML = "Revente l'année " + (i + 1) + " : enrichissement <b>" + sgn(ys[i]) + "</b>";
  };
  svg.addEventListener("pointermove", e => {
    const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W;
    let i = 0; pts.forEach((p, j) => { if(Math.abs(p[0] - x) < Math.abs(pts[i][0] - x)) i = j; });
    montrer(i);
  });
  svg.addEventListener("pointerleave", () => montrer(pts.length - 1));
  montrer(pts.length - 1);
}
function vueStress(b){
  const l = stress(b), N = Math.round(+P.detention || 20);
  const ton = cf => cf >= 0 ? "bon" : cf >= -150 ? "moyen" : "mauvais", sym = { bon:"✓", moyen:"!", mauvais:"✕" };
  const tient = l.slice(1).filter(x => x.cf >= -150).length;
  return '<h2>Si ça se passe mal</h2><div class="carte"><div class="note" style="margin-bottom:6px">En moyenne sur  <b>' + tient + ' scénario' + (tient > 1 ? "s" : "") + ' sur ' + (l.length - 1) + '</b>.</div>' +
    '<table class="t"><tr><td class="note">Scénario</td><td class="r note">Cash-flow moyen/mois</td><td class="r note">Gain ' + N + ' ans</td></tr>' +
    l.map((x, i) => '<tr' + (i ? "" : ' class="tot"') + '><td>' + x.n + '</td><td class="r ton-' + ton(x.cf) + '">' + sym[ton(x.cf)] + ' ' + sgn(x.cf) + '</td><td class="r">' + (x.enr == null ? "–" : kEur(x.enr)) + '</td></tr>').join("") +
    '</table><div class="note" style="margin-top:6px">✓ cash-flow positif · ! effort jusqu\'à 150 €/mois · ✕ au-delà.</div></div>';
}

/* fiscalité : les 4 régimes côte à côte, le plus avantageux en tête */
function vueFiscalite(b0, b, o){
  const c = comparerRegimes(b, o), ok = c.liste.filter(x => !x.impossible), act = o.sim, N = act.N;
  const best = ok.reduce((m, x) => x.enrichissement > m.enrichissement ? x : m);
  const meubleBest = REGIMES[best.regime].meuble;
  let h = '<div class="carte"><div class="note">Le plus avantageux sur ' + N + ' ans</div><div class="verdict" style="font-size:18px;margin-top:2px">' + best.nom + '</div>' +
    (best.regime === act.regime ? '<div class="note" style="margin-top:2px">C\'est déjà ce que retiennent les calculs de ce bien.</div>'
      : '<div class="note" style="margin-top:2px">' + kEur(best.enrichissement - act.enrichissement) + ' sur ' + N + ' ans par rapport à la configuration actuelle (' + act.nom + ').</div>') +
    (meubleBest !== !!b0.meuble ? '<div class="btns"><button class="btn petit pri" data-act="passer-meuble" data-m="' + (meubleBest ? 1 : 0) + '">Passer ce bien en ' + (meubleBest ? "meublé" : "location nue") + '</button></div>' : "") +
    '<table class="t" style="margin-top:12px"><tr><td class="note">Régime</td><td class="r note">Impôt/an</td><td class="r note">Cash-flow/mois</td><td class="r note">Gain ' + N + ' ans</td></tr>' +
    c.liste.map(x => x.impossible ? '<tr><td>' + x.nom + '</td><td class="r note" colspan="3">' + x.impossible + '</td></tr>'
      : '<tr' + (x === best ? ' class="tot"' : "") + '><td>' + x.nom + (x.regime === act.regime ? ' <span class="statut">actuel</span>' : "") + '</td><td class="r">' + eurS(x.impotMoyen) + '</td><td class="r">' + sgn(x.cfMoyen) + '</td><td class="r">' + kEur(x.enrichissement) + '</td></tr>').join("") +
    '</table><div class="note" style="margin-top:10px;line-height:1.55">Moyennes sur ' + N + ' ans, revente comprise. Meublé : loyer ' + eur(c.loyerMeuble) + ' (≈ +10 %), mobilier ' + eur(c.mob) +
      '. LMNP réel : bâti amorti sur 30 ans (terrain 15 % exclu), travaux sur 10 ans, mobilier sur 7 ans, 300 €/an de comptable ; amortissements réintégrés dans la plus-value à la revente (règle 2025). ' +
      'Nu réel : déficit foncier imputé sur le revenu global jusqu\'à 10 700 €/an. TMI ' + fmtN(P.tmi) + ' % (Réglages). Non comptés : CFE, surtaxe sur plus-values > 50 000 €.</div></div>';
  return h;
}

/* qualité de la ville, en tête de l'onglet Marché */
function vueVille(b){
  const m = refMarche(b);
  if(!m) return "";
  const i = m.info;
  if(!i) return '<div class="carte"><div class="note">' + (villeEnCours.has(m.insee) ? "Chargement des données de " + esc(m.ville) + "…" : "Données de " + esc(m.ville) + " indisponibles pour l'instant.") + '</div></div>';
  const tendu = /^(A|Abis|A bis|B1)$/.test(i.zone);
  const lignes = [
    ["Tension locative", i.zone ? "zone " + esc(i.zone) + " · " + (tendu ? "marché tendu, forte demande" : i.zone === "B2" ? "marché intermédiaire" : "marché détendu") : "inconnue"],
    ["Population", i.pop ? fmtN(i.pop) + " hab." + (i.croissance != null ? ' · <span class="ton-' + (i.croissance >= 0.002 ? "bon" : i.croissance > -0.002 ? "moyen" : "mauvais") + '">' + (i.croissance >= 0 ? "+" : "−") + fmtN(Math.abs(i.croissance) * 100, 1) + " %/an</span> depuis " + i.anAnc : "") : "inconnue"],
    ["Risques majeurs", i.risques ? (i.risques.length ? esc(i.risques.join(", ")) : "aucun recensé") : "inconnus"],
    ["Encadrement des loyers", i.encadre ? '<span class="ton-moyen">oui</span>' : "non"]
  ];
  return '<div class="carte"><div class="ville-tete"><div class="pastille" style="background:' + (i.score != null ? couleurScore(i.score) : "var(--gris)") + '">' + (i.score != null ? i.score : "–") + '</div>' +
    '<div><b>' + esc(m.ville) + '</b><div class="note">Qualité de la ville, sur 100</div></div></div>' +
    '<table class="t" style="margin-top:8px">' + lignes.map(([l, v]) => '<tr><td class="note" style="width:40%">' + l + '</td><td style="text-align:right">' + v + '</td></tr>').join("") + '</table>' +
    '<div class="note" style="margin-top:6px">Sources : zonage ABC du ministère du Logement, INSEE, Géorisques. Le score combine tension (40), démographie (30) et risques (30).</div></div>';
}

/* ventes comparables */
function vueVentes(b, o){
  if(!(+b.surface)) return '<div class="carte note">Saisis la surface pour chercher des ventes comparables.</div>';
  const v = ventesAJour(b) ? b.ventes : null, geo = !!(b.lat && b.lng);
  let h = '<div class="carte">';
  if(ventesEnCours.has(b.id)) h += '<div class="note">Recherche des ventes comparables…</div>';
  else if(ventesErreur.has(b.id)) h += '<div class="note">La base des ventes ne répond pas.</div><div class="btns"><button class="btn petit" data-act="ventes-reessayer">Réessayer</button></div>';
  else if(!v) h += '<div class="note">' + (!navigator.onLine ? "Hors ligne : les ventes se chargeront à la prochaine connexion." : "Indique la ville du bien (onglet Fiche) ou son adresse ci-dessous.") + '</div>';
  else if(!v.n) h += '<div class="note">Aucune vente comparable trouvée' + (v.mode === "rayon" ? " à moins de 2 km" : " dans la commune") + '.</div>';
  else {
    const ec = o.prixM2 && v.med ? o.prixM2 / v.med - 1 : null, t = ec == null ? "" : ec <= 0 ? "bon" : ec <= 0.1 ? "moyen" : "mauvais";
    h += '<div class="kpis k3" style="margin-top:0">' +
      tuile("Médiane", eur(v.med), "€/m², " + v.n + " ventes", "", null) +
      tuile("Ce bien", o.prixM2 ? eur(o.prixM2) : "–", ec == null ? "€/m²" : (ec >= 0 ? "+" : "−") + pct(Math.abs(ec), 0) + " vs ventes", t, null) +
      tuile("Valeur estimée", fmtN(v.med * b.surface / 1000, 0) + " k€", "au prix médian", "", null) + '</div>' +
      bandeVentes(v, o.prixM2) +
      '<div class="note" style="margin-top:8px">' + (b.type === "maison" ? "Maisons" : "Appartements") + ' de ' + fmtN(b.surface * 0.6) + ' à ' + fmtN(b.surface * 1.6) + ' m² vendus ' +
        (v.mode === "rayon" ? "à moins de " + (v.rayon >= 1000 ? fmtN(v.rayon / 1000) + " km" : v.rayon + " m") : "dans la commune") + ' depuis ' + moisAn(v.depuis) + '.</div>' +
      '<div style="margin-top:6px">' + v.liste.slice(0, 12).map(venteHTML).join("") + '</div>' +
      (v.liste.length > 12 ? '<details class="pli"><summary>Voir les ' + v.liste.length + ' ventes</summary>' + v.liste.slice(12).map(venteHTML).join("") + '</details>' : "");
  }
  h += '<div class="pos"><div class="note">Position : ' + (geo ? (b.posApprox ? "approximative (celle de l'annonce)" : esc(b.adresse || "précisée")) : "aucune, ventes de toute la commune") + '</div>' +
    '<div class="ajout" style="margin-top:6px"><div class="champ"><div class="in"><input id="adr" placeholder="Adresse précise (n° et rue)" value="' + esc(b.posApprox ? "" : b.adresse || "") + '" autocomplete="off"></div></div><button class="btn" data-act="localiser">Localiser</button></div>' +
    '<div class="note" style="margin-top:8px">Source : DVF, ventes enregistrées par les notaires et publiées par l\'État (environ 6 mois de décalage). Alsace-Moselle et Mayotte non couverts.</div></div></div>';
  return h;
}
const venteHTML = x => '<div class="vente"><div><b>' + esc(x.a || "Adresse non publiée") + '</b><div class="note">' + moisAn(x.d) + ' · ' + fmtN(x.s) + ' m²' + (x.p ? ' · ' + x.p + ' p.' : "") +
  (x.km != null ? ' · ' + (x.km < 1 ? fmtN(Math.round(x.km * 1000 / 10) * 10) + " m" : fmtN(x.km, 1) + " km") : "") + '</div></div><div class="r"><b class="num">' + eur(x.m2) + '/m²</b><div class="note">' + eur(x.v) + '</div></div></div>';
/* répartition des prix au m² : chaque vente est un point, la bande est la moitié centrale, le trait vertical est ce bien */
function bandeVentes(v, m2){
  const l = v.liste.map(x => x.m2), W = 320, H = 52, g = 10, y = 22;
  const lo = Math.min(...l, m2 || Infinity), hi = Math.max(...l, m2 || 0), e = hi - lo || 1, X = x => g + (x - lo) / e * (W - 2 * g);
  const s = l.slice().sort((a, z) => a - z), q1 = s[Math.floor((s.length - 1) * 0.25)], q3 = s[Math.ceil((s.length - 1) * 0.75)];
  return '<div class="bande"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Répartition des prix au m² des ventes">' +
    '<rect x="' + X(q1) + '" y="' + (y - 9) + '" width="' + Math.max(2, X(q3) - X(q1)) + '" height="18" rx="4" fill="var(--carte2)"/>' +
    v.liste.map(x => '<circle cx="' + X(x.m2).toFixed(1) + '" cy="' + y + '" r="4" fill="var(--gris)" opacity=".45"><title>' + esc(x.a || "Vente") + ' : ' + eur(x.m2) + '/m²</title></circle>').join("") +
    '<line x1="' + X(v.med) + '" x2="' + X(v.med) + '" y1="' + (y - 11) + '" y2="' + (y + 11) + '" stroke="var(--texte)" stroke-width="2"/>' +
    (m2 ? '<line x1="' + X(m2) + '" x2="' + X(m2) + '" y1="' + (y - 14) + '" y2="' + (y + 14) + '" stroke="var(--acc)" stroke-width="3" stroke-linecap="round"/>' +
      '<text x="' + Math.min(W - g, Math.max(g, X(m2))) + '" y="' + (y - 17) + '" text-anchor="middle" font-size="9.5" font-weight="600" fill="var(--acc)">ce bien</text>' : "") +
    '<text x="' + g + '" y="' + (H - 4) + '" font-size="9.5" fill="var(--gris)">' + eur(lo) + '</text><text x="' + X(v.med) + '" y="' + (H - 4) + '" text-anchor="middle" font-size="9.5" fill="var(--texte)">médiane</text>' +
    '<text x="' + (W - g) + '" y="' + (H - 4) + '" text-anchor="end" font-size="9.5" fill="var(--gris)">' + eur(hi) + '</text></svg></div>';
}

  ]],
  ["Logement", [

    ["plomberie", "Plomberie et eau chaude en bon état", "La plomberie ou la production d'eau chaude est à reprendre"],

  ]]
];
const visiteProgression = b => {
  const c = (b.visite && b.visite.c) || {}, n = VISITE.reduce((s, g) => s + g[1].length, 0), v = Object.keys(c).length, p = Object.values(c).filter(x => x === "pb").length;

};
function offreParDefaut(b, o){
  if(!(+b.prix) || !o.ok) return null;
  if(o.nego <= 0) return +b.prix;
  return Math.floor((o.nego <= 0.15 ? o.offre : b.prix * 0.9) / 1000) * 1000;
}
function vueVisite(b){
  const c = (b.visite && b.visite.c) || {}, o = calc(b), def = offreParDefaut(b, o);
  let h = '<div class="carte"><div class="lig"><div class="l"><b>Checklist de visite</b><div class="d" id="vis-prog">' + visiteProgression(b) + '</div></div>' +
    '<button class="btn petit" data-act="ajout-photo">＋ Photo</button></div>';
  VISITE.forEach(([g, items]) => {
    h += '<div class="vis-g">' + g + '</div>' + items.map(([k, n]) => '<div class="vis"><span>' + n + '</span>' +
      '<button class="vb ok' + (c[k] === "ok" ? " on" : "") + '" data-act="vis" data-vk="' + k + '" data-e="ok" title="Vérifié, OK" aria-label="OK">✓</button>' +
      '<button class="vb pb' + (c[k] === "pb" ? " on" : "") + '" data-act="vis" data-vk="' + k + '" data-e="pb" title="Problème" aria-label="Problème">!</button></div>').join("");
  });
  h += '<textarea class="zone" id="vis-notes" placeholder="Notes de visite : impressions, questions au vendeur, travaux repérés…">' + esc((b.visite && b.visite.notes) || "") + '</textarea></div>';
  h += '<h2>Négociation</h2><div class="carte"><div id="argu"></div>' +
    '<div class="champs" style="margin-top:14px"><div class="champ"><label>Montant de l\'offre</label><div class="in"><input id="of-montant" inputmode="decimal" value="' + esc(String(b.offre != null ? b.offre : def || "").replace(".", ",")) + '"><span class="u">€</span></div></div>' +
    '<div class="champ"><label>Valable</label><div class="in"><input id="of-jours" inputmode="numeric" value="' + esc(String(b.offreJours || 7)) + '"><span class="u">jours</span></div></div>' +
    '<div class="champ large"><label>Ton nom (signature de la lettre)</label><div class="in"><input id="of-nom" value="' + esc(P.nomAcheteur || "") + '" autocomplete="name"></div></div></div>' +
    (o.ok ? '<div class="note" style="margin-top:6px">Offre max pour ton objectif de ' + fmtN(P.objectif, 1) + ' % : ' + eur(Math.round(o.offre / 500) * 500) + (o.nego > 0 ? " (−" + pct(o.nego, 0) + ")" : "") + '.</div>' : "") +
    '<div class="btns"><button class="btn pri" data-act="lettre">Lettre d\'offre (PDF)</button></div></div>';
  return h;
}
function argumentsNego(b, o){
  const l = [], v = b.ventes && b.ventes.cle === cleVentes(b) ? b.ventes : null, c = (b.visite && b.visite.c) || {};
  if(v && v.n >= 5 && o.prixM2 > v.med * 1.03)
    l.push("Les " + v.n + " ventes comparables enregistrées " + (v.mode === "rayon" ? "à moins de " + (v.rayon >= 1000 ? fmtN(v.rayon / 1000) + " km" : v.rayon + " m") : "dans la commune") + " depuis " + moisAn(v.depuis) + " se sont conclues à " + eur(v.med) + "/m² en médiane, soit environ " + eur(Math.round(v.med * b.surface / 1000) * 1000) + " pour ce bien, contre " + eur(o.prixM2) + "/m² demandés.");
  else if(!o.refVentes && o.ecartPrix != null && o.ecartPrix > 0.03)
    l.push("Le prix demandé (" + eur(o.prixM2) + "/m²) est " + pct(o.ecartPrix, 0) + " au-dessus du prix médian des ventes de la commune (" + eur(o.prixM2Ref) + "/m²).");
  if(b.dpe === "G" || b.dpe === "F") l.push("Classé " + b.dpe + " au DPE, le logement " + (b.dpe === "G" ? "ne peut plus être proposé à la location depuis 2025" : "ne pourra plus être proposé à la location à partir de 2028") + " sans rénovation énergétique, entièrement à la charge de l'acquéreur.");
  else if(b.dpe === "E") l.push("Classé E au DPE, le logement devra être rénové avant 2034 pour rester louable.");
  if(o.travaux) l.push((o.etat === "plateau" ? "Le logement est entièrement à rénover" : o.etat === "travaux" ? "Le logement nécessite des travaux importants" : "Des travaux sont à prévoir") + ", estimés à " + eur(o.travaux) + ", et ne pourra pas être loué pendant le chantier.");
  if(b.coproProcedure) l.push("La copropriété fait l'objet d'une procédure, ce qui expose l'acquéreur à des charges et des travaux imprévisibles.");
  VISITE.forEach(([, items]) => items.forEach(([k, , arg]) => { if(arg && c[k] === "pb") l.push(arg + "."); }));
  const baisse = b.hist && b.hist.length ? b.hist[0].prix - b.prix : 0;
  if(baisse > 0) l.push("Le prix a déjà été baissé de " + eur(baisse) + ".");
  return l;
}
function vueArguments(b, o){
  const l = argumentsNego(b, o);
  return l.length ? '<div class="note">Arguments repris dans la lettre d\'offre :</div><ul class="argu">' + l.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul>'

function imprimerLettre(){
  const b = bienCourant(); if(!b) return;

  const oo = calc(Object.assign({}, b, { prix:montant })), nom = (P.nomAcheteur || "").trim(), jours = Math.max(1, Math.round(+b.offreJours || 7));
  const date = d => d.toLocaleDateString("fr-FR", { day:"numeric", month:"long", year:"numeric" });
  const maison = b.type === "maison";
  const desig = [maison ? "la maison" : "l'appartement", b.pieces ? "de " + fmtN(b.pieces) + " pièces" : "", b.surface ? "d'une surface de " + fmtN(b.surface) + " m²" : "",
    b.adresse && !b.posApprox ? "situé" + (maison ? "e" : "") + " " + b.adresse : b.ville ? "situé" + (maison ? "e" : "") + " à " + b.ville : ""].filter(Boolean).join(" ");
  const args = argumentsNego(b, o), tauxMax = Math.ceil((P.taux + 0.3) * 10) / 10;
  const h = '<div class="lettre"><p>' + esc(nom || "……………………………") + '</p>' +
    '<p class="l-date">Le ' + date(new Date()) + '</p>' +
    '<p><b>Objet : offre d\'achat</b>' + (b.url ? '<br><span class="l-ref">Annonce : ' + esc(b.url) + '</span>' : "") + '</p>' +
    '<p>Madame, Monsieur,</p>' +
    '<p>À la suite de ma visite, je vous fais part de mon offre d\'achat pour ' + esc(desig) + ', proposé' + (maison ? "e" : "") + ' au prix de ' + eur(b.prix) + '.</p>' +
    '<p>Je vous propose d\'acquérir ce bien au prix de <b>' + eur(montant) + '</b>, frais d\'agence inclus, hors frais de notaire.</p>' +
    (args.length ? '<p>Ce prix tient compte des éléments suivants :</p><ul>' + args.map(a => '<li>' + esc(a) + '</li>').join("") + '</ul>' : "") +
    (P.credit && oo.emprunt > 0 ? '<p>Cette offre est faite sous la condition suspensive de l\'obtention d\'un ou plusieurs prêts immobiliers d\'un montant maximal de ' + eur(Math.ceil(oo.emprunt / 1000) * 1000) +
      ', d\'une durée de ' + fmtN(P.duree) + ' ans, à un taux nominal maximal de ' + fmtN(tauxMax, 2) + ' % hors assurance.</p>' : "") +
    '<p>Elle est valable jusqu\'au ' + date(new Date(Date.now() + jours * 864e5)) + ' inclus. En cas d\'acceptation, la vente sera conclue par la signature d\'un compromis de vente chez le notaire.</p>' +
    '<p>Je vous prie d\'agréer, Madame, Monsieur, l\'expression de mes salutations distinguées.</p>' +

  imprimerHTML(h, "Offre d'achat - " + (b.titre || "bien"));
}

/* ---------------- fiche PDF pour la banque ----------------
   Pas de score ni de verdict : seulement les faits et le plan de financement.
   Si une négociation est simulée, c'est ce prix qui est présenté. */
function ficheBanque(b0){
  const b = bienSimule(b0), o = calc(b);
  if(!o.ok) return null;
  const T = (titre, lignes) => '<h2>' + titre + '</h2><table>' + lignes.filter(Boolean).map(([l, v, tot]) => '<tr' + (tot ? ' class="tot"' : "") + '><td>' + l + '</td><td>' + (/^[−+\d]/.test(v) ? v : '<span style="font-family:var(--sans)">' + v + '</span>') + '</td></tr>').join("") + '</table>';
  const est = x => x ? " (estimation)" : "";
  const n = P.duree * 12, coutCredit = P.credit ? o.mens * n - o.emprunt : 0;
  const loyerBanque = o.loyer * 0.7;
  let h = '<div class="imp-tete"><div><div class="imp-sur">Projet d\'investissement locatif</div><h1>' + esc(b.titre || "Bien") + '</h1>' +
    '<div class="imp-sous">' + esc([b.type === "maison" ? "Maison" : "Appartement", b.surface ? fmtN(b.surface) + " m²" : "", b.pieces ? fmtN(b.pieces) + " pièces" : "", [b.cp, b.ville].filter(Boolean).join(" ")].filter(Boolean).join(" · ")) + '</div>' +
    (b.url ? '<div class="imp-url">' + esc(b.url) + '</div>' : "") + '</div>' +

/* ---------------- tri d'une page de résultats ----------------
   Chaque annonce de la page reçoit le même calcul qu'une fiche, avec ce que la
   page affiche (prix, surface, ville…) ; le reste (loyer, charges, taxe foncière)
   est estimé d'après le marché : c'est un score provisoire, pour choisir quoi creuser. */
function recevoirListe(d){
  const items = (d.l || []).map(x => ({
    url:String(x.u || ""), titre:String(x.t || "").slice(0, 120), prix:+x.p || null, surface:+x.s || null, pieces:+x.r || null,
    type:/maison|villa/i.test(x.k || "") ? "maison" : "appartement", ville:String(x.v || ""), cp:x.z ? String(x.z) : "",
    lat:+x.la || null, lng:+x.lo || null, dpe:/^[a-g]$/i.test(x.d || "") ? x.d.toUpperCase() : "", photo:/^https?:/.test(x.i || "") ? x.i : "",
    etat: ETATS[x.e] ? x.e : "", proc: !!x.q
  })).filter(x => /^https?:\/\//.test(x.url));
  store.set("triPage", { date:Date.now(), source: (items[0] && sourceDe(items[0].url)) || sourceDe(d.u) || d.h || "", items });
}
function bienDeListe(x){
  return nouveauBien({ url:x.url, source:sourceDe(x.url), type:x.type, prix:x.prix, surface:x.surface, pieces:x.pieces, ville:x.ville, cp:x.cp, dpe:x.dpe,
    lat:x.lat, lng:x.lng, posApprox:!!x.lat, photos: x.photo ? [x.photo] : [], vignette:x.photo, etat:x.etat || "", coproProcedure:!!x.proc,
    titre: x.titre || [x.type === "maison" ? "Maison" : "Appartement", x.pieces ? (x.pieces === 1 ? "studio" : x.pieces + " pièces") : "", x.surface ? fmtN(x.surface, 1).replace(/,0$/, "") + " m²" : ""].filter(Boolean).join(" · ") });
}
let triVilles = false, triVillesFait = 0;
async function assurerVillesTri(items, date){
  // prix et loyers de marché des villes de la page, une par une, une seule fois par liste
  if(triVilles || triVillesFait === date || !navigator.onLine) return;
  triVilles = true;
  let n = 0;
  try {
    const vus = new Set();
    for(const x of items){
      const c = norm(x.ville) || x.cp;
      if(!c || vus.has(c) || refMarche(bienDeListe(x))) continue;
      vus.add(c);
      const r = await chargerVille(x.ville, x.cp).catch(() => null);
      if(r && !r.introuvable && !r.vide){ n++; if(vue === "tri") rendreTri(); }
    }
  } finally { triVilles = false; triVillesFait = date; }
  if(n && vue === "tri") rendreTri();
}

      (o.ok ? '<div class="k"><span>Brut <b>' + pct(o.brut) + '</b></span>' + (o.ecartPrix != null ? '<span>m² <b>' + (o.ecartPrix >= 0 ? "+" : "−") + pct(Math.abs(o.ecartPrix), 0) + '</b></span>' : "") +

/* ---------------- budget : capacité d'emprunt ---------------- */
function rendreBudget(){
  const champ = (k, n, d) => '<div class="champ"><label>' + n + '</label><div class="in"><input inputmode="decimal" data-p="' + k + '" value="' + esc(P[k] ? String(P[k]).replace(".", ",") : "") + '" placeholder="0"><span class="u">€/mois</span></div>' + (d ? '<div class="note" style="font-size:11.5px">' + d + '</div>' : "") + '</div>';
  $("#v-budget").innerHTML = '<h2>Tes revenus et crédits</h2><div class="carte"><div class="champs">' +
    champ("revenus", "Revenus nets du foyer", "avant impôt, primes lissées") + champ("creditsEnCours", "Crédits en cours", "toutes mensualités, assurance comprise") +
    champ("loyersPercus", "Loyers déjà perçus", "biens que tu loues déjà") + '</div>' +
    '<div class="note" style="margin-top:8px">Règle des banques (HCSF) : mensualités ≤ 35 % des revenus, assurance comprise, durée ≤ 25 ans ; 70 % des loyers sont comptés comme revenus. Crédit simulé : ' + fmtN(P.duree) + ' ans à ' + fmtN(P.taux, 2) + ' % (Réglages).</div></div>' +
    '<div id="budget-res"></div>';
  $("#v-budget").querySelectorAll("[data-p]").forEach(el => el.addEventListener("input", () => {
    const v = decimal(el.value || "0"); if(isNaN(v)) return;
    P[el.dataset.p] = v; sauverP(); majBudget();
  }));
  majBudget();
}
function majBudget(){
  const box = $("#budget-res"); if(!box) return;
  if(!(+P.revenus > 0)){ box.innerHTML = '<div class="carte note" style="margin-top:10px">Indique tes revenus pour connaître ta capacité d\'emprunt et l\'effet de chaque bien.</div>'; return; }
  const cr = +P.creditsEnCours || 0, lo = +P.loyersPercus || 0;
  const e0 = endettement(cr, lo), dispo = Math.max(0, 0.35 * ((+P.revenus) + 0.7 * lo) - cr);
  let h = '<div class="carte" style="margin-top:10px"><div class="kpis k3" style="margin-top:0">' +
    tuile("Endettement", pct(e0, 1), "aujourd'hui", e0 <= 0.3 ? "bon" : e0 <= 0.35 ? "moyen" : "mauvais", Math.min(1, e0 / 0.35)) +
    tuile("Mensualité libre", eur(dispo), "avant 35 %", dispo > 0 ? "bon" : "mauvais", null) +
    tuile("Empruntable", fmtN(capitalEmpruntable(dispo) / 1000, 0) + " k€", "sans nouveau loyer", "", null) + '</div>' +
    '<div class="note" style="margin-top:8px">Un bien locatif augmente aussi tes revenus retenus (70 % de son loyer) : tu peux souvent emprunter plus que ce montant pour un investissement.</div></div>';
  P.duree > 25 && (h += '<div class="retour attention" style="margin-top:10px">Durée de ' + fmtN(P.duree) + ' ans : au-delà de 25 ans, les banques refusent la plupart des dossiers.</div>');
  // chaque bien seul, puis à la suite dans l'ordre du score tant que ça passe
  const l = biens.filter(b => b.statut !== "écarté").map(b => ({ b, o:calc(b) })).filter(x => x.o.ok && x.o.mens > 0).sort((a, z) => z.o.score - a.o.score);
  if(l.length){
    let crS = cr, loS = lo;
    h += '<h2>Tes biens, un par un</h2><div class="carte"><table class="t"><tr><td class="note">Bien</td><td class="r note">Mensualité</td><td class="r note">Seul</td><td class="r note">À la suite</td></tr>' +
      l.map(({ b, o }) => {
        const seul = endettement(cr + o.mens, lo + o.loyer), suite = endettement(crS + o.mens, loS + o.loyer), passe = suite <= 0.35;
        if(passe){ crS += o.mens; loS += o.loyer; }
        return '<tr class="budget-bien" data-act="ouvrir" data-id="' + b.id + '"><td>' + esc((b.titre || "Sans titre").slice(0, 28)) + '</td><td class="r">' + eur(o.mens) + '</td>' +
          '<td class="r ton-' + (seul <= 0.35 ? "bon" : "mauvais") + '">' + pct(seul, 0) + '</td><td class="r ton-' + (passe ? "bon" : "mauvais") + '">' + (passe ? "✓ " : "✕ ") + pct(suite, 0) + '</td></tr>';
      }).join("") + '</table><div class="note" style="margin-top:6px">Seul : ton endettement si tu achètes uniquement ce bien. À la suite : en achetant dans l\'ordre du score, chaque bien qui garde l\'endettement sous 35 % s\'ajoute aux précédents.</div></div>';
  }
  box.innerHTML = h;
}

/* ---------------- carte des biens ----------------
   Leaflet et les fonds OpenStreetMap ne sont chargés qu'à l'ouverture de la carte. */
let affichage = store.get("affichage", "liste"), leafletPret = null, carteL = null;
function chargerLeaflet(){
  return leafletPret || (leafletPret = new Promise((ok, ko) => {
    const l = document.createElement("link"); l.rel = "stylesheet"; l.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(l);
    const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    s.onload = () => ok(window.L); s.onerror = () => { leafletPret = null; ko(new Error("carte")); };
    document.head.appendChild(s);
  }));
}
const varCss = c => /^var\(/.test(c) ? getComputedStyle(document.documentElement).getPropertyValue(c.slice(4, -1)).trim() : c;
async function rendreCarte(liste){
  const el = $("#carte"); if(!el) return;
  try { await chargerLeaflet(); } catch(e){ el.innerHTML = '<div class="note" style="padding:20px">Carte indisponible (hors ligne ?).</div>'; return; }
  // centre des communes qui n'en ont pas encore
  for(const m of new Set(liste.map(x => refMarche(x.b)).filter(m => m && !m.centre && m.insee))){
    try { const g = await jget("https://geo.api.gouv.fr/communes/" + m.insee + "?fields=centre"); if(g.centre){ m.centre = g.centre.coordinates; sauverP(); } } catch(e){}
  }
  if(!document.body.contains(el)) return;
  if(carteL){ carteL.remove(); carteL = null; }
  carteL = L.map(el);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19, attribution:"© OpenStreetMap" }).addTo(carteL);
  const pts = [], parVille = {};
  for(const { b, o } of liste){
    let p = b.lat && b.lng ? [b.lat, b.lng] : null, approx = !!b.posApprox;
    if(!p){
      const m = refMarche(b); if(!m || !m.centre) continue;
      // biens sans position : autour du centre de la commune, légèrement écartés pour ne pas se cacher
      const i = parVille[m.insee] = (parVille[m.insee] || 0) + 1;
      p = [m.centre[1] + 0.0025 * Math.sin(i * 2.4) * Math.sqrt(i), m.centre[0] + 0.0035 * Math.cos(i * 2.4) * Math.sqrt(i)]; approx = true;
    }
    const mk = L.circleMarker(p, { radius:11, color:"#fff", weight:2, fillColor: varCss(o.ok ? o.couleur : "var(--gris)"), fillOpacity:.95 }).addTo(carteL);
    mk.bindTooltip(String(o.ok ? o.score : "–"), { permanent:true, direction:"center", className:"carte-score" });
    mk.bindPopup('<b>' + esc(b.titre || "Sans titre") + '</b><br>' + esc([b.prix ? eur(b.prix) : "", b.surface ? fmtN(b.surface) + " m²" : "", o.ok ? "brut " + pct(o.brut) : ""].filter(Boolean).join(" · ")) +
      (approx ? '<br><span style="color:#6c706d">position approximative</span>' : "") + '<br><button class="btn petit pri" style="margin-top:6px">Ouvrir l\'analyse</button>');
    mk.on("popupopen", e => { const x = e.popup.getElement().querySelector("button"); if(x) x.onclick = () => { courant = b.id; store.set("courant", courant); derniereLecture = null; allerVue("analyse"); }; });
    pts.push(p);
  }
  if(pts.length) carteL.fitBounds(pts, { padding:[40, 40], maxZoom:14 }); else carteL.setView([46.6, 2.4], 5);
}

function telecharger(nom, contenu, type){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([contenu], { type }));
  a.download = nom; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const dateFichier = () => new Date().toISOString().slice(0, 10);
function exporterJSON(){ telecharger("rendement-" + dateFichier() + ".json", JSON.stringify({ app:"Rendement", version:VERSION, schema:SCHEMA, date:new Date().toISOString(), params:P, biens }, null, 1), "application/json"); }
function importerJSON(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if(!Array.isArray(d.biens)) throw 0;
      biens = d.biens.map(b => nouveauBien(b));
      if(d.params) P = Object.assign({}, P_DEFAUT, d.params);
      sauverB(); sauverP(); courant = biens[0] ? biens[0].id : null; store.set("courant", courant);
      toast(biens.length + " biens importés"); rendre();
    } catch(x){ toast("Fichier non reconnu"); }
  };
  r.readAsText(f);
}
function exporterCSV(){
  const col = ["Titre","Ville","Prix","Surface","Prix m²","DPE","Loyer","Loyer estimé","Coût total","Brut annonce","Brut réel","Net","Net-net","Cash-flow/mois","Offre max","TRI","Enrichissement","Régime","Score","Suivi","Lien"];
  const L = [col.join(";")];
  for(const b of biens){
    const o = calc(b);
    const n = (x, d = 0) => fmtN(x, d).replace(/ /g, "");
    L.push([b.titre, b.ville, b.prix, b.surface, n(o.prixM2), b.dpe, n(o.loyer), o.loyerEstime ? "oui" : "non", n(o.cout), n(o.brutAnnonce * 100, 2), n(o.brut * 100, 2), n(o.net * 100, 2), n(o.netNet * 100, 2), n(o.cfNet), n(o.offre), o.sim && o.sim.tri != null ? n(o.sim.tri * 100, 1) : "", o.sim ? n(o.sim.enrichissement) : "", o.regime, o.score, b.statut, b.url]
      .map(x => '"' + String(x == null ? "" : x).replace(/"/g, '""') + '"').join(";"));
  }
  telecharger("rendement-" + dateFichier() + ".csv", "﻿" + L.join("\r\n"), "text/csv");
}

  else if(a === "tri-effacer"){ const T = store.get("triPage", null); store.set("triPage", null); rendreTri(); toast("Tri effacé", { label:"Annuler", fn:() => { store.set("triPage", T); rendreTri(); } }); }
  else if(a === "tri-ajout"){
    const T = store.get("triPage", null), x = T && T.items[+el.dataset.i]; if(!x) return;
    const b = bienDeListe(x);
    integrer({ url:x.url, titre:b.titre, type:x.type, prix:x.prix, surface:x.surface, pieces:x.pieces, ville:x.ville, cp:x.cp, dpe:x.dpe, etat:x.etat || null, coproProcedure:x.proc || null,
      lat:x.lat, lng:x.lng, posApprox: x.lat ? true : null, photos:b.photos, vignette:x.photo }, "liste");
    derniereLecture = null;
    rendreTri();
    toast("Ajouté à tes biens. Ouvre l'annonce ↗ et lance le favori pour compléter (charges, DPE…)");
  }
  else if(a === "onglet"){ onglet = el.dataset.o; majOnglets(); rendreResultats(); }
  else if(a === "lettre") imprimerLettre();
  else if(a === "ventes-reessayer"){ const b = bienCourant(); if(b){ ventesErreur.delete(b.id); rendreResultats(); } }
  else if(a === "vis"){
    const b = bienCourant(); if(!b) return;
    b.visite = b.visite || { c:{} }; b.visite.c = b.visite.c || {};
    const k = el.dataset.vk;
    if(b.visite.c[k] === el.dataset.e) delete b.visite.c[k]; else b.visite.c[k] = el.dataset.e;
    sauverB();
    el.parentNode.querySelectorAll(".vb").forEach(x => x.classList.toggle("on", x.dataset.e === b.visite.c[k]));
    $("#vis-prog").textContent = visiteProgression(b);
    rendreResultats();
  }
  else if(a === "passer-meuble"){
    const b = bienCourant(); if(!b) return;
    const avant = { meuble:b.meuble, loyer:b.loyer, mobilier:b.mobilier }, m = el.dataset.m === "1", c = comparerRegimes(b, calc(b));
    b.meuble = m; b.mobilier = m ? (+b.mobilier || c.mob) : 0;
    if(b.loyer != null && b.loyer !== "") b.loyer = Math.round(m ? c.loyerMeuble : c.loyerNu);
    b.maj = Date.now(); sauverB(); rendreAnalyse();
    toast(m ? "Bien passé en meublé (loyer et mobilier ajustés)" : "Bien passé en location nue", { label:"Annuler", fn:() => { Object.assign(b, avant); sauverB(); rendreAnalyse(); } });
  }
  else if(a === "localiser"){
    const b = bienCourant(), q = (($("#adr") || {}).value || "").trim(); if(!b) return;
    if(!q){ toast("Tape l'adresse du bien"); return; }
    const ref = refMarche(b);
    try {
      const r = await jget("https://api-adresse.data.gouv.fr/search/?q=" + encodeURIComponent(q + " " + (b.ville || "")) + (ref && ref.insee ? "&citycode=" + ref.insee : b.cp ? "&postcode=" + b.cp : "") + "&limit=1");
      const ft = r.features && r.features[0];
      if(!ft || ft.properties.score < 0.4){ toast("Adresse introuvable" + (b.ville ? " à " + b.ville : "")); return; }
      b.lng = ft.geometry.coordinates[0]; b.lat = ft.geometry.coordinates[1]; b.adresse = ft.properties.label; b.posApprox = false;
      b.maj = Date.now(); sauverB(); ventesErreur.delete(b.id);
      if(document.activeElement) document.activeElement.blur();
      toast("Bien localisé : " + ft.properties.label); rendreResultats();
    } catch(x){ toast("Recherche d'adresse injoignable"); }
  }
  else if(a === "vue-biens") allerVue("biens");
  else if(a === "suppr-bien"){
    const i = biens.findIndex(x => x.id === el.dataset.id); if(i < 0) return;
    const b = biens.splice(i, 1)[0]; sauverB();
    if(courant === b.id){ courant = biens[0] ? biens[0].id : null; store.set("courant", courant); }
    rendreBiens();
    const nom = (b.titre || "Bien").slice(0, 28);
    toast("« " + nom + " » supprimé", { label:"Annuler", fn:() => { biens.splice(i, 0, b); sauverB(); rendre(); } });
  }
  else if(a === "haut") window.scrollTo({ top:0, behavior:"smooth" });
  else if(a === "voir-alertes"){ const x = $("#alertes"); if(x) window.scrollTo({ top:x.getBoundingClientRect().top + scrollY - 110, behavior:"smooth" }); }
  else if(a === "sim-offre"){
    const b = bienCourant(); if(!b) return;
    const o = calc(b);
    if(o.nego <= 0){ toast("L'objectif est déjà atteint au prix affiché"); return; }
    simNego = clamp(Math.ceil(o.nego * 100), 0, 30); simPour = b.id; rendreResultats();
    if(o.nego > 0.3) toast("Offre max au-delà de −30 % : curseur au maximum");
  }
  else if(a === "sim-retenir"){
    const b = bienCourant(); if(!b || !simNego) return;
    const nv = bienSimule(b).prix, ancien = b.prix;
    b.hist.push({ d:Date.now(), prix:ancien }); b.prix = nv; b.maj = Date.now(); simNego = 0; sauverB(); rendreAnalyse();
    toast("Prix retenu : " + eur(nv), { label:"Annuler", fn:() => { b.prix = ancien; b.hist.pop(); sauverB(); rendreAnalyse(); } });
  }
  else if(a === "supprimer"){
    const b = bienCourant(); if(!b) return;
    const i = biens.indexOf(b); biens.splice(i, 1); sauverB();
    courant = biens[0] ? biens[0].id : null; store.set("courant", courant);
    allerVue("biens");
    toast("Bien supprimé", { label:"Annuler", fn:() => { biens.splice(i, 0, b); sauverB(); courant = b.id; store.set("courant", courant); rendre(); } });
  }
  else if(a === "dupliquer"){
    const b = bienCourant(); if(!b) return;
    const c = nouveauBien(Object.assign(JSON.parse(JSON.stringify(b)), { id:uid(), titre:b.titre + " (copie)", url:"", hist:[], cree:Date.now(), maj:Date.now() }));
    biens.unshift(c); sauverB(); courant = c.id; store.set("courant", courant); derniereLecture = null; rendreAnalyse(); toast("Copie créée : fais varier les hypothèses");
  }
  else if(a === "ajout-ville") ajouterVille();
  else if(a === "suppr-ville"){ const i = +el.dataset.i, m = P.marche[i]; P.marche.splice(i, 1); sauverP(); rendreReglages(); toast(m.ville + " supprimée", { label:"Annuler", fn:() => { P.marche.splice(i, 0, m); sauverP(); rendreReglages(); } }); }
  else if(a === "maj-ville"){
    const m = P.marche[+el.dataset.i]; if(!m) return;
    const p = chargerVille(m.ville, m.cp); rendreReglages();
    const r = await p.catch(() => null); rendreReglages();
    toast(!r ? "Pas de connexion aux données publiques" : r.introuvable ? "Commune introuvable" : r.vide ? "Pas de données publiques pour cette commune" : m.ville + " mise à jour");
  }
  else if(a === "maj-tout"){ toast("Actualisation…"); const k = await rafraichirMarche(true); rendreReglages(); toast(k ? k + " ville(s) mises à jour" : "Pas de connexion aux données publiques"); }
  else if(a === "reglages-defaut"){ const m = P.marche; P = Object.assign({}, P_DEFAUT, { marche:m }); sauverP(); rendreReglages(); toast("Réglages par défaut (villes conservées)"); }
  else if(a === "copier-favori"){
    try { await navigator.clipboard.writeText(decodeURIComponent(codeFavori())); toast("Code du favori copié"); }
    catch(x){ $("#modal").innerHTML = '<div class="mdl-bg" data-act="fermer-modal"><div class="mdl"><h3>Code du favori</h3><div class="sous">Sélectionne et copie tout le texte</div><div class="code" style="max-height:240px;user-select:all">' + esc(decodeURIComponent(codeFavori())) + '</div><div class="btns"><button class="btn" data-act="fermer-modal">Fermer</button></div></div></div>'; }
  }
  else if(a === "export-json") exporterJSON();
  else if(a === "import-json") $("#fichier").click();
  else if(a === "export-csv") exporterCSV();
  else if(a === "theme"){ theme = { auto:"clair", clair:"sombre", sombre:"auto" }[theme]; store.set("theme", theme); appliquerTheme(); rendreReglages(); }
  else if(a === "installer") installer();
  else if(a === "diag-install") diagnostic();
  else if(a === "journal") journal();
});
document.addEventListener("keydown", e => { if(e.key === "Enter" && (e.ctrlKey || e.metaKey) && e.target.id === "saisie") analyserSaisie(); });
document.addEventListener("keydown", e => { if(e.key === "Enter" && e.target.id === "adr"){ e.preventDefault(); const x = document.querySelector('[data-act="localiser"]'); if(x) x.click(); } });
document.addEventListener("keydown", e => {
  const d = $("#modal .defil"); if(!d) return;
  if(e.key === "Escape") $("#modal").innerHTML = "";
  else if(e.key === "ArrowRight" || e.key === "ArrowLeft") d.scrollBy({ left:(e.key === "ArrowRight" ? 1 : -1) * d.clientWidth, behavior:"smooth" });
});
/* annonce copiée ailleurs : en revenant dans l'appli, on propose de l'analyser.
   Seulement si le navigateur a déjà donné l'accès au presse-papiers (premier
   usage du bouton « Coller ») : jamais de demande d'autorisation surprise. */
async function verifierPressePapiers(){
  if(document.visibilityState !== "visible" || !navigator.clipboard || !navigator.permissions) return;
  try {
    const p = await navigator.permissions.query({ name:"clipboard-read" });
    if(p.state !== "granted") return;
    const t = ((await navigator.clipboard.readText()) || "").trim();
    if(!t || t.length > 30000 || t === store.get("dernierPP", "")) return;
    const f = parseTexte(t);
    if(!(f.prix && f.surface)) return;
    store.set("dernierPP", t);
    toast("Annonce copiée : " + [f.surface ? fmtN(f.surface) + " m²" : "", f.ville || "", eur(f.prix)].filter(Boolean).join(" · "), { label:"Analyser", fn:() => analyserSaisie(t) });
  } catch(e){}
}
document.addEventListener("visibilitychange", verifierPressePapiers);
window.addEventListener("focus", verifierPressePapiers);
document.addEventListener("change", e => { if(e.target.id === "fichier-photo"){ ajouterPhotos([...e.target.files]); e.target.value = ""; } });
// coller une annonce suffit : l'analyse part toute seule
document.addEventListener("paste", e => { if(e.target.id === "saisie") setTimeout(analyserSaisie, 0); });

/* ---------------- plusieurs onglets ----------------
   Le favori ouvre l'appli dans un autre onglet (ou à côté de l'appli installée) :
   chaque onglet relit les données enregistrées dès qu'un autre les modifie, et en
   revenant au premier plan. Sinon il afficherait, puis réenregistrerait, une liste périmée. */
function rechargerStockage(){
  const nb = store.get("biens", null);
  if(Array.isArray(nb)) biens = nb;
  P = Object.assign({}, P_DEFAUT, store.get("params", {}));
  if(!Array.isArray(P.marche)) P.marche = MARCHE_DEFAUT.slice();
  // on garde le bien affiché ici, sauf s'il a été supprimé ailleurs
  if(!biens.some(b => b.id === courant)) courant = store.get("courant", biens[0] ? biens[0].id : null);
  const a = document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== "range" && document.hasFocus()) return;   // ne pas couper une saisie
  rendre();
}
window.addEventListener("storage", e => { if(!e.key || /^rendement\.(biens|params|triPage)$/.test(e.key)) rechargerStockage(); });
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") rechargerStockage(); });
// nom de l'onglet : le favori l'ouvre avec ce nom, ce qui permet au navigateur de le réutiliser
if(!window.name) window.name = "rendement";

/* ---------------- démarrage ---------------- */
$("#ver-chip").textContent = "v" + VERSION;
if(!recevoir()) rendre();
setTimeout(() => rafraichirMarche(false), 400);
setTimeout(nettoyerPhotos, 5000);
setTimeout(() => majTauxMarche(false), 700);
window.addEventListener("online", () => rafraichirMarche(false));
</script>
