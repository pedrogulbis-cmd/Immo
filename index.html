<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rendement">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Calcule la rentabilité d'un investissement locatif à partir d'une annonce Leboncoin ou SeLoger : rendement brut, net, net-net, cash-flow, offre maximale et score.">
<title>Rendement — investissement locatif</title>
<script>
/* Manifeste construit ici même, comme dans CashFlow et Baby Name : adresses
   complètes calculées d'après l'emplacement réel de la page (GitHub Pages,
   sous-dossier…). share_target permet, une fois installée sur Android, de
   recevoir un lien partagé depuis une autre appli. */
(function(){
  try {
    var base = location.href.split("#")[0].split("?")[0].replace(/[^\/]*$/, "");
    var man = {
      name: "Rendement", short_name: "Rendement",
      description: "Rentabilité locative d'une annonce : brut, net, cash-flow, offre max et score.",
      lang: "fr", start_url: base, scope: base, id: base,
      display: "standalone", orientation: "portrait",
      background_color: "#f6f5f1", theme_color: "#ffffff",
      icons: [
        { src: base + "icons/icon-192.png", sizes: "192x192", type: "image/png", purpose: "any" },
        { src: base + "icons/icon-512.png", sizes: "512x512", type: "image/png", purpose: "any" },
        { src: base + "icons/icon-maskable-512.png", sizes: "512x512", type: "image/png", purpose: "maskable" }
      ],
      share_target: { action: base, method: "GET", params: { title: "title", text: "text", url: "url" } }
    };
    var l = document.createElement("link");
    l.rel = "manifest";
    l.href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: "application/manifest+json" }));
    document.head.appendChild(l);
  } catch(e){}
})();
</script>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --fond:#f6f5f1; --carte:#ffffff; --carte2:#f0eee8; --texte:#1b1d1c; --gris:#6c706d; --ligne:#e3e0d8;
  --acc:#1f6f50; --acc-doux:#e3f0ea; --bon:#1f8a5b; --ok:#6a9a2a; --moyen:#c48a12; --mauvais:#c4442f;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --sans:"Inter Tight",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --ombre:0 1px 2px rgba(0,0,0,.04),0 2px 10px rgba(0,0,0,.04);
}
[data-theme="sombre"]{
  --fond:#0f1110; --carte:#181b19; --carte2:#20241f; --texte:#ecefec; --gris:#9aa19c; --ligne:#2a2f2b;
  --acc:#4fbf8d; --acc-doux:#1b3229; --bon:#45c08a; --ok:#9cc65a; --moyen:#e0a83a; --mauvais:#ec6f58;
  --ombre:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:var(--texte);font-family:var(--sans);font-size:15px;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:var(--fond);border-bottom:1px solid var(--ligne);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;gap:10px;height:54px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--acc);display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.titre-app{font-weight:700;font-size:18px;letter-spacing:-.01em}
.chip{font-family:var(--mono);font-size:11px;color:var(--gris);border:1px solid var(--ligne);border-radius:99px;padding:2px 8px;cursor:pointer;background:none}
.esp{flex:1}
.btn{border:1px solid var(--ligne);background:var(--carte);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500;font-size:14px}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
[data-theme="sombre"] .btn.pri{color:#06120d}
.btn.lien{border:none;background:none;color:var(--acc);padding:6px 4px}
.btn.dang{color:var(--mauvais)}
.btn.petit{padding:6px 10px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--gris);font-weight:600;margin:22px 0 8px}
.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);padding:14px;box-shadow:var(--ombre)}
.carte+.carte{margin-top:10px}
.note{font-size:13px;color:var(--gris);line-height:1.55}
.mono{font-family:var(--mono)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* barre d'onglets */
nav.bas{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--carte);border-top:1px solid var(--ligne);padding-bottom:env(safe-area-inset-bottom)}
nav.bas .wrap{display:flex}
nav.bas button{flex:1;background:none;border:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--gris);cursor:pointer}
nav.bas button svg{width:22px;height:22px}
nav.bas button.on{color:var(--acc);font-weight:600}

/* import */
.import textarea{width:100%;min-height:74px;border:1px solid var(--ligne);border-radius:10px;padding:10px 12px;background:var(--carte2);resize:vertical;font-size:14px}
.import textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
a.btn{color:var(--acc)}
.retour{margin:10px 0;font-size:13px;line-height:1.55;border-radius:10px;padding:10px 12px;background:var(--acc-doux)}
.retour.attention{background:color-mix(in srgb,var(--moyen) 15%,transparent)}
.retour b{font-weight:600}

/* liste des biens */
.outils{display:flex;gap:8px;align-items:center;margin:14px 0 8px}
.outils select{border:1px solid var(--ligne);background:var(--carte);border-radius:10px;padding:8px 10px;font-size:14px}
.bien{display:flex;gap:12px;align-items:center;cursor:pointer}
.bien .inf{flex:1;min-width:0}
.bien .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bien .s{font-size:13px;color:var(--gris);margin-top:2px}
.bien .k{display:flex;gap:12px;margin-top:6px;font-size:13px;flex-wrap:wrap}
.bien .k span b{font-family:var(--mono);font-weight:500}
.pastille{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:500;font-size:17px;color:#fff;flex:none}
.statut{font-size:11px;border-radius:99px;padding:2px 8px;background:var(--carte2);color:var(--gris);margin-left:6px;vertical-align:1px;font-weight:500}
.vide{text-align:center;padding:30px 10px}

/* analyse */
.score{display:flex;gap:16px;align-items:center}
.anneau{position:relative;width:96px;height:96px;flex:none}
.anneau svg{width:96px;height:96px;transform:rotate(-90deg)}
.anneau .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.anneau .v b{font-family:var(--mono);font-size:28px;font-weight:500;line-height:1}
.anneau .v small{display:block;font-size:11px;color:var(--gris);margin-top:2px}
.verdict{font-size:20px;font-weight:700;letter-spacing:-.01em}
.verdict-s{font-size:13px;color:var(--gris);margin-top:3px;line-height:1.45}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.kpi{background:var(--carte2);border-radius:10px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--gris)}
.kpi .v{font-family:var(--mono);font-size:19px;margin-top:3px}
.kpi .d{font-size:11px;color:var(--gris);margin-top:2px}
.offre{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.offre .gros{font-family:var(--mono);font-size:24px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td{padding:7px 0;border-bottom:1px solid var(--ligne)}
table.t tr:last-child td{border-bottom:none}
table.t td.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
table.t tr.tot td{font-weight:600}
table.t .est{color:var(--gris);font-style:italic;font-size:12px}
.barre{height:6px;border-radius:9px;background:var(--carte2);overflow:hidden;margin-top:4px}
.barre i{display:block;height:100%;border-radius:9px;background:var(--acc)}
.crit{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:8px 0 10px;font-size:13px}
.crit .p{font-family:var(--mono);color:var(--gris)}
.alerte{display:flex;gap:10px;font-size:13px;line-height:1.5;padding:8px 0;border-bottom:1px solid var(--ligne)}
.alerte:last-child{border-bottom:none}
.alerte .ic{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
details.pli{margin-top:10px}
details.pli summary{cursor:pointer;font-weight:600;font-size:14px;padding:4px 0;list-style:none}
details.pli summary::before{content:"▸ ";color:var(--gris)}
details.pli[open] summary::before{content:"▾ "}

/* formulaire */
.champs{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.champ{display:flex;flex-direction:column;gap:4px;min-width:0}
.champ.large{grid-column:1/-1}
.champ label{font-size:12px;color:var(--gris)}
.champ .in{display:flex;align-items:center;border:1px solid var(--ligne);border-radius:10px;background:var(--carte2);overflow:hidden}
.champ .in:focus-within{outline:2px solid var(--acc);outline-offset:-1px}
.champ input,.champ select{flex:1;min-width:0;border:none;background:none;padding:9px 10px;font-size:15px;outline:none}
.champ input::placeholder{color:var(--gris);opacity:.85;font-style:italic}
.champ .u{padding:0 10px;color:var(--gris);font-size:13px;white-space:nowrap}
.champ.trouve .in{border-color:var(--acc)}
.bascule{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 0}
.bascule input{width:20px;height:20px;accent-color:var(--acc)}
.lig{display:flex;align-items:center;gap:12px;justify-content:space-between}
.lig .l{flex:1}
.lig .d{font-size:12px;color:var(--gris);margin-top:2px;line-height:1.45}
.ajout{display:flex;gap:8px;align-items:center}
.ajout .champ{flex:1}
.ville-m{border-top:1px solid var(--ligne);margin-top:12px;padding-top:10px}
.ville-m .lig .btn.lien{font-size:17px;padding:4px 8px}
.champs.c4{grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.champs.c4 input{padding:7px 8px;font-size:14px}
.champs.c4 label{font-size:11px}
@media (max-width:520px){ .champs.c4{grid-template-columns:1fr 1fr} }
.code{font-family:var(--mono);font-size:11px;word-break:break-all;background:var(--carte2);border-radius:8px;padding:8px;max-height:80px;overflow:auto;color:var(--gris)}
a.favori{display:inline-block;background:var(--acc);color:#fff;text-decoration:none;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
[data-theme="sombre"] a.favori{color:#06120d}
ol.etapes{padding-left:20px;margin:6px 0;font-size:13px;line-height:1.6;color:var(--gris)}
ol.etapes b{color:var(--texte);font-weight:600}

#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--texte);color:var(--fond);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:50;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast .toast-act{background:none;border:none;color:var(--acc-doux);font-weight:600;cursor:pointer;padding:0}
#modal .mdl-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:grid;place-items:center;padding:16px}
#modal .mdl{background:var(--carte);border-radius:16px;max-width:520px;width:100%;max-height:80vh;overflow:auto;padding:18px}
#modal h3{margin:0 0 4px}
#modal .sous{color:var(--gris);font-size:13px;margin-bottom:10px}
#modal ul{padding-left:18px;font-size:14px;line-height:1.55}

/* synthèse en tête de l'analyse */
.syn-tete{display:flex;gap:14px;align-items:center}
.syn-tete .inf{flex:1;min-width:0}
.syn .verdict{font-size:18px}
.syn .verdict-s{margin-top:10px}
.syn-titre{font-weight:600;font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.syn-sous{font-size:12.5px;color:var(--gris);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dpe{display:inline-grid;place-items:center;min-width:20px;height:18px;padding:0 5px;border-radius:5px;font-weight:700;font-size:11px;color:#fff}
.anneau.p,.anneau.p svg{width:72px;height:72px}
.anneau.p .v b{font-size:22px}
.anneau.p .v small{font-size:10px;margin-top:0}
.syn-prix{display:flex;align-items:center;gap:8px;margin-top:12px;padding:12px 0;border-top:1px solid var(--ligne);border-bottom:1px solid var(--ligne)}
.syn-prix>div{flex:1;min-width:0}
.syn-prix .fl{flex:none;color:var(--gris);font-size:18px}
.syn-prix .l{font-size:12px;color:var(--gris)}
.syn-prix .gros{font-family:var(--mono);font-size:21px;margin-top:2px}
.syn-prix .d{font-size:12px;margin-top:1px}
.kpis.k3{grid-template-columns:repeat(3,1fr)}
.kpis.k3 .kpi{padding:9px 10px}
.kpis.k3 .kpi .v{font-size:16px;letter-spacing:-.02em;white-space:nowrap}
.kpi{border-left:3px solid transparent}
.kpi .barre{height:4px;margin-top:6px}
.kpi.bon{border-left-color:var(--bon)} .kpi.bon .v{color:var(--bon)} .kpi.bon .barre i{background:var(--bon)}
.kpi.moyen{border-left-color:var(--moyen)} .kpi.moyen .v{color:var(--moyen)} .kpi.moyen .barre i{background:var(--moyen)}
.kpi.mauvais{border-left-color:var(--mauvais)} .kpi.mauvais .v{color:var(--mauvais)} .kpi.mauvais .barre i{background:var(--mauvais)}
.flux{margin-top:14px}
.flux-t{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--gris)}
.flux-t b{font-family:var(--mono);font-weight:500;white-space:nowrap}
.pile{position:relative;display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--carte2);margin-top:6px}
.pile i{display:block;height:100%}
.pile .effort{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(45deg,transparent 0 4px,rgba(0,0,0,.3) 4px 7px);border-left:2px solid var(--texte)}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:12px;color:var(--gris)}
.leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.syn-al{display:flex;width:100%;align-items:center;gap:8px;margin-top:12px;padding:9px 12px;border:none;border-radius:10px;background:color-mix(in srgb,var(--moyen) 14%,transparent);font-size:13px;cursor:pointer;text-align:left}
.syn-al.r{background:color-mix(in srgb,var(--mauvais) 14%,transparent)}
.syn-al span{flex:1}
.sim{margin-top:10px}
.sim input[type=range]{width:100%;accent-color:var(--acc);margin:10px 0 2px}
.sim-ech{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--gris)}
#barre-kpi{position:fixed;left:0;right:0;top:calc(55px + env(safe-area-inset-top));z-index:19;background:var(--carte);border-bottom:1px solid var(--ligne);box-shadow:0 4px 12px rgba(0,0,0,.06);cursor:pointer}
#barre-kpi .wrap{display:flex;align-items:center;gap:6px;height:46px}
#barre-kpi .pastille{width:32px;height:32px;font-size:13px}
#barre-kpi .bk{flex:1;text-align:center;min-width:0}
#barre-kpi .bk small{display:block;font-size:10.5px;color:var(--gris)}
#barre-kpi .bk b{font-family:var(--mono);font-weight:500;font-size:13px;white-space:nowrap}
.bien .suppr{flex:none;color:var(--gris);padding:8px;align-self:center}
.bien .suppr svg{width:18px;height:18px;display:block}
.bien .suppr:hover{color:var(--mauvais)}
@media (max-width:350px){ .kpis.k3{grid-template-columns:1fr 1fr} }

/* comparaison */
.coche{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ligne);display:grid;place-items:center;color:transparent;font-size:14px;font-weight:700;align-self:center}
.coche.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bien.choisi{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.barre-comp{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:25;padding:0 16px}
.barre-comp .in{max-width:648px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--texte);color:var(--fond);border-radius:14px;padding:8px 8px 8px 16px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.barre-comp .in span{flex:1}
.comp-tete{display:grid;gap:8px;position:sticky;top:calc(55px + env(safe-area-inset-top));z-index:5;background:var(--fond);padding:8px 0}
.comp-col{text-align:center;cursor:pointer;background:var(--carte);border:1px solid var(--ligne);border-radius:12px;padding:10px 6px;min-width:0}
.comp-col .pastille{width:40px;height:40px;font-size:15px;margin:0 auto}
.comp-t{font-size:12.5px;font-weight:600;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.comp-v{font-size:12px;font-weight:600;margin-top:2px}
.comp-sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--gris);font-weight:600;margin:16px 0 2px}
.comp-sec:first-child{margin-top:0}
.comp-l{padding:7px 0;border-bottom:1px solid var(--ligne)}
.comp-n{font-size:12px;color:var(--gris);margin-bottom:3px}
.comp-vals{display:grid;gap:8px}
.comp-vals>div{text-align:center;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;border-radius:8px;padding:3px 2px;min-width:0}
.comp-vals small{display:block;font-family:var(--sans);font-size:11px;color:var(--gris);font-weight:400}
.comp-vals .txt{font-family:var(--sans);font-size:12.5px;overflow-wrap:anywhere}
.comp-vals .mieux{background:var(--acc-doux);color:var(--bon);font-weight:600}

/* fiche PDF pour la banque : invisible à l'écran, seule chose imprimée */
#impression{display:none}
@media print{
  @page{size:A4;margin:14mm}
  html,body{background:#fff!important;color:#111!important;padding:0!important;font-size:10.5pt}
  body>*:not(#impression){display:none!important}
  #impression{display:block;color:#111}
  #impression *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.imp-tete{display:flex;justify-content:space-between;gap:16pt;align-items:flex-start;border-bottom:2px solid #1f6f50;padding-bottom:8pt;margin-bottom:10pt}
.imp-sur{font-size:9pt;text-transform:uppercase;letter-spacing:.08em;color:#1f6f50;font-weight:600}
#impression h1{font-size:17pt;margin:2pt 0;line-height:1.2}
.imp-sous,.imp-date{color:#555;font-size:10pt}
.imp-date{white-space:nowrap}
.imp-url{font-size:8pt;color:#555;word-break:break-all;margin-top:2pt}
.imp-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6pt;margin-bottom:4pt}
.imp-kpis div{border:1px solid #ddd;border-radius:6pt;padding:6pt 8pt;background:#f6f5f1}
.imp-kpis span{display:block;font-size:8.5pt;color:#555}
.imp-kpis b{font-family:var(--mono);font-size:13pt;font-weight:500}
.imp-2col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16pt}
#impression h2{font-size:9.5pt;color:#1f6f50;margin:12pt 0 3pt}

<script>
"use strict";
const VERSION = "1.3.0";
const SCHEMA = 1;
const JOURNAL = [
  { v:"1.3.0", d:"2026-10-23", t:"Comparer et présenter", l:[
    "Comparer 2 ou 3 biens côte à côte : bouton « Comparer » dans la liste, le meilleur chiffre de chaque ligne en vert.",
    "Fiche PDF pour la banque : plan de financement, loyers, charges, rentabilité, mensualité couverte par le loyer.",
    "Annonce copiée détectée : en revenant dans l'appli, elle propose de l'analyser (après un premier usage du bouton « Coller »).",
    "Le favori « → Rendement » réutilise toujours le même onglet au lieu d'en ouvrir un nouveau (recrée le favori pour en profiter).",
    "Leboncoin : charges de copro et taxe foncière lues aussi dans les caractéristiques de l'annonce quand elles y sont."
  ]},
  { v:"1.2.0", d:"2026-10-23", t:"Synthèse en un coup d'œil", l:[
    "L'analyse s'ouvre sur une fiche synthèse : prix, offre max, 6 indicateurs colorés (vert / orange / rouge) et où va le loyer chaque mois.",
    "Une barre d'indicateurs reste affichée en haut quand tu descends modifier les champs.",
    "« Et si je négocie ? » : un curseur pour voir l'effet d'une baisse de prix sur tous les chiffres, et la retenir.",
    "Suppression d'un bien directement depuis la liste (avec Annuler).",
    "Coller une annonce dans la zone de saisie lance l'analyse tout seul.",
    "Les 8 biens du fichier Excel ne sont plus chargés : ils sont retirés une fois pour toutes."
  ]},
  { v:"1.1.0", d:"2026-10-23", t:"Marché automatique", l:[
    "Les prix et loyers au m² d'une ville se chargent tout seuls : il suffit de taper son nom.",
    "Prix : ventes réelles des 12 derniers mois (DVF, data.gouv.fr). Loyers : Carte des loyers 2025 du ministère du Logement.",
    "Valeurs séparées appartement / maison, utilisées selon le type du bien.",
    "Une annonce d'une nouvelle ville ajoute automatiquement sa référence marché.",
    "Les références se mettent à jour d'elles-mêmes tous les 30 jours (sauf celles que tu as modifiées à la main)."
  ]},
  { v:"1.0.0", d:"2026-10-22", t:"Première version", l:[
    "Reprise du fichier Excel (biens de départ retirés en 1.2.0).",
    "Calcul corrigé : frais de notaire (8 % dans l'ancien, Rhône), travaux et mobilier inclus dans le coût total.",
    "Rendement brut, net de charges, net-net d'impôt, cash-flow mensuel avec crédit.",
    "Offre maximale pour atteindre l'objectif (10 % par défaut) et négociation nécessaire.",
    "Score sur 100 : rendement, cash-flow, prix vs marché, DPE, fiabilité du loyer.",
    "Import d'annonce : favori « → Rendement » sur Leboncoin / SeLoger, ou texte collé.",
    "Références marché par ville (prix et loyer au m²) modifiables.",
    "Installable comme application (Android, iPhone, ordinateur), fonctionne hors ligne."
  ]}
];

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const fmtN = (n, d = 0) => (isFinite(n) ? n : 0).toLocaleString("fr-FR", { minimumFractionDigits:d, maximumFractionDigits:d }).replace(/[  ]/g, " ");
const eur = (n, d = 0) => fmtN(n, d) + " €";
const pct = (x, d = 1) => fmtN(x * 100, d) + " %";
const sgn = n => (n > 0 ? "+" : n < 0 ? "−" : "") + eur(Math.abs(n));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------------- stockage local ---------------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem("rendement." + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("rendement." + k, JSON.stringify(v)); } catch(e){} }
};

/* ---------------- paramètres ---------------- */
/* Références marché. Valeurs de départ (RealAdvisor, octobre 2026) remplacées
   dès la première connexion par les données publiques (voir « marché » plus bas). */
const MARCHE_DEFAUT = [
  { ville:"Villefranche-sur-Saône", cp:"69400", insee:"69264", prixM2:2566, loyerM2:14.4, src:"RealAdvisor oct. 2026" },
  { ville:"Gleizé", cp:"69400", insee:"69092", prixM2:2994, loyerM2:14.1, src:"RealAdvisor oct. 2026" },
  { ville:"Dardilly", cp:"69570", insee:"69072", prixM2:4662, loyerM2:21.2, src:"RealAdvisor oct. 2026" }
];
const P_DEFAUT = {
  objectif:10, base:"brute",
  notaire:8, coproNonRecup:30, vacance:4, entretien:5, gestion:0, gli:0, pno:150,
  credit:true, apportMode:"frais", apportFixe:20000, taux:3.7, duree:20, assurance:0.30,
  tmi:30, psFoncier:17.2, psLmnp:18.6, lmnp:"reel",
  ajusterSurface:true, marche:MARCHE_DEFAUT
};
let P = Object.assign({}, P_DEFAUT, store.get("params", {}));
if(!Array.isArray(P.marche)) P.marche = MARCHE_DEFAUT.slice();
const sauverP = () => store.set("params", P);

/* ---------------- marché : données publiques ----------------
   Commune : geo.api.gouv.fr. Prix au m² : DVF (ventes notariées), statistiques
   mensuelles Etalab, 12 derniers mois disponibles (repli : 5 ans). Loyers :
   « Carte des loyers 2025 », ministère du Logement / ANIL (loyers d'annonce,
   charges comprises). Tout passe par l'API tabulaire de data.gouv.fr, qui
   accepte les appels directs depuis une page web. */
const API_T = "https://tabular-api.data.gouv.fr/api/resources/";
const RES = { mois:"03fba98d-885b-43c0-8986-d299cabc29da", total:"851d342f-9c96-41c1-924a-11a7a7aae8a6",
  loyApp:"55b34088-0964-415f-9df7-d87dd98a09be", loyMai:"129f764d-b613-44e4-952c-5ff50a8c9b73" };
const marcheEnCours = new Set();
const estPerso = m => m.perso || m.src === "perso";
function jget(u, ms = 15000){
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  return fetch(u, { signal:c.signal }).then(r => { clearTimeout(t); if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
}
async function chercherCommunes(nom, cp, limite = 6){
  const f = "&fields=nom,code,codesPostaux,population&boost=population&limit=" + limite;
  const G = "https://geo.api.gouv.fr/communes?";
  let l = [];
  if(nom) l = await jget(G + "nom=" + encodeURIComponent(nom) + (cp ? "&codePostal=" + cp : "") + f);
  if(!l.length && nom && cp) l = await jget(G + "nom=" + encodeURIComponent(nom) + f);
  if(!l.length && /^\d{5}$/.test(cp || "")) l = await jget(G + "codePostal=" + cp + f);
  return l;
}
async function donneesMarche(code){
  const q = (r, champ) => API_T + r + "/data/?" + champ + "__exact=" + code;
  const rep = await Promise.allSettled([
    jget(q(RES.mois, "code_geo") + "&annee_mois__sort=desc&page_size=24"),
    jget(q(RES.total, "code_geo")),
    jget(q(RES.loyApp, "INSEE_C")),
    jget(q(RES.loyMai, "INSEE_C"))]);
  if(rep.every(x => x.status === "rejected")) throw new Error("réseau");
  const rows = x => x.status === "fulfilled" && x.value && Array.isArray(x.value.data) ? x.value.data : [];
  const mois = rows(rep[0]).filter(r => !r.echelle_geo || r.echelle_geo === "commune");
  const tot = rows(rep[1]).find(r => !r.echelle_geo || r.echelle_geo === "commune");
  const prix = type => {
    // médianes mensuelles des 12 derniers mois, pondérées par le nombre de ventes
    const mm = mois.slice(0, 12); let n = 0, s = 0;
    for(const r of mm){ const k = +r["nb_ventes_" + type] || 0, v = +r["med_prix_m2_" + type]; if(k && v){ n += k; s += k * v; } }
    if(n >= 10) return { v:Math.round(s / n), n, per:"12 mois", fin:mm[0].annee_mois };
    if(tot && +tot["nb_ventes_whole_" + type] >= 5 && +tot["med_prix_m2_whole_" + type]) return { v:+tot["med_prix_m2_whole_" + type], n:+tot["nb_ventes_whole_" + type], per:"5 ans" };
    return null;
  };
  const loy = x => { const r = rows(x)[0]; return r && +r.loypredm2 ? Math.round(+r.loypredm2 * 10) / 10 : null; };
  const pa = prix("appartement"), pm = prix("maison"), la = loy(rep[2]), lm = loy(rep[3]);
  if(!pa && !pm && !la && !lm) return null;
  const p0 = pa || pm;
  return { prixM2: p0 ? p0.v : null, prixM2Maison: pm ? pm.v : null, loyerM2: la || lm, loyerM2Maison: lm,
    nbApp: pa ? pa.n : 0, nbMai: pm ? pm.n : 0,
    src: "DVF " + (p0 ? p0.per + (p0.fin ? " (→ " + p0.fin + ")" : "") : "indisponible") + " · Carte des loyers 2025", date: Date.now() };
}
/* trouve la commune, charge ses données et crée ou met à jour sa ligne dans P.marche */
async function chargerVille(nom, cp){
  const cle = norm(nom) || cp;
  if(!cle || marcheEnCours.has(cle)) return null;
  marcheEnCours.add(cle);
  try {
    const l = await chercherCommunes(nom, cp);
    if(!l.length) return { introuvable:true };
    const n = norm(nom);
    const c = l.find(x => norm(x.nom) === n) || l.find(x => n && (norm(x.nom).startsWith(n) || n.startsWith(norm(x.nom)))) || l[0];
    const d = await donneesMarche(c.code);
    if(!d) return { commune:c, vide:true };
    let m = P.marche.find(x => x.insee === c.code) || P.marche.find(x => norm(x.ville) === norm(c.nom));
    if(!m){ m = {}; P.marche.push(m); }
    Object.assign(m, { ville:c.nom, cp: cp && (c.codesPostaux || []).includes(cp) ? cp : ((c.codesPostaux || [])[0] || ""), insee:c.code }, d);
    delete m.perso;
    sauverP();
    return m;
  } finally { marcheEnCours.delete(cle); }
}
function apresMarche(){
  if(vue === "biens") rendreBiens();
  else if(vue === "analyse") rendreResultats();
  else if(vue === "reglages"){ const a = document.activeElement; if(!(a && a.closest && a.closest("#v-reglages") && a.tagName === "INPUT")) rendreReglages(); }
}
/* un bien dont la ville n'a pas de référence : on va la chercher */
async function assurerMarche(b){
  if(!b || !b.ville || refMarche(b) || !navigator.onLine) return;
  const p = chargerVille(b.ville, b.cp).catch(() => null);
  apresMarche();
  await p;
  apresMarche();
}
let _amT = null;
const assurerMarcheDiffere = b => { clearTimeout(_amT); _amT = setTimeout(() => assurerMarche(b), 900); };
async function rafraichirMarche(force){
  if(!navigator.onLine) return 0;
  let k = 0;
  for(const m of P.marche.slice()){
    if(!m.ville) continue;
    if(!force && (estPerso(m) || (m.date && Date.now() - m.date < 30 * 864e5))) continue;
    const r = await chargerVille(m.ville, m.cp).catch(() => null);
    if(r && !r.introuvable && !r.vide) k++;
  }
  // puis les villes des biens qui n'ont pas encore de référence
  const vus = new Set();
  for(const b of biens){
    const c = norm(b.ville);
    if(!c || vus.has(c) || refMarche(b)) continue;
    vus.add(c);
    const r = await chargerVille(b.ville, b.cp).catch(() => null);
    if(r && !r.introuvable && !r.vide) k++;
  }
  if(k) apresMarche();
  return k;
}

/* ---------------- biens ---------------- */
function nouveauBien(o){
  return Object.assign({
    id:uid(), cree:Date.now(), maj:Date.now(), url:"", source:"", titre:"", type:"appartement",
    ville:"", cp:"", prix:null, surface:null, pieces:null, dpe:"", loyer:null, meuble:false,
    copro:null, tf:null, travaux:0, mobilier:0, neuf:false, statut:"à voir", note:"", hist:[]
  }, o || {});
}
let biens = store.get("biens", null) || [];
// les anciennes versions créaient 8 biens tirés du fichier Excel (id « xl1 » à « xl8 ») : on les retire une fois
if(!store.get("sansExcel", false)){
  biens = biens.filter(b => !/^xl\d+$/.test(b.id));
  store.set("biens", biens); store.set("sansExcel", true);
}
store.set("schema", SCHEMA);
const sauverB = () => store.set("biens", biens);
let courant = store.get("courant", biens[0] ? biens[0].id : null);
const bienCourant = () => biens.find(b => b.id === courant) || null;

/* ---------------- calculs ---------------- */
function refMarche(b){
  const v = norm(b.ville);
  if(!v) return null;
  return P.marche.find(m => norm(m.ville) === v)
      || P.marche.find(m => { const n = norm(m.ville); return n && (v.startsWith(n) || n.startsWith(v)); })
      || null;
}
function calc(b){
  const o = {};
  const s = +b.surface || 0, prix = +b.prix || 0, obj = P.objectif / 100;
  o.ok = prix > 0 && s > 0;
  o.ref = refMarche(b);
  // les petites surfaces se louent plus cher au m², les grandes moins cher
  o.coefS = P.ajusterSurface && s ? clamp(Math.pow(45 / s, 0.2), 0.8, 1.25) : 1;
  const maison = b.type === "maison";
  o.loyerM2Ref = o.ref ? (maison && o.ref.loyerM2Maison ? o.ref.loyerM2Maison : o.ref.loyerM2) : null;
  o.prixM2Ref = o.ref ? (maison && o.ref.prixM2Maison ? o.ref.prixM2Maison : o.ref.prixM2) : null;
  o.loyerMarche = o.loyerM2Ref && s ? o.loyerM2Ref * s * o.coefS * (b.meuble ? 1.1 : 1) : null;
  o.loyerEstime = b.loyer == null || b.loyer === "";
  o.loyer = !o.loyerEstime ? +b.loyer : (o.loyerMarche || 0);
  o.notairePct = b.neuf ? 2.5 : +P.notaire;
  o.frais = prix * o.notairePct / 100;
  o.travaux = +b.travaux || 0; o.mobilier = +b.mobilier || 0;
  o.cout = prix + o.frais + o.travaux + o.mobilier;
  o.loyerAn = o.loyer * 12;
  o.brutAnnonce = prix ? o.loyerAn / prix : 0;        // la formule du fichier Excel
  o.brut = o.cout ? o.loyerAn / o.cout : 0;           // brut sur le coût réel
  // charges du propriétaire
  o.tfEst = b.tf == null || b.tf === "";
  o.tf = !o.tfEst ? +b.tf : o.loyer;                  // à défaut : ≈ un mois de loyer
  o.coproEst = b.copro == null || b.copro === "";
  o.coproTotal = !o.coproEst ? +b.copro : (b.type === "maison" ? 0 : 30 * s);
  o.coproProprio = o.coproTotal * P.coproNonRecup / 100;
  o.vacance = o.loyerAn * P.vacance / 100;
  o.gestion = o.loyerAn * P.gestion / 100;
  o.entretien = o.loyerAn * P.entretien / 100;
  o.gli = o.loyerAn * P.gli / 100;
  o.pno = +P.pno || 0;
  o.charges = o.tf + o.coproProprio + o.pno + o.gestion + o.entretien + o.gli;
  o.encaisse = o.loyerAn - o.vacance;
  o.revenuNet = o.encaisse - o.charges;
  o.net = o.cout ? o.revenuNet / o.cout : 0;
  // crédit
  o.apport = !P.credit ? o.cout : P.apportMode === "frais" ? Math.min(o.cout, o.frais) : P.apportMode === "zero" ? 0 : Math.min(o.cout, +P.apportFixe || 0);
  o.emprunt = P.credit ? Math.max(0, o.cout - o.apport) : 0;
  const r = P.taux / 100 / 12, n = Math.max(1, P.duree * 12);
  o.mensCredit = o.emprunt ? (r ? o.emprunt * r / (1 - Math.pow(1 + r, -n)) : o.emprunt / n) : 0;
  o.mensAss = o.emprunt * P.assurance / 100 / 12;
  o.mens = o.mensCredit + o.mensAss;
  let cap = o.emprunt, it = 0;
  for(let i = 0; i < 12 && cap > 0; i++){ const x = cap * r; it += x; cap -= o.mensCredit - x; }
  o.interets1 = it;
  // impôt (première année, approximation)
  if(b.meuble){
    o.ps = P.psLmnp;
    if(P.lmnp === "micro"){ o.regime = "LMNP micro-BIC (abattement 50 %)"; o.baseImp = o.encaisse * 0.5; }
    else { o.regime = "LMNP au réel (amortissements ≈ pas d'impôt les premières années)"; o.baseImp = 0; }
  } else {
    o.ps = P.psFoncier;
    const micro = o.encaisse * 0.7;
    const reel = Math.max(0, o.encaisse - o.charges - it - o.mensAss * 12);
    if(o.encaisse > 15000 || reel < micro){ o.regime = "Foncier au réel (charges et intérêts déduits)"; o.baseImp = reel; }
    else { o.regime = "Micro-foncier (abattement 30 %)"; o.baseImp = micro; }
  }
  o.impot = o.baseImp * (P.tmi + o.ps) / 100;
  o.netNet = o.cout ? (o.revenuNet - o.impot) / o.cout : 0;
  o.cf = o.revenuNet / 12 - o.mens;
  o.cfNet = o.cf - o.impot / 12;
  // marché
  o.prixM2 = s ? prix / s : 0;
  o.ecartPrix = o.prixM2Ref && s ? o.prixM2 / o.prixM2Ref - 1 : null;
  o.ratioLoyer = (!o.loyerEstime && o.loyerMarche) ? o.loyer / o.loyerMarche : null;
  // prix d'achat maximal (frais de notaire, travaux, mobilier compris) pour un rendement visé
  const rev = P.base === "nette" ? o.revenuNet : o.loyerAn;
  o.prixMax = t => Math.max(0, (rev / t - o.travaux - o.mobilier) / (1 + o.notairePct / 100));
  o.offre = o.prixMax(obj);
  o.nego = prix ? 1 - o.offre / prix : 0;
  o.rendObj = P.base === "nette" ? o.net : o.brut;
  // score
  const lo = obj * 0.5;
  const dpeP = { A:15, B:15, C:15, D:12, E:7, F:2, G:0 };
  o.parts = [
    { n:"Rendement " + (P.base === "nette" ? "net" : "brut") + " vs objectif " + fmtN(P.objectif, 1) + " %", p: clamp((o.rendObj - lo) / (obj - lo), 0, 1) * 40, m:40 },
    { n:"Cash-flow après crédit et impôt", p: clamp((o.cfNet + 150) / 250, 0, 1) * 20, m:20 },
    { n:"Prix au m² vs marché", p: o.ecartPrix == null ? 7.5 : clamp((0.15 - o.ecartPrix) / 0.35, 0, 1) * 15, m:15 },
    { n:"DPE", p: b.dpe && dpeP[b.dpe] != null ? dpeP[b.dpe] : 7, m:15 },
    { n:"Fiabilité du loyer", p: o.loyerEstime ? 6 : o.ratioLoyer == null ? 7 : clamp((1.3 - o.ratioLoyer) / 0.3, 0, 1) * 10, m:10 }
  ];
  o.score = Math.round(o.parts.reduce((a, x) => a + x.p, 0));
  if(b.dpe === "G" && !o.travaux) o.score = Math.min(o.score, 35);
  if(!o.ok) o.score = 0;
  o.verdict = o.score >= 75 ? ["Fonce", "Coche les cases de ton objectif. Vérifie les charges réelles et visite."]
            : o.score >= 60 ? ["À négocier", "Intéressant si le prix baisse ou si le loyer se confirme."]

const SP = "[\\s\\u00a0\\u202f]";

function parseTexte(txt){

  if((m = t.match(/nombre\s+de\s+pi[eè]ces\s*:?\s*(\d+)/i)) || (m = t.match(/(\d+)\s*pi[eè]ces?\b/i)) || (m = t.match(/\b[TF](\d)\b/))) f.pieces = +m[1];
  if(/\bstudio\b/i.test(t) && !f.pieces) f.pieces = 1;
  const im = t.search(/\b(maison|villa|pavillon)\b/i), ia = t.search(/\b(appartement|studio|duplex|loft|T\d)\b/i);
  if(im >= 0 || ia >= 0) f.type = (im >= 0 && (ia < 0 || im < ia)) ? "maison" : "appartement";
  if((m = t.match(/(?:classe\s+[ée]nergie|DPE|performance\s+[ée]nerg[ée]tique|[ée]tiquette\s+[ée]nergie|consommation\s+[ée]nerg[ée]tique)\s*(?:\(?DPE\)?)?\s*:?\s*(?:classe\s*)?\(?([A-G])\b(?![a-zà-ÿ'])/i))) f.dpe = m[1].toUpperCase();
  // charges de copropriété (annuelles)
  if((m = t.match(new RegExp("quote[- ]part[^\\n€]{0,80}?" + MONT + SP + "?€", "i")))) f.copro = argent(m[1]);
  else if((m = t.match(new RegExp("charges?(?:\\s+de\\s+copro\\w*)?(?:\\s+courantes)?\\s*(?:annuelles?|par\\s+an|\\/\\s?an)\\s*:?[^\\d€\\n]{0,20}" + MONT + SP + "?€", "i")))) f.copro = argent(m[1]);
  else if((m = t.match(new RegExp("charges?(?:\\s+de\\s+copro\\w*)?[^\\d€\\n]{0,25}" + MONT + SP + "?€\\s*(?:\\/|par)\\s*(mois|an)", "i")))) f.copro = argent(m[1]) * (/mois/i.test(m[2]) ? 12 : 1);

  if((m = t.match(new RegExp("taxe\\s+fonci[eè]re[^\\d€\\n]{0,30}" + MONT + SP + "?€", "i")))) { const v = argent(m[1]); if(v > 50 && v < 10000) f.tf = v; }
  if((m = t.match(new RegExp("(?:lou[ée]e?\\s+(?:actuellement\\s+)?(?:à|a|au\\s+prix\\s+de|pour)?|loyer(?:\\s+actuel)?(?:\\s+mensuel)?(?:\\s+hors\\s+charges|\\s+HC|\\s+CC)?\\s*:?|bail\\s+en\\s+cours[^\\d€\\n]{0,30})\\s*" + MONT + SP + "?€", "i")))) { const v = argent(m[1]); if(v >= 150 && v <= 6000) f.loyer = v; }

  const reCp = /\(?\b((?:0[1-9]|[1-8]\d|9[0-5])\d{3})\b\)?/g;
  while((m = reCp.exec(t))){

    const ligneAp = t.slice(reCp.lastIndex).split("\n")[0];

}

function parseLD(liste){
  const f = {};

    if(!o || typeof o !== "object") return;
    if(Array.isArray(o)){ o.forEach(visite); return; }
    if(o["@graph"]) visite(o["@graph"]);
    const of = o.offers && (Array.isArray(o.offers) ? o.offers[0] : o.offers);
    if(of && of.price && f.prix == null){ const v = argent(of.price); if(v >= 10000) f.prix = v; }
    if(o.price && f.prix == null){ const v = argent(o.price); if(v >= 10000) f.prix = v; }
    const fs = o.floorSize && (o.floorSize.value || o.floorSize);
    if(fs && f.surface == null && !isNaN(decimal(fs))) f.surface = decimal(fs);
    if(o.numberOfRooms && f.pieces == null) f.pieces = parseInt(o.numberOfRooms.value || o.numberOfRooms, 10) || null;
    const ad = o.address || (o.itemOffered && o.itemOffered.address);
    if(ad && typeof ad === "object"){ if(ad.addressLocality && !f.ville) f.ville = ad.addressLocality; if(ad.postalCode && !f.cp) f.cp = String(ad.postalCode); }
    if(o.name && !f.titre && typeof o.name === "string" && o.name.length < 140) f.titre = o.name;
    for(const k in o){ if(o[k] && typeof o[k] === "object" && k !== "offers" && k !== "address") visite(o[k]); }
  };

}
function parsePayload(d){
  let f = {};

    const a = d.lbc;
    if(a.s) f.titre = a.s;
    const p = Array.isArray(a.p) ? a.p[0] : a.p;
    if(p) f.prix = +p;
    if(a.c) f.ville = a.c;
    if(a.z) f.cp = String(a.z);
    (a.at || []).forEach(([k, v, lab]) => {
      if(k === "square" && v) f.surface = decimal(v);
      else if(k === "rooms" && v) f.pieces = parseInt(v, 10);
      else if(k === "real_estate_type") f.type = /maison/i.test(lab || "") || v === "1" ? "maison" : "appartement";
      else if(k === "energy_rate" && /^[a-g]$/i.test(v || "")) f.dpe = v.toUpperCase();
      else if(k === "furnished" && (v === "1" || /meubl/i.test(lab || ""))) f.meuble = true;
      // noms de caractéristiques variables selon les annonces : on reconnaît le sens plutôt qu'une clé exacte
      else if(/charge|copro/i.test(k) && !/inclu/i.test(k) && argent(v) > 0) f.copro = argent(v) * (/month|mensu/i.test(k) ? 12 : 1);

  }

  for(const k in ld) if(f[k] == null) f[k] = ld[k];
  const tx = parseTexte(d.x || "");

/* applique ce qui a été lu : met à jour le bien de la même annonce, ou en crée un */
function integrer(f, origine){
  let b = f.url ? biens.find(x => x.url && x.url.split("?")[0] === f.url.split("?")[0]) : null;
  const nouveau = !b;
  if(!b){ b = nouveauBien(); biens.unshift(b); }
  const trouves = [];
  for(const k in f){
    if(f[k] == null || f[k] === "" || k === "source" || k === "url") continue;
    if(k === "prix" && b.prix && b.prix !== f.prix) b.hist.push({ d:Date.now(), prix:b.prix });
    b[k] = f[k]; if(LIBELLES[k]) trouves.push(k);
  }
  if(f.url){ b.url = f.url; b.source = f.source || sourceDe(f.url); }
  if(!b.titre) b.titre = [b.type === "maison" ? "Maison" : "Appartement", b.surface ? fmtN(b.surface) + " m²" : "", b.ville].filter(Boolean).join(" · ");
  b.maj = Date.now();
  sauverB();
  courant = b.id; store.set("courant", courant);
  derniereLecture = { trouves, manquants: ESSENTIELS.filter(k => !trouves.includes(k) && (b[k] == null || b[k] === "")), nouveau, origine, url:b.url };
  setTimeout(() => assurerMarche(b), 0);
  return b;
}

function analyserSaisie(texte){
  const txt = typeof texte === "string" ? texte : (($("#saisie") || {}).value || "");
  const s = txt.trim();
  if(!s){ toast("Colle un lien ou le texte d'une annonce"); return; }

function recevoir(){
  const h = location.hash;
  if(h.startsWith("#import=")){
    try {
      const d = JSON.parse(decodeURIComponent(escape(atob(h.slice(8)))));
      integrer(parsePayload(d), "favori");
      history.replaceState(null, "", location.pathname + location.search);
      allerVue("analyse");
      return true;
    } catch(e){ toast("Import illisible"); history.replaceState(null, "", location.pathname); }
  }
  const q = new URLSearchParams(location.search);
  if(q.has("url") || q.has("text")){
    const txt = [q.get("title"), q.get("text"), q.get("url")].filter(Boolean).join("\n");
    const f = parseTexte(txt);
    if(f.url || f.prix || f.surface){
      integrer(f, "partage");
      if(!f.prix || !f.surface) derniereLecture.lienSeul = true;
    }
    history.replaceState(null, "", location.pathname);
    allerVue("analyse");
    return true;
  }
  return false;
}

      (o.ok ? '<div class="k"><span>Brut <b>' + pct(o.brut) + '</b></span><span>Net <b>' + pct(o.net) + '</b></span><span>Cash-flow <b>' + sgn(o.cfNet) + '</b>/mois</span></div>' : "") +
      '</div>' + (modeComp ? '<span class="coche' + (choisi ? " on" : "") + '">✓</span>'
        : '<button class="btn lien suppr" data-act="suppr-bien" data-id="' + b.id + '" title="Supprimer ce bien" aria-label="Supprimer ce bien">' + ICONE_SUPPR + '</button>') + '</div>';
  }
  if(modeComp){
    h += '<div style="height:64px"></div><div class="barre-comp"><div class="in"><span>' + (selComp.length < 2 ? "Choisis 2 ou 3 biens (" + selComp.length + "/3)" : selComp.length + " biens choisis") + '</span>' +
      (selComp.length >= 2 ? '<button class="btn pri petit" data-act="lancer-comp">Comparer →</button>' : "") + '</div></div>';
  }
  $("#v-biens").innerHTML = h;
  $("#tri").onchange = e => { tri = e.target.value; store.set("tri", tri); rendreBiens(); };
}

/* une ligne par indicateur : [libellé, (b, o) => [valeur pour classer, texte], sens] ; sens 1 = plus haut c'est mieux, -1 = plus bas, 0 = pas de classement */
const LIGNES_COMP = [
  ["Le bien"],
  ["Ville", b => [null, '<span class="txt">' + esc(b.ville || "–") + '</span>'], 0],
  ["Surface", b => [+b.surface || null, b.surface ? fmtN(b.surface) + " m²" : "–"], 0],
  ["DPE", b => [b.dpe ? "ABCDEFG".indexOf(b.dpe) : null, b.dpe ? '<span class="dpe" style="background:' + DPE_C[b.dpe] + '">' + b.dpe + '</span>' : "?"], -1],
  ["Prix affiché", b => [+b.prix, eur(b.prix)], -1],
  ["Prix / m²", (b, o) => [o.prixM2, eur(o.prixM2) + (o.ecartPrix != null ? "<small>" + (o.ecartPrix >= 0 ? "+" : "−") + pct(Math.abs(o.ecartPrix), 0) + " vs marché</small>" : "")], -1],
  ["Coût total", (b, o) => [o.cout, eur(o.cout)], -1],
  ["Rentabilité"],
  ["Loyer", (b, o) => [o.loyer, eur(o.loyer) + (o.loyerEstime ? "<small>estimé</small>" : "")], 0],
  ["Rendement brut", (b, o) => [o.brut, pct(o.brut)], 1],
  ["Rendement net", (b, o) => [o.net, pct(o.net)], 1],
  ["Net-net", (b, o) => [o.netNet, pct(o.netNet)], 1],
  ["Cash-flow / mois", (b, o) => [o.cfNet, sgn(o.cfNet)], 1],
  ["Négociation"],
  ["Offre max", (b, o) => [null, eur(Math.round(o.offre / 500) * 500)], 0],
  ["À négocier", (b, o) => [o.nego, o.nego <= 0 ? "atteint" : "−" + pct(o.nego, 0)], -1],
  ["Points d'attention", (b, o) => { const n = o.alertes.filter(a => a[0] !== "var(--gris)").length; return [n, String(n)]; }, -1]
];
function rendreComparer(){
  const l = selComp.map(id => biens.find(b => b.id === id)).filter(Boolean).map(b => ({ b, o:calc(b) }));
  let h = '<div class="outils" style="margin-top:16px"><button class="btn petit" data-act="vue-biens">← Biens</button><div class="esp"></div></div>';
  if(l.length < 2){ $("#v-comparer").innerHTML = h + '<div class="carte note">Choisis 2 ou 3 biens dans la liste avec le bouton « Comparer ».</div>'; return; }
  const g = ' style="grid-template-columns:repeat(' + l.length + ',1fr)"';
  h += '<div class="comp-tete"' + g + '>' + l.map(({ b, o }) => '<div class="comp-col" data-act="ouvrir-comp" data-id="' + b.id + '"><div class="pastille" style="background:' + (o.ok ? o.couleur : "var(--gris)") + '">' + (o.ok ? o.score : "–") + '</div>' +
    '<div class="comp-t">' + esc(b.titre || "Sans titre") + '</div><div class="comp-v" style="color:' + (o.ok ? o.couleur : "var(--gris)") + '">' + (o.ok ? o.verdict[0] : "incomplet") + '</div></div>').join("") + '</div>';
  h += '<div class="carte">';
  for(const [nom, fn, sens] of LIGNES_COMP){
    if(!fn){ h += '<div class="comp-sec">' + nom + '</div>'; continue; }
    const vals = l.map(({ b, o }) => fn(b, o));
    const nums = vals.map(v => v[0]).filter(v => v != null && isFinite(v));
    const best = sens && nums.length > 1 && Math.min(...nums) !== Math.max(...nums) ? (sens > 0 ? Math.max(...nums) : Math.min(...nums)) : null;
    h += '<div class="comp-l"><div class="comp-n">' + nom + '</div><div class="comp-vals"' + g + '>' +
      vals.map(v => '<div' + (best != null && v[0] === best ? ' class="mieux"' : "") + '>' + v[1] + '</div>').join("") + '</div></div>';
  }
  h += '</div><div class="note" style="margin:10px 0">En vert : le meilleur des biens comparés sur la ligne. Touche un bien pour ouvrir son analyse.</div>';
  $("#v-comparer").innerHTML = h;
}

const CHAMPS = [
  { g:"Annonce", l:[
    { k:"titre", n:"Titre", t:"text", large:true },
    { k:"url", n:"Lien de l'annonce", t:"text", large:true },
    { k:"ville", n:"Ville", t:"text" }, { k:"cp", n:"Code postal", t:"text" },
    { k:"type", n:"Type", t:"select", o:[["appartement","Appartement"],["maison","Maison"]] },
    { k:"dpe", n:"DPE", t:"select", o:[["","Inconnu"],["A","A"],["B","B"],["C","C"],["D","D"],["E","E"],["F","F"],["G","G"]] },
    { k:"prix", n:"Prix affiché (FAI)", t:"num", u:"€" }, { k:"surface", n:"Surface habitable", t:"num", u:"m²" },
    { k:"pieces", n:"Pièces", t:"num" },

  ]},
  { g:"Loyer et charges", l:[
    { k:"loyer", n:"Loyer mensuel hors charges", t:"num", u:"€/mois", est:"loyer" },

    { k:"copro", n:"Charges de copro totales", t:"num", u:"€/an", est:"copro" },

  ]},

    { k:"note", n:"Notes", t:"text", large:true }
  ]}
];
function champHTML(c, b, trouves){
  const v = b[c.k];
  const cls = "champ" + (c.large ? " large" : "") + (trouves.includes(c.k) ? " trouve" : "");
  if(c.t === "check") return '<div class="champ large"><label class="bascule"><span>' + c.n + '</span><input type="checkbox" data-k="' + c.k + '"' + (v ? " checked" : "") + '></label></div>';
  if(c.t === "select") return '<div class="' + cls + '"><label>' + c.n + '</label><div class="in"><select data-k="' + c.k + '">' + c.o.map(([k, n]) => '<option value="' + esc(k) + '"' + (String(v || "") === k ? " selected" : "") + '>' + n + '</option>').join("") + '</select></div></div>';
  return '<div class="' + cls + '"><label>' + c.n + '</label><div class="in"><input ' + (c.t === "num" ? 'inputmode="decimal" ' : "") + 'data-k="' + c.k + '" data-t="' + c.t + '" value="' + esc(v == null ? "" : (c.t === "num" ? String(v).replace(".", ",") : v)) + '"' + (c.est ? ' data-est="' + c.est + '"' : "") + '>' + (c.u ? '<span class="u">' + c.u + '</span>' : "") + '</div></div>';
}

function rendreAnalyse(){
  const b = bienCourant();
  let h = "";
  if(!b){ $("#v-analyse").innerHTML = '<h2>Analyser une annonce</h2>' + blocImport(); return; }
  const lect = derniereLecture && derniereLecture.url === b.url ? derniereLecture : (derniereLecture && courant === b.id ? derniereLecture : null);
  h += '<div class="outils" style="margin-top:16px"><button class="btn petit" data-act="vue-biens">← Biens</button><div class="esp"></div><button class="btn petit" data-act="pdf">PDF banque</button>' +
    (b.url ? '<a class="btn petit" href="' + esc(b.url) + '" target="_blank" rel="noopener" style="text-decoration:none">Ouvrir l\'annonce ↗</a>' : "") + '</div>';
  h += '<div id="synthese"></div>' +
    '<div class="carte sim hide" id="sim"><div class="lig"><div class="l"><b>Et si je négocie ?</b><div class="d" id="sim-t"></div></div><button class="btn petit pri hide" id="sim-ok" data-act="sim-retenir">Retenir ce prix</button></div>' +
    '<input type="range" id="sim-r" min="0" max="30" step="1" value="0" aria-label="Baisse de prix simulée">' +
    '<div class="sim-ech"><span>prix affiché</span><button class="btn lien petit" data-act="sim-offre">caler sur l\'offre max</button><span>−30 %</span></div></div>';
  if(lect){
    if(lect.lienSeul){
      h += '<div class="retour attention"><b>Lien enregistré, mais je ne peux pas lire la page depuis l\'appli</b> : Leboncoin et SeLoger bloquent les lectures automatiques venant d\'un autre site. Deux façons de remplir la fiche en un geste :' +
        '<ol class="etapes"><li><b>Ouvre l\'annonce</b> puis touche ton favori <b>« → Rendement »</b> (à créer une fois dans Réglages → Import).</li><li>Ou sur l\'annonce : <b>tout sélectionner → copier</b>, puis colle le texte dans l\'onglet Biens.</li></ol>Sinon, complète les champs ci-dessous.</div>';
    } else {
      h += '<div class="retour">' + (lect.trouves.length ? '<b>Lu dans l\'annonce</b> : ' + lect.trouves.map(k => LIBELLES[k]).join(", ") + '.' : "Rien de lisible dans l'annonce.") +
        (lect.manquants.length ? ' <b>À compléter</b> : ' + lect.manquants.map(k => LIBELLES[k]).join(", ") + ' (estimés en attendant).' : "") + '</div>';
    }
  }
  h += '<div id="resultats"></div>';
  h += '<h2>Données du bien</h2><div class="carte"><div class="champs">';
  const tr = lect && !lect.lienSeul ? lect.trouves : [];
  CHAMPS.forEach((g, i) => {
    if(i) h += '</div></div><h2>' + g.g + '</h2><div class="carte"><div class="champs">';
    h += g.l.map(c => champHTML(c, b, tr)).join("");
  });
  h += '</div></div>';
  h += '<div class="btns" style="margin-top:14px"><button class="btn" data-act="dupliquer">Dupliquer</button><button class="btn dang" data-act="supprimer">Supprimer ce bien</button></div>';
  $("#v-analyse").innerHTML = h;
  $("#sim-r").addEventListener("input", e => { simNego = +e.target.value; simPour = b.id; rendreResultats(); });
  if(obsSyn) obsSyn.disconnect();
  synVisible = true;
  if(window.IntersectionObserver){
    obsSyn = new IntersectionObserver(([e]) => { synVisible = e.isIntersecting; majVisBarre(); }, { rootMargin:"-56px 0px 0px 0px" });
    obsSyn.observe($("#synthese"));
  }
  rendreResultats();
  $("#v-analyse").querySelectorAll("[data-k]").forEach(el => {
    el.addEventListener(el.tagName === "SELECT" || el.type === "checkbox" ? "change" : "input", () => {
      const k = el.dataset.k;
      let v;
      if(el.type === "checkbox") v = el.checked;
      else if(el.dataset.t === "num"){ const s = el.value.trim(); v = s === "" ? null : decimal(s); if(v != null && isNaN(v)) return; }
      else v = el.value;
      if(k === "prix" && b.prix && v && v !== b.prix && !el._hist){ b.hist.push({ d:Date.now(), prix:b.prix }); el._hist = true; }
      if(k === "url") b.source = sourceDe(v);
      b[k] = v; b.maj = Date.now();
      if((k === "travaux" || k === "mobilier") && v == null) b[k] = 0;
      sauverB();
      rendreResultats();
      if(k === "ville" || k === "cp") assurerMarcheDiffere(b);
    });
  });
}

/* simulation de négociation : ne touche pas au bien tant qu'on ne la retient pas */
let simNego = 0, simPour = null;
function bienSimule(b){
  if(simPour !== b.id) simNego = 0;
  return simNego && b.prix ? Object.assign({}, b, { prix: Math.round(b.prix * (1 - simNego / 100) / 100) * 100 }) : b;
}
function majSim(b0, b, o){
  const s = $("#sim"); if(!s) return;
  s.classList.toggle("hide", !(+b0.prix > 0 && o.ok));
  const r = $("#sim-r"); if(document.activeElement !== r) r.value = simNego;
  $("#sim-t").textContent = simNego ? "À " + eur(b.prix) + " (−" + simNego + " %) : tous les chiffres ci-dessus sont recalculés." : "Fais glisser pour voir l'effet d'une baisse de prix.";
  $("#sim-ok").classList.toggle("hide", !simNego);
}

/* couleur de chaque indicateur : vert = objectif tenu, orange = proche, rouge = loin */
function tons(o){
  const obj = P.objectif / 100, objNet = P.base === "nette" ? obj : obj * 0.75;
  return {
    objNet,
    brut: o.brut >= obj ? "bon" : o.brut >= obj * 0.8 ? "moyen" : "mauvais",
    net: o.net >= objNet ? "bon" : o.net >= objNet * 0.8 ? "moyen" : "mauvais",
    cf: o.cfNet >= 0 ? "bon" : o.cfNet >= -100 ? "moyen" : "mauvais",
    m2: o.ecartPrix == null ? "" : o.ecartPrix <= 0 ? "bon" : o.ecartPrix <= 0.1 ? "moyen" : "mauvais",
    offre: o.nego <= 0 ? "bon" : o.nego <= 0.1 ? "moyen" : "mauvais"
  };
}
const TON = { bon:"var(--bon)", moyen:"var(--moyen)", mauvais:"var(--mauvais)", "":"" };
const DPE_C = { A:"#2e8b57", B:"#5aa845", C:"#a6c43a", D:"#d9b414", E:"#f0a02c", F:"#e0632b", G:"#c9302c" };
const tuile = (l, v, d, t, jauge) => '<div class="kpi ' + (t || "") + '"><div class="l">' + l + '</div><div class="v">' + v + '</div>' +
  (jauge != null ? '<div class="barre"><i style="width:' + clamp(jauge, 0, 1) * 100 + '%"></i></div>' : "") + '<div class="d">' + d + '</div></div>';

function synthese(b, o){
  const t = tons(o), C = 2 * Math.PI * 42;
  const sous = [b.ville, b.surface ? fmtN(b.surface) + " m²" : "", b.pieces ? (+b.pieces === 1 ? "studio" : "T" + b.pieces) : "", b.meuble ? "meublé" : ""].filter(Boolean).map(esc).join(" · ");
  const dpe = b.dpe ? '<span class="dpe" style="background:' + DPE_C[b.dpe] + '">DPE ' + b.dpe + '</span>' : '<span class="dpe" style="background:var(--gris)">DPE ?</span>';
  const nR = o.alertes.filter(a => a[0] === "var(--mauvais)").length, nA = o.alertes.filter(a => a[0] !== "var(--gris)").length;
  return '<div class="carte syn"><div class="syn-tete">' +
      '<div class="anneau p"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="42" fill="none" stroke="var(--carte2)" stroke-width="10"/><circle cx="48" cy="48" r="42" fill="none" stroke="' + o.couleur + '" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + (C * o.score / 100) + ' ' + C + '"/></svg><div class="v"><div><b>' + o.score + '</b><small>/ 100</small></div></div></div>' +
      '<div class="inf"><div class="verdict" style="color:' + o.couleur + '">' + o.verdict[0] + '</div><div class="syn-titre">' + esc(b.titre || "Sans titre") + '</div><div class="syn-sous">' + (sous ? '<span>' + sous + '</span>' : "") + dpe + '</div></div></div>' +
    '<div class="verdict-s">' + o.verdict[1] + '</div>' +
    '<div class="syn-prix"><div><div class="l">' + (simNego ? "Prix simulé" : "Prix affiché") + '</div><div class="gros">' + eur(b.prix) + '</div><div class="d note">' + eur(o.cout) + ' tout compris</div></div>' +
      '<div class="fl">→</div>' +
      '<div style="text-align:right"><div class="l">Offre max · ' + fmtN(P.objectif, 1) + ' % ' + (P.base === "nette" ? "net" : "brut") + '</div><div class="gros" style="color:' + TON[t.offre] + '">' + eur(Math.round(o.offre / 500) * 500) + '</div><div class="d" style="color:' + TON[t.offre] + '">' + (o.nego <= 0 ? "objectif atteint" : "−" + pct(o.nego, 0) + " à négocier") + '</div></div></div>' +
    '<div class="kpis k3">' +
      tuile("Brut", pct(o.brut), "objectif " + fmtN(P.objectif, 1) + " %", t.brut, o.brut / (P.objectif / 100)) +
      tuile("Net", pct(o.net), "après charges", t.net, o.net / t.objNet) +
      tuile("Net-net", pct(o.netNet), "après impôt", "", null) +
      tuile("Cash-flow", sgn(o.cfNet), P.credit ? "/mois, crédit inclus" : "/mois, sans crédit", t.cf, null) +
      tuile("Loyer", eur(o.loyer), o.loyerEstime ? "estimé (marché)" : o.loyerMarche ? "marché ≈ " + eur(o.loyerMarche) : "saisi", "", null) +
      tuile("Prix / m²", eur(o.prixM2), o.ecartPrix == null ? "marché inconnu" : (o.ecartPrix >= 0 ? "+" : "−") + pct(Math.abs(o.ecartPrix), 0) + " vs marché", t.m2, null) +
    '</div>' + flux(o) +
    (nA ? '<button class="syn-al' + (nR ? " r" : "") + '" data-act="voir-alertes"><span>⚠ ' + nA + ' point' + (nA > 1 ? "s" : "") + ' d\'attention</span>›</button>' : "") +
  '</div>';
}
/* où part le loyer chaque mois : charges, crédit, impôt, et ce qui reste (ou ce qu'il faut ajouter) */
function flux(o){
  const ch = (o.vacance + o.charges) / 12, cr = o.mens, im = o.impot / 12, cf = o.cfNet;
  const tot = Math.max(o.loyer, ch + cr + im, 1);
  const seg = [["Charges", ch, "var(--gris)"], ["Crédit", cr, "var(--acc)"], ["Impôt", im, "var(--moyen)"]];
  if(cf > 0) seg.push(["Reste", cf, "var(--bon)"]);
  const vis = seg.filter(s => s[1] > 0.5);
  return '<div class="flux"><div class="flux-t"><span>Le loyer de ' + eur(o.loyer) + ' / mois</span><b style="color:' + (cf >= 0 ? "var(--bon)" : "var(--mauvais)") + '">' + (cf >= 0 ? "il reste " + sgn(cf) : "tu ajoutes " + eur(-cf)) + '</b></div>' +
    '<div class="pile">' + vis.map(s => '<i style="width:' + s[1] / tot * 100 + '%;background:' + s[2] + '"></i>').join("") +
      (cf < 0 ? '<b class="effort" style="left:' + o.loyer / tot * 100 + '%" title="de ta poche"></b>' : "") + '</div>' +
    '<div class="leg">' + vis.map(s => '<span><i style="background:' + s[2] + '"></i>' + s[0] + ' ' + eur(s[1]) + '</span>').join("") +
      (cf < 0 ? '<span><i style="background:repeating-linear-gradient(45deg,transparent 0 2px,var(--texte) 2px 3px)"></i>De ta poche ' + eur(-cf) + '</span>' : "") + '</div></div>';
}

/* barre d'indicateurs fixée en haut quand la synthèse sort de l'écran */
let synVisible = true, obsSyn = null, barreO = null;
const bk = (l, v, c) => '<div class="bk"><small>' + l + '</small><b' + (c ? ' style="color:' + c + '"' : "") + '>' + v + '</b></div>';
function majBarre(o){
  barreO = o;
  if(o){
    const t = tons(o);
    $("#barre-kpi .wrap").innerHTML = '<div class="pastille" style="background:' + o.couleur + '">' + o.score + '</div>' +
      bk("Brut", pct(o.brut), TON[t.brut]) + bk("Net", pct(o.net), TON[t.net]) + bk("Cash-flow", sgn(o.cfNet), TON[t.cf]) + bk("Offre max", fmtN(o.offre / 1000, 0) + " k€", TON[t.offre]);
  }
  majVisBarre();
}
function majVisBarre(){ $("#barre-kpi").classList.toggle("hide", !(vue === "analyse" && barreO && !synVisible)); }

function rendreResultats(){
  const b0 = bienCourant(), box = $("#resultats"), syn = $("#synthese");
  if(!b0 || !box || !syn) return;
  const b = bienSimule(b0), o = calc(b);
  // placeholders des valeurs estimées
  const ph = { loyer: o.loyerMarche ? "≈ " + fmtN(o.loyerMarche) + " (estimé)" : "à saisir", copro: "≈ " + fmtN(o.coproEst ? o.coproTotal : 30 * (+b.surface || 0)) + " (estimé)", tf: "≈ " + fmtN(o.loyer) + " (estimé)" };
  document.querySelectorAll("[data-est]").forEach(el => el.placeholder = ph[el.dataset.est] || "");
  majSim(b0, b, o);
  if(!o.ok){ syn.innerHTML = '<div class="carte note">Saisis au moins le <b>prix</b> et la <b>surface</b> pour lancer le calcul.</div>'; box.innerHTML = ""; majBarre(null); return; }
  syn.innerHTML = synthese(b, o);
  majBarre(o);
  // prix maximal selon le rendement visé
  let h = '<h2>Prix max selon le rendement ' + (P.base === "nette" ? "net" : "brut") + '</h2><div class="carte">' +
    '<table class="t"><tr><td class="note">Rendement visé</td><td class="r note">Prix max</td><td class="r note">vs ' + (simNego ? "simulé" : "affiché") + '</td></tr>' +
    [6, 7, 8, 10, 12].map(t => { const pm = o.prixMax(t / 100); return '<tr' + (t === P.objectif ? ' class="tot"' : "") + '><td>' + t + ' %</td><td class="r">' + eur(Math.round(pm / 500) * 500) + '</td><td class="r">' + (b.prix ? (pm >= b.prix ? "+" : "−") + pct(Math.abs(pm / b.prix - 1), 0) : "") + '</td></tr>'; }).join("") +
    '</table><div class="note" style="margin-top:6px">Prix vendeur ; frais de notaire' + (o.travaux || o.mobilier ? ", travaux et mobilier" : "") + ' en plus.</div></div>';
  // alertes

function ficheBanque(b0){

  const est = x => x ? " (estimation)" : "";

    ["Loyer mensuel HC", eur(o.loyer)], ["Rendement brut", pct(o.brut)], ["Cash-flow après impôt", sgn(o.cfNet) + " / mois"]]
    .map(([l, v]) => '<div><span>' + l + '</span><b>' + v + '</b></div>').join("") + '</div>';
  h += '<div class="imp-2col"><div>' + T("Le bien", [
      ["Type", b.type === "maison" ? "Maison" : "Appartement"],
      ["Surface habitable", fmtN(b.surface) + " m²"],

    ]) + '</div><div>' + T("Plan de financement", [
      ["Prix d'achat" + (simNego && simPour === b0.id ? " (négocié)" : ""), eur(b.prix)],
      ["Frais de notaire (" + fmtN(o.notairePct, 1) + " %)", eur(o.frais)],
      o.travaux ? ["Travaux", eur(o.travaux)] : null,
      o.mobilier ? ["Mobilier", eur(o.mobilier)] : null,
      ["Coût total", eur(o.cout), true],
      ["Apport personnel", eur(o.apport)],
      ["Montant emprunté", eur(o.emprunt), true],
      P.credit ? ["Durée, taux nominal", fmtN(P.duree) + " ans, " + fmtN(P.taux, 2) + " %"] : null,
      P.credit ? ["Assurance emprunteur", fmtN(P.assurance, 2) + " % / an"] : null,
      P.credit ? ["Mensualité assurance comprise", eur(o.mens), true] : null,
      P.credit ? ["Coût total du crédit", eur(coutCredit)] : null
    ]) + '</div></div>';
  h += '<div class="imp-2col"><div>' + T("Revenus et charges par an", [
      ["Loyer mensuel hors charges" + est(o.loyerEstime), eur(o.loyer)],

      ["Vacance locative (" + fmtN(P.vacance, 1) + " %)", "−" + eur(o.vacance)],

  return h;

function imprimerFiche(){

    }, 250);
  });

  $("#fichier").onchange = importerJSON;
}

async function ajouterVille(){
  const el = $("#nv-ville"); if(!el) return;
  const s = el.value.trim(); if(!s){ el.focus(); return; }
  const m = s.match(/^(.*?)\s*\((\d{5})\)\s*$/), cpSeul = /^\d{5}$/.test(s);
  const nom = m ? m[1] : (cpSeul ? "" : s), cp = m ? m[2] : (cpSeul ? s : "");
  toast("Recherche de " + s + "…");
  try {
    const r = await chargerVille(nom, cp);
    toast(!r ? "Recherche déjà en cours" : r.introuvable ? "Commune introuvable" : r.vide ? "Pas de données publiques pour " + r.commune.nom : r.ville + " ajoutée");
  } catch(x){ toast("Pas de connexion aux données publiques"); }
  rendreReglages();
}

/* ---------------- sauvegarde ---------------- */
function telecharger(nom, contenu, type){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([contenu], { type }));
  a.download = nom; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const dateFichier = () => new Date().toISOString().slice(0, 10);
function exporterJSON(){ telecharger("rendement-" + dateFichier() + ".json", JSON.stringify({ app:"Rendement", version:VERSION, schema:SCHEMA, date:new Date().toISOString(), params:P, biens }, null, 1), "application/json"); }
function importerJSON(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if(!Array.isArray(d.biens)) throw 0;
      biens = d.biens.map(b => nouveauBien(b));
      if(d.params) P = Object.assign({}, P_DEFAUT, d.params);
      sauverB(); sauverP(); courant = biens[0] ? biens[0].id : null; store.set("courant", courant);
      toast(biens.length + " biens importés"); rendre();
    } catch(x){ toast("Fichier non reconnu"); }
  };
  r.readAsText(f);
}
function exporterCSV(){
  const col = ["Titre","Ville","Prix","Surface","Prix m²","DPE","Loyer","Loyer estimé","Coût total","Brut annonce","Brut réel","Net","Net-net","Cash-flow/mois","Offre max","Score","Suivi","Lien"];
  const L = [col.join(";")];
  for(const b of biens){
    const o = calc(b);
    const n = (x, d = 0) => fmtN(x, d).replace(/ /g, "");
    L.push([b.titre, b.ville, b.prix, b.surface, n(o.prixM2), b.dpe, n(o.loyer), o.loyerEstime ? "oui" : "non", n(o.cout), n(o.brutAnnonce * 100, 2), n(o.brut * 100, 2), n(o.net * 100, 2), n(o.netNet * 100, 2), n(o.cfNet), n(o.offre), o.score, b.statut, b.url]
      .map(x => '"' + String(x == null ? "" : x).replace(/"/g, '""') + '"').join(";"));
  }
  telecharger("rendement-" + dateFichier() + ".csv", "﻿" + L.join("\r\n"), "text/csv");
}

/* ---------------- installation comme application ---------------- */
let invitation = null;
const estInstallee = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const estIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")){
  navigator.serviceWorker.register("sw.js").catch(e => console.warn("service worker", e));
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); invitation = e; majInstall(); });
window.addEventListener("appinstalled", () => { invitation = null; majInstall(); toast("Rendement est installée sur ton appareil"); });
function majInstall(){
  const b = $("#btn-installer"); if(b) b.classList.toggle("hide", !invitation || estInstallee());
  const bl = $("#bloc-install"); if(bl) bl.innerHTML = blocInstall();
}
async function installer(){
  if(invitation){
    invitation.prompt();
    const r = await invitation.userChoice.catch(() => null);
    if(r && r.outcome === "accepted") invitation = null;
    majInstall(); return;
  }
  allerVue("reglages");
  setTimeout(() => { const b = $("#bloc-install"); if(b) b.scrollIntoView({ behavior:"smooth", block:"center" }); }, 60);
}
function blocInstall(){
  const txt = 'class="note"';
  if(estInstallee()) return '<div ' + txt + '>✓ Tu utilises Rendement en application.</div>';
  if(invitation) return '<div class="lig"><div class="l">Ajouter Rendement à l\'écran d\'accueil<div class="d">Elle s\'ouvrira en plein écran, avec son icône, et fonctionnera hors ligne.</div></div><button class="btn pri" data-act="installer">Installer</button></div>';
  if(estIOS) return '<div ' + txt + '>Dans <b>Safari</b> : touche le bouton Partager en bas, puis « <b>Sur l\'écran d\'accueil</b> ». Sur iPhone, seul Safari sait installer une application web.</div>';
  return '<div ' + txt + '>Dans Chrome : menu <b>⋮</b> → « <b>Ajouter à l’écran d’accueil</b> » → <b>Installer</b> (pas « Créer un raccourci »). L’app s’ouvre ensuite en plein écran, comme CashFlow et Baby Name.</div>' +
    '<div class="btns"><button class="btn petit" data-act="diag-install">Vérifier l’installation</button></div><div id="diag" class="note hide" style="margin-top:8px"></div>';
}
async function diagnostic(){
  const d = $("#diag"); if(!d) return;
  const l = [];
  l.push((location.protocol === "https:" ? "✓" : "✗") + " page en HTTPS");
  try { const r = await fetch(document.querySelector('link[rel="manifest"]').href); const m = await r.json(); l.push("✓ manifeste prêt (" + (m.icons || []).length + " icônes, départ " + m.start_url + ")"); }
  catch(e){ l.push("✗ manifeste introuvable"); }
  for(const ic of ["icons/icon-192.png", "icons/icon-512.png", "sw.js"]){
    try { const r = await fetch(ic, { cache:"no-store" }); l.push((r.ok ? "✓ " : "✗ ") + ic); } catch(e){ l.push("✗ " + ic); }
  }
  if("serviceWorker" in navigator){
    const reg = await navigator.serviceWorker.getRegistration();
    l.push((reg && reg.active ? "✓" : "✗") + " service worker " + (reg ? (reg.active ? "actif" : "en cours d'installation") : "absent"));
    l.push(navigator.serviceWorker.controller ? "✓ page contrôlée" : "… page pas encore contrôlée : recharge la page");
  } else l.push("✗ service worker non pris en charge");
  l.push(invitation ? "✓ Chrome propose l'installation directe" : "→ passe par ⋮ puis « Ajouter à l'écran d'accueil »");
  d.innerHTML = l.map(esc).join("<br>"); d.classList.remove("hide");
}

/* ---------------- thème ---------------- */
let theme = store.get("theme", "auto");
const mq = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
function appliquerTheme(){
  const sombre = theme === "sombre" || (theme === "auto" && mq && mq.matches);
  document.documentElement.setAttribute("data-theme", sombre ? "sombre" : "clair");
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.content = sombre ? "#0f1110" : "#f6f5f1";
}
if(mq && mq.addEventListener) mq.addEventListener("change", appliquerTheme);
appliquerTheme();

/* ---------------- toast, modale ---------------- */
let _toastT = null;
function toast(msg, action){
  const t = $("#toast");
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (action ? '<button class="toast-act">' + esc(action.label) + '</button>' : "");
  if(action) t.querySelector(".toast-act").onclick = () => { action.fn(); t.classList.remove("on"); };
  t.classList.add("on"); clearTimeout(_toastT); _toastT = setTimeout(() => t.classList.remove("on"), action ? 5000 : 2600);
}
function journal(){
  $("#modal").innerHTML = '<div class="mdl-bg" data-act="fermer-modal"><div class="mdl"><h3>Nouveautés</h3><div class="sous">Rendement ' + VERSION + '</div>' +
    JOURNAL.map(j => '<b>' + j.v + '</b> <span class="note">' + j.d + ' · ' + esc(j.t) + '</span><ul>' + j.l.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul>').join("") +
    '<div class="btns"><button class="btn" data-act="fermer-modal">Fermer</button></div></div></div>';
}

/* ---------------- actions ---------------- */
document.addEventListener("click", async e => {
  const nv = e.target.closest("nav.bas button");
  if(nv){ allerVue(nv.dataset.vue); return; }
  const el = e.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act;
  if(a === "fermer-modal"){ if(e.target === el || el.tagName === "BUTTON") $("#modal").innerHTML = ""; return; }
  if(a === "analyser") analyserSaisie();
  else if(a === "coller"){
    try { const t = await navigator.clipboard.readText(); $("#saisie").value = t; if(t.trim()){ store.set("dernierPP", t.trim()); analyserSaisie(); } }
    catch(x){ toast("Accès au presse-papiers refusé : colle avec un appui long"); }
  }
  else if(a === "vierge"){ const b = nouveauBien({ titre:"Nouveau bien" }); biens.unshift(b); sauverB(); courant = b.id; store.set("courant", courant); derniereLecture = null; allerVue("analyse"); }
  else if(a === "ouvrir" && modeComp && vue === "biens"){
    const id = el.dataset.id, i = selComp.indexOf(id);
    if(i >= 0) selComp.splice(i, 1);
    else if(selComp.length >= 3){ toast("3 biens au maximum"); return; }
    else selComp.push(id);
    rendreBiens();
  }
  else if(a === "ouvrir" || a === "ouvrir-comp"){ courant = el.dataset.id; store.set("courant", courant); derniereLecture = null; allerVue("analyse"); }
  else if(a === "mode-comp"){ modeComp = !modeComp; if(!modeComp) selComp = []; rendreBiens(); }
  else if(a === "lancer-comp") allerVue("comparer");
  else if(a === "pdf") imprimerFiche();
  else if(a === "vue-biens") allerVue("biens");
  else if(a === "suppr-bien"){
    const i = biens.findIndex(x => x.id === el.dataset.id); if(i < 0) return;
    const b = biens.splice(i, 1)[0]; sauverB();
    if(courant === b.id){ courant = biens[0] ? biens[0].id : null; store.set("courant", courant); }
    rendreBiens();
    const nom = (b.titre || "Bien").slice(0, 28);
    toast("« " + nom + " » supprimé", { label:"Annuler", fn:() => { biens.splice(i, 0, b); sauverB(); rendre(); } });
  }
  else if(a === "haut") window.scrollTo({ top:0, behavior:"smooth" });
  else if(a === "voir-alertes"){ const x = $("#alertes"); if(x) window.scrollTo({ top:x.getBoundingClientRect().top + scrollY - 110, behavior:"smooth" }); }
  else if(a === "sim-offre"){
    const b = bienCourant(); if(!b) return;
    const o = calc(b);
    if(o.nego <= 0){ toast("L'objectif est déjà atteint au prix affiché"); return; }
    simNego = clamp(Math.ceil(o.nego * 100), 0, 30); simPour = b.id; rendreResultats();
    if(o.nego > 0.3) toast("Offre max au-delà de −30 % : curseur au maximum");
  }
  else if(a === "sim-retenir"){
    const b = bienCourant(); if(!b || !simNego) return;
    const nv = bienSimule(b).prix, ancien = b.prix;
    b.hist.push({ d:Date.now(), prix:ancien }); b.prix = nv; b.maj = Date.now(); simNego = 0; sauverB(); rendreAnalyse();
    toast("Prix retenu : " + eur(nv), { label:"Annuler", fn:() => { b.prix = ancien; b.hist.pop(); sauverB(); rendreAnalyse(); } });
  }
  else if(a === "supprimer"){
    const b = bienCourant(); if(!b) return;
    const i = biens.indexOf(b); biens.splice(i, 1); sauverB();
    courant = biens[0] ? biens[0].id : null; store.set("courant", courant);
    allerVue("biens");
    toast("Bien supprimé", { label:"Annuler", fn:() => { biens.splice(i, 0, b); sauverB(); courant = b.id; store.set("courant", courant); rendre(); } });
  }
  else if(a === "dupliquer"){
    const b = bienCourant(); if(!b) return;
    const c = nouveauBien(Object.assign(JSON.parse(JSON.stringify(b)), { id:uid(), titre:b.titre + " (copie)", url:"", hist:[], cree:Date.now(), maj:Date.now() }));
    biens.unshift(c); sauverB(); courant = c.id; store.set("courant", courant); derniereLecture = null; rendreAnalyse(); toast("Copie créée : fais varier les hypothèses");
  }
  else if(a === "ajout-ville") ajouterVille();
  else if(a === "suppr-ville"){ const i = +el.dataset.i, m = P.marche[i]; P.marche.splice(i, 1); sauverP(); rendreReglages(); toast(m.ville + " supprimée", { label:"Annuler", fn:() => { P.marche.splice(i, 0, m); sauverP(); rendreReglages(); } }); }
  else if(a === "maj-ville"){
    const m = P.marche[+el.dataset.i]; if(!m) return;
    const p = chargerVille(m.ville, m.cp); rendreReglages();
    const r = await p.catch(() => null); rendreReglages();
    toast(!r ? "Pas de connexion aux données publiques" : r.introuvable ? "Commune introuvable" : r.vide ? "Pas de données publiques pour cette commune" : m.ville + " mise à jour");
  }
  else if(a === "maj-tout"){ toast("Actualisation…"); const k = await rafraichirMarche(true); rendreReglages(); toast(k ? k + " ville(s) mises à jour" : "Pas de connexion aux données publiques"); }
  else if(a === "reglages-defaut"){ const m = P.marche; P = Object.assign({}, P_DEFAUT, { marche:m }); sauverP(); rendreReglages(); toast("Réglages par défaut (villes conservées)"); }
  else if(a === "copier-favori"){
    try { await navigator.clipboard.writeText(decodeURIComponent(codeFavori())); toast("Code du favori copié"); }
    catch(x){ $("#modal").innerHTML = '<div class="mdl-bg" data-act="fermer-modal"><div class="mdl"><h3>Code du favori</h3><div class="sous">Sélectionne et copie tout le texte</div><div class="code" style="max-height:240px;user-select:all">' + esc(decodeURIComponent(codeFavori())) + '</div><div class="btns"><button class="btn" data-act="fermer-modal">Fermer</button></div></div></div>'; }
  }
  else if(a === "export-json") exporterJSON();
  else if(a === "import-json") $("#fichier").click();
  else if(a === "export-csv") exporterCSV();
  else if(a === "theme"){ theme = { auto:"clair", clair:"sombre", sombre:"auto" }[theme]; store.set("theme", theme); appliquerTheme(); rendreReglages(); }
  else if(a === "installer") installer();
  else if(a === "diag-install") diagnostic();
  else if(a === "journal") journal();
});
document.addEventListener("keydown", e => { if(e.key === "Enter" && (e.ctrlKey || e.metaKey) && e.target.id === "saisie") analyserSaisie(); });
/* annonce copiée ailleurs : en revenant dans l'appli, on propose de l'analyser.
   Seulement si le navigateur a déjà donné l'accès au presse-papiers (premier
   usage du bouton « Coller ») : jamais de demande d'autorisation surprise. */
async function verifierPressePapiers(){
  if(document.visibilityState !== "visible" || !navigator.clipboard || !navigator.permissions) return;
  try {
    const p = await navigator.permissions.query({ name:"clipboard-read" });
    if(p.state !== "granted") return;
    const t = ((await navigator.clipboard.readText()) || "").trim();
    if(!t || t.length > 30000 || t === store.get("dernierPP", "")) return;
    const f = parseTexte(t);
    if(!(f.prix && f.surface)) return;
    store.set("dernierPP", t);
    toast("Annonce copiée : " + [f.surface ? fmtN(f.surface) + " m²" : "", f.ville || "", eur(f.prix)].filter(Boolean).join(" · "), { label:"Analyser", fn:() => analyserSaisie(t) });
  } catch(e){}
}
document.addEventListener("visibilitychange", verifierPressePapiers);
window.addEventListener("focus", verifierPressePapiers);
// coller une annonce suffit : l'analyse part toute seule
document.addEventListener("paste", e => { if(e.target.id === "saisie") setTimeout(analyserSaisie, 0); });

/* ---------------- démarrage ---------------- */
$("#ver-chip").textContent = "v" + VERSION;
if(!recevoir()) rendre();
setTimeout(() => rafraichirMarche(false), 400);
window.addEventListener("online", () => rafraichirMarche(false));
</script>
