<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rendement">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Calcule la rentabilité d'un investissement locatif à partir d'une annonce Leboncoin ou SeLoger : rendement brut, net, net-net, cash-flow, offre maximale et score.">
<title>Rendement — investissement locatif</title>
<script>
/* Manifeste construit ici même, comme dans CashFlow et Baby Name : adresses
   complètes calculées d'après l'emplacement réel de la page (GitHub Pages,
   sous-dossier…). share_target permet, une fois installée sur Android, de
   recevoir un lien partagé depuis une autre appli. */
(function(){
  try {
    var base = location.href.split("#")[0].split("?")[0].replace(/[^\/]*$/, "");
    var man = {
      name: "Rendement", short_name: "Rendement",
      description: "Rentabilité locative d'une annonce : brut, net, cash-flow, offre max et score.",
      lang: "fr", start_url: base, scope: base, id: base,
      display: "standalone", orientation: "portrait",
      background_color: "#f6f5f1", theme_color: "#ffffff",
      icons: [
        { src: base + "icons/icon-192.png", sizes: "192x192", type: "image/png", purpose: "any" },
        { src: base + "icons/icon-512.png", sizes: "512x512", type: "image/png", purpose: "any" },
        { src: base + "icons/icon-maskable-512.png", sizes: "512x512", type: "image/png", purpose: "maskable" }
      ],
      share_target: { action: base, method: "GET", params: { title: "title", text: "text", url: "url" } }
    };
    var l = document.createElement("link");
    l.rel = "manifest";
    l.href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: "application/manifest+json" }));
    document.head.appendChild(l);
  } catch(e){}
})();
</script>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --fond:#f6f5f1; --carte:#ffffff; --carte2:#f0eee8; --texte:#1b1d1c; --gris:#6c706d; --ligne:#e3e0d8;
  --acc:#1f6f50; --acc-doux:#e3f0ea; --bon:#1f8a5b; --ok:#6a9a2a; --moyen:#c48a12; --mauvais:#c4442f;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --sans:"Inter Tight",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --ombre:0 1px 2px rgba(0,0,0,.04),0 2px 10px rgba(0,0,0,.04);
}
[data-theme="sombre"]{
  --fond:#0f1110; --carte:#181b19; --carte2:#20241f; --texte:#ecefec; --gris:#9aa19c; --ligne:#2a2f2b;
  --acc:#4fbf8d; --acc-doux:#1b3229; --bon:#45c08a; --ok:#9cc65a; --moyen:#e0a83a; --mauvais:#ec6f58;
  --ombre:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:var(--texte);font-family:var(--sans);font-size:15px;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:var(--fond);border-bottom:1px solid var(--ligne);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;gap:10px;height:54px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--acc);display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.titre-app{font-weight:700;font-size:18px;letter-spacing:-.01em}
.chip{font-family:var(--mono);font-size:11px;color:var(--gris);border:1px solid var(--ligne);border-radius:99px;padding:2px 8px;cursor:pointer;background:none}
.esp{flex:1}
.btn{border:1px solid var(--ligne);background:var(--carte);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500;font-size:14px}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
[data-theme="sombre"] .btn.pri{color:#06120d}
.btn.lien{border:none;background:none;color:var(--acc);padding:6px 4px}
.btn.dang{color:var(--mauvais)}
.btn.petit{padding:6px 10px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--gris);font-weight:600;margin:22px 0 8px}
.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);padding:14px;box-shadow:var(--ombre)}
.carte+.carte{margin-top:10px}
.note{font-size:13px;color:var(--gris);line-height:1.55}
.mono{font-family:var(--mono)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* barre d'onglets */
nav.bas{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--carte);border-top:1px solid var(--ligne);padding-bottom:env(safe-area-inset-bottom)}
nav.bas .wrap{display:flex}
nav.bas button{flex:1;background:none;border:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--gris);cursor:pointer}
nav.bas button svg{width:22px;height:22px}
nav.bas button.on{color:var(--acc);font-weight:600}

/* import */
.import textarea{width:100%;min-height:74px;border:1px solid var(--ligne);border-radius:10px;padding:10px 12px;background:var(--carte2);resize:vertical;font-size:14px}
.import textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
a.btn{color:var(--acc)}
.retour{margin:10px 0;font-size:13px;line-height:1.55;border-radius:10px;padding:10px 12px;background:var(--acc-doux)}
.retour.attention{background:color-mix(in srgb,var(--moyen) 15%,transparent)}
.retour b{font-weight:600}

/* liste des biens */
.outils{display:flex;gap:8px;align-items:center;margin:14px 0 8px;flex-wrap:wrap}
.outils select{border:1px solid var(--ligne);background:var(--carte);border-radius:10px;padding:8px 10px;font-size:14px}
.bien{display:flex;gap:12px;align-items:center;cursor:pointer}
.bien .inf{flex:1;min-width:0}
.bien .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bien .s{font-size:13px;color:var(--gris);margin-top:2px}
.bien .k{display:flex;gap:12px;margin-top:6px;font-size:13px;flex-wrap:wrap}
.bien .k span b{font-family:var(--mono);font-weight:500}
.pastille{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:500;font-size:17px;color:#fff;flex:none}
.statut{font-size:11px;border-radius:99px;padding:2px 8px;background:var(--carte2);color:var(--gris);margin-left:6px;vertical-align:1px;font-weight:500}
.vide{text-align:center;padding:30px 10px}

/* analyse */
.score{display:flex;gap:16px;align-items:center}
.anneau{position:relative;width:96px;height:96px;flex:none}
.anneau svg{width:96px;height:96px;transform:rotate(-90deg)}
.anneau .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.anneau .v b{font-family:var(--mono);font-size:28px;font-weight:500;line-height:1}
.anneau .v small{display:block;font-size:11px;color:var(--gris);margin-top:2px}
.verdict{font-size:20px;font-weight:700;letter-spacing:-.01em}
.verdict-s{font-size:13px;color:var(--gris);margin-top:3px;line-height:1.45}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.kpi{background:var(--carte2);border-radius:10px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--gris)}
.kpi .v{font-family:var(--mono);font-size:19px;margin-top:3px}
.kpi .d{font-size:11px;color:var(--gris);margin-top:2px}
.offre{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.offre .gros{font-family:var(--mono);font-size:24px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td{padding:7px 0;border-bottom:1px solid var(--ligne)}
table.t tr:last-child td{border-bottom:none}
table.t td.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
table.t tr.tot td{font-weight:600}
table.t .est{color:var(--gris);font-style:italic;font-size:12px}
.barre{height:6px;border-radius:9px;background:var(--carte2);overflow:hidden;margin-top:4px}
.barre i{display:block;height:100%;border-radius:9px;background:var(--acc)}
.crit{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:8px 0 10px;font-size:13px}
.crit .p{font-family:var(--mono);color:var(--gris)}
.alerte{display:flex;gap:10px;font-size:13px;line-height:1.5;padding:8px 0;border-bottom:1px solid var(--ligne)}
.alerte:last-child{border-bottom:none}
.alerte .ic{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
details.pli{margin-top:10px}
details.pli summary{cursor:pointer;font-weight:600;font-size:14px;padding:4px 0;list-style:none}
details.pli summary::before{content:"▸ ";color:var(--gris)}
details.pli[open] summary::before{content:"▾ "}

/* formulaire */
.champs{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.champ{display:flex;flex-direction:column;gap:4px;min-width:0}
.champ.large{grid-column:1/-1}
.champ label{font-size:12px;color:var(--gris)}
.champ .in{display:flex;align-items:center;border:1px solid var(--ligne);border-radius:10px;background:var(--carte2);overflow:hidden}
.champ .in:focus-within{outline:2px solid var(--acc);outline-offset:-1px}
.champ input,.champ select{flex:1;min-width:0;border:none;background:none;padding:9px 10px;font-size:15px;outline:none}
.champ input::placeholder{color:var(--gris);opacity:.85;font-style:italic}
.champ .u{padding:0 10px;color:var(--gris);font-size:13px;white-space:nowrap}
.champ.trouve .in{border-color:var(--acc)}
.bascule{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 0}
.bascule input{width:20px;height:20px;accent-color:var(--acc)}
.lig{display:flex;align-items:center;gap:12px;justify-content:space-between}
.lig .l{flex:1}
.lig .d{font-size:12px;color:var(--gris);margin-top:2px;line-height:1.45}
.ajout{display:flex;gap:8px;align-items:center}
.ajout .champ{flex:1}
.ville-m{border-top:1px solid var(--ligne);margin-top:12px;padding-top:10px}
.ville-m .lig .btn.lien{font-size:17px;padding:4px 8px}
.champs.c4{grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.champs.c4 input{padding:7px 8px;font-size:14px}
.champs.c4 label{font-size:11px}
@media (max-width:520px){ .champs.c4{grid-template-columns:1fr 1fr} }
.code{font-family:var(--mono);font-size:11px;word-break:break-all;background:var(--carte2);border-radius:8px;padding:8px;max-height:80px;overflow:auto;color:var(--gris)}
a.favori{display:inline-block;background:var(--acc);color:#fff;text-decoration:none;border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
[data-theme="sombre"] a.favori{color:#06120d}
ol.etapes{padding-left:20px;margin:6px 0;font-size:13px;line-height:1.6;color:var(--gris)}
ol.etapes b{color:var(--texte);font-weight:600}

#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--texte);color:var(--fond);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:50;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast .toast-act{background:none;border:none;color:var(--acc-doux);font-weight:600;cursor:pointer;padding:0}
#modal .mdl-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:grid;place-items:center;padding:16px}
#modal .mdl{background:var(--carte);border-radius:16px;max-width:520px;width:100%;max-height:80vh;overflow:auto;padding:18px}
#modal h3{margin:0 0 4px}
#modal .sous{color:var(--gris);font-size:13px;margin-bottom:10px}
#modal ul{padding-left:18px;font-size:14px;line-height:1.55}

/* synthèse en tête de l'analyse */
.syn-tete{display:flex;gap:14px;align-items:center}
.syn-tete .inf{flex:1;min-width:0}
.syn .verdict{font-size:18px}
.syn .verdict-s{margin-top:10px}
.syn-titre{font-weight:600;font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.syn-sous{font-size:12.5px;color:var(--gris);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dpe{display:inline-grid;place-items:center;min-width:20px;height:18px;padding:0 5px;border-radius:5px;font-weight:700;font-size:11px;color:#fff}
.anneau.p,.anneau.p svg{width:72px;height:72px}
.anneau.p .v b{font-size:22px}
.anneau.p .v small{font-size:10px;margin-top:0}
.syn-prix{display:flex;align-items:center;gap:8px;margin-top:12px;padding:12px 0;border-top:1px solid var(--ligne);border-bottom:1px solid var(--ligne)}
.syn-prix>div{flex:1;min-width:0}
.syn-prix .fl{flex:none;color:var(--gris);font-size:18px}
.syn-prix .l{font-size:12px;color:var(--gris)}
.syn-prix .gros{font-family:var(--mono);font-size:21px;margin-top:2px}
.syn-prix .d{font-size:12px;margin-top:1px}
.kpis.k3{grid-template-columns:repeat(3,1fr)}
.kpis.k3 .kpi{padding:9px 10px}
.kpis.k3 .kpi .v{font-size:16px;letter-spacing:-.02em;white-space:nowrap}
.kpi{border-left:3px solid transparent}
.kpi .barre{height:4px;margin-top:6px}
.kpi.bon{border-left-color:var(--bon)} .kpi.bon .v{color:var(--bon)} .kpi.bon .barre i{background:var(--bon)}
.kpi.moyen{border-left-color:var(--moyen)} .kpi.moyen .v{color:var(--moyen)} .kpi.moyen .barre i{background:var(--moyen)}
.kpi.mauvais{border-left-color:var(--mauvais)} .kpi.mauvais .v{color:var(--mauvais)} .kpi.mauvais .barre i{background:var(--mauvais)}
.flux{margin-top:14px}
.flux-t{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--gris)}
.flux-t b{font-family:var(--mono);font-weight:500;white-space:nowrap}
.pile{position:relative;display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--carte2);margin-top:6px}
.pile i{display:block;height:100%}
.pile .effort{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(45deg,transparent 0 4px,rgba(0,0,0,.3) 4px 7px);border-left:2px solid var(--texte)}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:12px;color:var(--gris)}
.leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.syn-al{display:flex;width:100%;align-items:center;gap:8px;margin-top:12px;padding:9px 12px;border:none;border-radius:10px;background:color-mix(in srgb,var(--moyen) 14%,transparent);font-size:13px;cursor:pointer;text-align:left}
.syn-al.r{background:color-mix(in srgb,var(--mauvais) 14%,transparent)}
.syn-al span{flex:1}
.sim{margin-top:10px}
.sim input[type=range]{width:100%;accent-color:var(--acc);margin:10px 0 2px}
.sim-ech{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--gris)}
#barre-kpi{position:fixed;left:0;right:0;top:calc(55px + env(safe-area-inset-top));z-index:19;background:var(--carte);border-bottom:1px solid var(--ligne);box-shadow:0 4px 12px rgba(0,0,0,.06);cursor:pointer}
#barre-kpi .wrap{display:flex;align-items:center;gap:6px;height:46px}
#barre-kpi .pastille{width:32px;height:32px;font-size:13px}
#barre-kpi .bk{flex:1;text-align:center;min-width:0}
#barre-kpi .bk small{display:block;font-size:10.5px;color:var(--gris)}
#barre-kpi .bk b{font-family:var(--mono);font-weight:500;font-size:13px;white-space:nowrap}
.bien .suppr{flex:none;color:var(--gris);padding:8px;align-self:center}
.bien .suppr svg{width:18px;height:18px;display:block}
.bien .suppr:hover{color:var(--mauvais)}
@media (max-width:350px){ .kpis.k3{grid-template-columns:1fr 1fr} }

.partage{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);margin-bottom:10px}

/* photos */
.bien .vign{flex:none;width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--carte2);align-self:center}
.photos{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px 10px;padding:0 16px;scrollbar-width:none}
.photos::-webkit-scrollbar{display:none}
.photos img{flex:none;width:46%;max-width:260px;height:120px;object-fit:cover;border-radius:12px;scroll-snap-align:center;background:var(--carte2);cursor:zoom-in}
.photos img:only-child{width:100%;max-width:none}
.visio{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.94)}
.visio .defil{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.visio .defil::-webkit-scrollbar{display:none}
.visio .defil img{flex:none;width:100%;height:100%;object-fit:contain;scroll-snap-align:center}
.visio .fermer{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:18px;cursor:pointer}
.visio .cpt{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));text-align:center;color:#fff;font-family:var(--mono);font-size:13px}
.photos img.mienne{outline:2px solid var(--acc);outline-offset:-2px}
.ajout-photo{flex:none;width:96px;height:120px;border-radius:12px;border:1.5px dashed var(--ligne);background:var(--carte);color:var(--gris);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;cursor:pointer}
.ajout-photo span{font-size:24px;line-height:1;color:var(--acc)}
.visio .suppr-ph{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;border:none;border-radius:99px;background:rgba(255,255,255,.15);color:#fff;padding:9px 14px;font-size:14px;cursor:pointer}
.imp-photo{display:block;width:150pt;height:100pt;object-fit:cover;border-radius:6pt;margin:0 0 4pt auto}

/* sous-onglets de la fiche */
.onglets{display:flex;gap:2px;background:var(--carte2);border-radius:12px;padding:3px;margin:16px 0 4px;overflow-x:auto;scrollbar-width:none}
.onglets::-webkit-scrollbar{display:none}
.onglets button{flex:1;border:none;background:none;border-radius:9px;padding:8px 6px;font-size:13px;font-weight:500;color:var(--gris);cursor:pointer;white-space:nowrap}
.onglets button.on{background:var(--carte);color:var(--texte);box-shadow:var(--ombre);font-weight:600}
[data-theme="sombre"] .onglets button.on{background:var(--ligne)}
#ong-autre>.carte:first-child,#ong-visite>.carte:first-child{margin-top:10px}
.ton-bon{color:var(--bon)} .ton-moyen{color:var(--moyen)} .ton-mauvais{color:var(--mauvais)}
.graphe{margin-top:4px}
.graphe svg{display:block;width:100%;height:auto;touch-action:pan-y}
.graphe text{font-family:var(--sans)}
.g-info{font-size:13px;color:var(--gris);margin-top:2px;min-height:18px}
.g-info b{color:var(--texte);font-family:var(--mono);font-weight:500}
.bande svg{display:block;width:100%;height:auto;margin:12px 0 0}
.bande text{font-family:var(--sans)}
.vente{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--ligne);font-size:13.5px}
.vente:last-child{border-bottom:none}
.vente>div:first-child{min-width:0}
.vente .r{text-align:right;white-space:nowrap}
.vente b{font-weight:600}
.pos{margin-top:12px;padding-top:10px;border-top:1px solid var(--ligne)}
.vis-g{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--gris);font-weight:600;margin:16px 0 2px}
.vis{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--ligne);font-size:14px}
.vis span{flex:1}
.vb{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ligne);background:none;color:var(--gris);font-weight:700;cursor:pointer;flex:none}
.vb.ok.on{background:var(--bon);border-color:var(--bon);color:#fff}
.vb.pb.on{background:var(--mauvais);border-color:var(--mauvais);color:#fff}
.zone{width:100%;min-height:80px;border:1px solid var(--ligne);border-radius:10px;padding:10px 12px;background:var(--carte2);resize:vertical;font-size:14px;margin-top:12px}
.zone:focus{outline:2px solid var(--acc);outline-offset:-1px}
ul.argu{margin:4px 0 0;padding-left:18px;font-size:14px}
ul.argu li{margin:5px 0;line-height:1.5}
.lettre{font-size:11pt;line-height:1.55}
.lettre p{margin:0 0 10pt}
.lettre .l-date{text-align:right}
.lettre ul{margin:0 0 10pt;padding-left:18pt}
.lettre li{margin:0 0 4pt}
.lettre .l-ref{font-size:9pt;color:#555;word-break:break-all}
.lettre .l-sign{margin-top:28pt}

/* carte des biens */
.carte-biens{height:62vh;min-height:320px;border-radius:var(--r);border:1px solid var(--ligne);overflow:hidden;background:var(--carte2)}
.carte-biens .leaflet-popup-content{font-family:var(--sans);font-size:13px;line-height:1.45;color:#1b1d1c}
.btn.icone{padding:6px 8px;line-height:0}
.btn.icone svg{width:18px;height:18px}
.leaflet-tooltip.carte-score{background:none;border:none;box-shadow:none;color:#fff;font:600 11px var(--mono);padding:0}
.leaflet-tooltip.carte-score::before{display:none}
/* qualité de la ville */
.ville-tete{display:flex;gap:12px;align-items:center}
.ville-tete .pastille{width:44px;height:44px;font-size:15px}
/* budget */
.budget-bien{cursor:pointer}

/* tri d'une page de résultats */
.tri-ph{position:relative;flex:none;width:64px;height:64px}
.tri-ph img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--carte2);display:block}
.tri-ph .pastille{position:absolute;right:-6px;bottom:-6px;width:32px;height:32px;font-size:12px;border:2px solid var(--carte)}
.tri-act{display:flex;flex-direction:column;gap:6px;flex:none}
.tri-act .btn{min-width:40px;text-align:center;padding:6px 8px;text-decoration:none}

/* curseur de taux, sous le bloc Crédit */
.taux-zone{margin-top:10px}
.taux-zone input[type=range]{width:100%;accent-color:var(--acc);margin:10px 0 2px}
.taux-zone .sim-ech b{font-family:var(--mono);font-weight:500;color:var(--texte)}

/* comparaison */
.coche{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ligne);display:grid;place-items:center;color:transparent;font-size:14px;font-weight:700;align-self:center}
.coche.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bien.choisi{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.barre-comp{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:25;padding:0 16px}
.barre-comp .in{max-width:648px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--texte);color:var(--fond);border-radius:14px;padding:8px 8px 8px 16px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.barre-comp .in span{flex:1}
.comp-tete{display:grid;gap:8px;position:sticky;top:calc(55px + env(safe-area-inset-top));z-index:5;background:var(--fond);padding:8px 0}
.comp-col{text-align:center;cursor:pointer;background:var(--carte);border:1px solid var(--ligne);border-radius:12px;padding:10px 6px;min-width:0}
.comp-col .pastille{width:40px;height:40px;font-size:15px;margin:0 auto}
.comp-t{font-size:12.5px;font-weight:600;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.comp-v{font-size:12px;font-weight:600;margin-top:2px}
.comp-sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--gris);font-weight:600;margin:16px 0 2px}
.comp-sec:first-child{margin-top:0}
.comp-l{padding:7px 0;border-bottom:1px solid var(--ligne)}
.comp-n{font-size:12px;color:var(--gris);margin-bottom:3px}
.comp-vals{display:grid;gap:8px}
.comp-vals>div{text-align:center;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;border-radius:8px;padding:3px 2px;min-width:0}
.comp-vals small{display:block;font-family:var(--sans);font-size:11px;color:var(--gris);font-weight:400}
.comp-vals .txt{font-family:var(--sans);font-size:12.5px;overflow-wrap:anywhere}
.comp-vals .mieux{background:var(--acc-doux);color:var(--bon);font-weight:600}

/* fiche PDF pour la banque : invisible à l'écran, seule chose imprimée */
#impression{display:none}
@media print{
  @page{size:A4;margin:14mm}
  html,body{background:#fff!important;color:#111!important;padding:0!important;font-size:10.5pt}
  body>*:not(#impression){display:none!important}
  #impression{display:block;color:#111}
  #impression *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.imp-tete{display:flex;justify-content:space-between;gap:16pt;align-items:flex-start;border-bottom:2px solid #1f6f50;padding-bottom:8pt;margin-bottom:10pt}
.imp-sur{font-size:9pt;text-transform:uppercase;letter-spacing:.08em;color:#1f6f50;font-weight:600}
#impression h1{font-size:17pt;margin:2pt 0;line-height:1.2}
.imp-sous,.imp-date{color:#555;font-size:10pt}
.imp-date{white-space:nowrap}
.imp-url{font-size:8pt;color:#555;word-break:break-all;margin-top:2pt}
.imp-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6pt;margin-bottom:4pt}
.imp-kpis div{border:1px solid #ddd;border-radius:6pt;padding:6pt 8pt;background:#f6f5f1}
.imp-kpis span{display:block;font-size:8.5pt;color:#555}
.imp-kpis b{font-family:var(--mono);font-size:13pt;font-weight:500}
.imp-2col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16pt}
#impression h2{font-size:9.5pt;color:#1f6f50;margin:12pt 0 3pt}
#impression table{width:100%;border-collapse:collapse;font-size:10pt}
#impression td{padding:3.5pt 0;border-bottom:1px solid #e5e5e5;vertical-align:top}
#impression td+td{text-align:right;font-family:var(--mono);white-space:nowrap;padding-left:8pt}
#impression tr.tot td{font-weight:700;border-bottom:1.5px solid #999}
.imp-pied{margin-top:14pt;font-size:8.5pt;color:#666;line-height:1.5}
@media (max-width:380px){ .champs{grid-template-columns:1fr} .kpi .v{font-size:17px} }
</style>

  loyApp:"55b34088-0964-415f-9df7-d87dd98a09be", loyMai:"129f764d-b613-44e4-952c-5ff50a8c9b73" };
const marcheEnCours = new Set();
const estPerso = m => m.perso || m.src === "perso";
function jget(u, ms = 15000){
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  return fetch(u, { signal:c.signal }).then(r => { clearTimeout(t); if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
}
async function chercherCommunes(nom, cp, limite = 6){
  const f = "&fields=nom,code,codesPostaux,population,centre&boost=population&limit=" + limite;
  const G = "https://geo.api.gouv.fr/communes?";
  let l = [];
  if(nom) l = await jget(G + "nom=" + encodeURIComponent(nom) + (cp ? "&codePostal=" + cp : "") + f);
  if(!l.length && nom && cp) l = await jget(G + "nom=" + encodeURIComponent(nom) + f);
  if(!l.length && /^\d{5}$/.test(cp || "")) l = await jget(G + "codePostal=" + cp + f);
  return l;
}
async function donneesMarche(code){
  const q = (r, champ) => API_T + r + "/data/?" + champ + "__exact=" + code;
  const rep = await Promise.allSettled([
    jget(q(RES.mois, "code_geo") + "&annee_mois__sort=desc&page_size=24"),
    jget(q(RES.total, "code_geo")),
    jget(q(RES.loyApp, "INSEE_C")),
    jget(q(RES.loyMai, "INSEE_C"))]);
  if(rep.every(x => x.status === "rejected")) throw new Error("réseau");
  const rows = x => x.status === "fulfilled" && x.value && Array.isArray(x.value.data) ? x.value.data : [];
  const mois = rows(rep[0]).filter(r => !r.echelle_geo || r.echelle_geo === "commune");
  const tot = rows(rep[1]).find(r => !r.echelle_geo || r.echelle_geo === "commune");
  const prix = type => {
    // médianes mensuelles des 12 derniers mois, pondérées par le nombre de ventes
    const mm = mois.slice(0, 12); let n = 0, s = 0;
    for(const r of mm){ const k = +r["nb_ventes_" + type] || 0, v = +r["med_prix_m2_" + type]; if(k && v){ n += k; s += k * v; } }
    if(n >= 10) return { v:Math.round(s / n), n, per:"12 mois", fin:mm[0].annee_mois };
    if(tot && +tot["nb_ventes_whole_" + type] >= 5 && +tot["med_prix_m2_whole_" + type]) return { v:+tot["med_prix_m2_whole_" + type], n:+tot["nb_ventes_whole_" + type], per:"5 ans" };
    return null;
  };
  const loy = x => { const r = rows(x)[0]; return r && +r.loypredm2 ? Math.round(+r.loypredm2 * 10) / 10 : null; };
  const pa = prix("appartement"), pm = prix("maison"), la = loy(rep[2]), lm = loy(rep[3]);
  if(!pa && !pm && !la && !lm) return null;
  const p0 = pa || pm;
  return { prixM2: p0 ? p0.v : null, prixM2Maison: pm ? pm.v : null, loyerM2: la || lm, loyerM2Maison: lm,
    nbApp: pa ? pa.n : 0, nbMai: pm ? pm.n : 0,
    src: "DVF " + (p0 ? p0.per + (p0.fin ? " (→ " + p0.fin + ")" : "") : "indisponible") + " · Carte des loyers 2025", date: Date.now() };
}
/* trouve la commune, charge ses données et crée ou met à jour sa ligne dans P.marche */
async function chargerVille(nom, cp){
  const cle = norm(nom) || cp;
  if(!cle || marcheEnCours.has(cle)) return null;
  marcheEnCours.add(cle);
  try {
    const l = await chercherCommunes(nom, cp);
    if(!l.length) return { introuvable:true };
    const n = norm(nom);
    const c = l.find(x => norm(x.nom) === n) || l.find(x => n && (norm(x.nom).startsWith(n) || n.startsWith(norm(x.nom)))) || l[0];
    const d = await donneesMarche(c.code);
    if(!d) return { commune:c, vide:true };
    let m = P.marche.find(x => x.insee === c.code) || P.marche.find(x => norm(x.ville) === norm(c.nom));
    if(!m){ m = {}; P.marche.push(m); }
    Object.assign(m, { ville:c.nom, cp: cp && (c.codesPostaux || []).includes(cp) ? cp : ((c.codesPostaux || [])[0] || ""), insee:c.code, centre: c.centre ? c.centre.coordinates : m.centre }, d);
    delete m.perso;
    sauverP();
    return m;
  } finally { marcheEnCours.delete(cle); }
}

/* un bien dont la ville n'a pas de référence : on va la chercher */
async function assurerMarche(b){
  if(!b || !b.ville || refMarche(b) || !navigator.onLine) return;
  const p = chargerVille(b.ville, b.cp).catch(() => null);
  apresMarche();
  await p;
  apresMarche();
}
let _amT = null;
const assurerMarcheDiffere = b => { clearTimeout(_amT); _amT = setTimeout(() => assurerMarche(b), 900); };
async function rafraichirMarche(force){
  if(!navigator.onLine) return 0;
  let k = 0;
  for(const m of P.marche.slice()){
    if(!m.ville) continue;
    if(!force && (estPerso(m) || (m.date && Date.now() - m.date < 30 * 864e5))) continue;
    const r = await chargerVille(m.ville, m.cp).catch(() => null);
    if(r && !r.introuvable && !r.vide) k++;
  }
  // puis les villes des biens qui n'ont pas encore de référence
  const vus = new Set();
  for(const b of biens){
    const c = norm(b.ville);
    if(!c || vus.has(c) || refMarche(b)) continue;
    vus.add(c);
    const r = await chargerVille(b.ville, b.cp).catch(() => null);
    if(r && !r.introuvable && !r.vide) k++;
  }
  if(k) apresMarche();
  // qualité de la ville des biens enregistrés (score)
  for(const m of new Set(biens.map(refMarche).filter(Boolean))) await assurerInfoVille(m);
  return k;
}

/* ---------------- projection et fiscalité ----------------
   Simulation année par année pour un régime : loyers et charges qui évoluent,
   crédit amorti, impôt (déficit foncier, amortissements LMNP), puis revente
   avec l'impôt sur la plus-value. Approximations assumées : surtaxe sur les
   plus-values > 50 000 €, CFE et limite de 10 ans des déficits non comptées. */
const REGIMES = {
  micro:     { n:"Nu · micro-foncier", meuble:false },
  reel:      { n:"Nu · réel", meuble:false },
  lmnpMicro: { n:"Meublé · micro-BIC", meuble:true },
  lmnpReel:  { n:"Meublé · LMNP réel", meuble:true }
};
function echeancier(emprunt, tauxAn, ans){
  const r = tauxAn / 100 / 12, n = Math.max(1, ans * 12);
  const m = emprunt ? (r ? emprunt * r / (1 - Math.pow(1 + r, -n)) : emprunt / n) : 0;
  const l = []; let cap = emprunt;
  for(let a = 0; a < ans; a++){
    let it = 0, rb = 0;
    for(let i = 0; i < 12 && cap > 0.01; i++){ const x = cap * r; it += x; rb += m - x; cap -= m - x; }
    l.push({ interets:it, capital:rb, restant:Math.max(0, cap) });
  }
  return l;
}
/* plus-value des particuliers : 19 % + 17,2 %, abattements pour durée de détention
   (exonération d'impôt après 22 ans, de prélèvements sociaux après 30 ans) */
function impotPlusValue(pv, ans){
  const ir = ans <= 5 ? 0 : ans <= 21 ? (ans - 5) * 0.06 : 1;
  const ps = ans <= 5 ? 0 : ans <= 21 ? (ans - 5) * 0.0165 : ans === 22 ? 0.28 : ans < 30 ? 0.28 + (ans - 22) * 0.09 : 1;
  return pv * (1 - Math.min(1, ir)) * 0.19 + pv * (1 - Math.min(1, ps)) * 0.172;
}
function calculerTRI(flux){
  // taux annuel qui annule la valeur actuelle des flux ; null s'il n'existe pas
  const van = t => flux.reduce((s, f, i) => s + f / Math.pow(1 + t, i), 0);
  let lo = -0.99, hi = 10;
  if(!(flux[0] < 0) || van(lo) * van(hi) > 0) return null;
  for(let i = 0; i < 80; i++){ const m = (lo + hi) / 2; if(van(lo) * van(m) <= 0) hi = m; else lo = m; }
  return (lo + hi) / 2;
}
function simuler(b, o, regime){
  const N = Math.max(1, Math.min(40, Math.round(+P.detention || 20))), R = REGIMES[regime];
  const tmi = P.tmi / 100, ps = (R.meuble ? P.psLmnp : P.psFoncier) / 100;
  const ech = P.credit ? echeancier(o.emprunt, P.taux, P.duree) : [];
  const pctLoyer = (P.gestion + P.entretien + P.gli) / 100;
  const fixes = o.tf + o.coproProprio + o.pno + o.chargesColoc + (regime === "lmnpReel" ? 300 : 0);   // + expert-comptable en LMNP réel
  // LMNP réel : bâti (85 %, terrain exclu) sur 30 ans, travaux sur 10 ans, mobilier sur 7 ans
  const bati = ((+b.prix || 0) + o.frais) * 0.85;
  const amImmo = a => bati / 30 + (a <= 10 ? o.travaux / 10 : 0), amTotal = a => amImmo(a) + (a <= 7 ? o.mobilier / 7 : 0);
  let report = 0, ard = 0, amDeduits = 0, cumul = 0;
  const annees = [];
  for(let a = 1; a <= N; a++){
    const loyers = o.loyerAn * Math.pow(1 + P.hausseLoyer / 100, a - 1) * (a === 1 ? 1 - (o.moisTravaux || 0) / 12 : 1);   // pas de loyer pendant les travaux
    const enc = loyers * (1 - P.vacance / 100);
    const charges = fixes * Math.pow(1 + P.hausseCharges / 100, a - 1) + loyers * pctLoyer;
    const e = ech[a - 1] || { interets:0, capital:0, restant:0 };
    const assur = P.credit && a <= P.duree ? o.mensAss * 12 : 0;
    let impot = 0;
    if(regime === "micro") impot = enc * 0.7 * (tmi + ps);
    else if(regime === "lmnpMicro") impot = enc * 0.5 * (tmi + ps);
    else if(regime === "reel"){
      let r = enc - charges - assur - (a === 1 ? o.travaux : 0) - e.interets;
      if(r >= 0){ const d = Math.min(report, r); r -= d; report -= d; impot = r * (tmi + ps); }
      else {
        // déficit foncier : hors intérêts, imputable sur le revenu global jusqu'à 10 700 €/an ; le reste se reporte
        const defInt = Math.max(0, e.interets - enc), defAutres = -r - defInt, glob = Math.min(defAutres, 10700);
        impot = -glob * tmi; report += defInt + defAutres - glob;
      }
    } else {
      // LMNP réel : les amortissements ne créent pas de déficit, l'excédent se reporte sans limite
      let r = enc - charges - assur - e.interets;
      if(r < 0){ report += -r; ard += amTotal(a); }
      else {
        const d = Math.min(report, r); r -= d; report -= d;
        const dispo = amTotal(a) + ard, am = Math.min(dispo, r);
        r -= am; ard = dispo - am;
        amDeduits += am * (amImmo(a) / (amTotal(a) || 1));
        impot = r * (tmi + ps);
      }
    }
    const cf = enc - charges - (e.interets + e.capital + assur) - impot;
    cumul += cf;
    // et si on revendait cette année-là ?
    const valeur = (+b.prix || 0) * Math.pow(1 + P.revalo / 100, a);
    const cession = valeur * (1 - P.fraisRevente / 100);
    // prix d'acquisition majoré des frais (réels ou 7,5 %) et des travaux (forfait 15 % après 5 ans) ;
    // en LMNP les amortissements déduits sont réintégrés (règle des cessions depuis 2025)
    const acquis = (+b.prix || 0) + Math.max(o.frais, (+b.prix || 0) * 0.075) + (a > 5 ? Math.max(o.travaux, (+b.prix || 0) * 0.15) : o.travaux) - amDeduits;
    const impotPV = impotPlusValue(Math.max(0, cession - acquis), a);
    const netRevente = cession - e.restant - impotPV;
    annees.push({ a, loyers, enc, charges, impot, cf, cumul, restant:e.restant, valeur, impotPV, netRevente, enrichi: cumul + netRevente - o.apport });
  }
  const fin = annees[N - 1];
  return { regime, nom:R.n, N, annees, prixVente:fin.valeur, impotPV:fin.impotPV, netRevente:fin.netRevente,
    enrichissement:fin.enrichi, tri: calculerTRI([-o.apport].concat(annees.map((x, i) => x.cf + (i === N - 1 ? x.netRevente : 0)))),
    impotMoyen: annees.reduce((s, x) => s + x.impot, 0) / N, cfMoyen: cumul / N / 12,
    // cash-flow mensuel moyen des 5 premières années : chantier sans loyer et déduction des travaux lissés
    cf5: annees.slice(0, 5).reduce((s, x) => s + x.cf, 0) / Math.min(5, N) / 12 };
}
const regimesPossibles = (o, meuble) => meuble ? ["lmnpMicro", "lmnpReel"] : (o.loyerAn <= 15000 ? ["micro", "reel"] : ["reel"]);
function meilleurRegime(b, o){
  return regimesPossibles(o, !!b.meuble).map(r => simuler(b, o, r)).reduce((m, x) => x.enrichissement > m.enrichissement ? x : m);
}
/* les 4 régimes, chacun avec sa configuration : en meublé, loyer +10 % et mobilier */
function comparerRegimes(b, o){
  const loyerNu = b.meuble ? o.loyer / 1.1 : o.loyer, loyerMeuble = b.meuble ? o.loyer : o.loyer * 1.1;
  const mob = b.meuble && o.mobilier ? o.mobilier : Math.round(clamp((+b.surface || 0) * 100, 3000, 8000) / 500) * 500;
  const oNu = calc(Object.assign({}, b, { meuble:false, loyer:loyerNu, mobilier: b.meuble ? 0 : b.mobilier }));
  const bMe = Object.assign({}, b, { meuble:true, loyer:loyerMeuble, mobilier:mob }), oMe = calc(bMe);
  const liste = Object.keys(REGIMES).map(r => {
    const me = REGIMES[r].meuble, oo = me ? oMe : oNu;
    if(!regimesPossibles(oo, me).includes(r)) return { regime:r, nom:REGIMES[r].n, impossible:"loyers > 15 000 €/an" };
    return simuler(me ? bMe : b, oo, r);
  });
  return { liste, loyerNu, loyerMeuble, mob };
}
/* tests de résistance : chaque scénario recalcule tout avec des hypothèses dégradées ; on compare
   le cash-flow moyen sur la durée (la 1re année seule flatterait les travaux, déductibles d'un coup) */
function stress(b){
  const base = calc(b), tout = { vacance:16.7, taux: P.taux + 1 };
  const pire = { loyer: base.loyer * 0.9, copro: base.coproTotal * 1.3, tf: base.tf * 1.3, travaux: (+b.travaux || 0) + 5000 };
  const sc = [
    ["Situation prévue", {}, {}],
    ["2 mois de vacance par an", { vacance:16.7 }, {}],
    ["Loyer −10 %", {}, { loyer: base.loyer * 0.9 }],
    P.credit ? ["Taux +1 point", { taux: P.taux + 1 }, {}] : null,
    ["Charges et taxe foncière +30 %", {}, { copro: base.coproTotal * 1.3, tf: base.tf * 1.3 }],
    ["5 000 € de travaux imprévus", {}, { travaux: (+b.travaux || 0) + 5000 }],
    ["Tout à la fois", P.credit ? tout : { vacance:16.7 }, pire]
  ].filter(Boolean);
  return sc.map(([n, p, bb]) => {
    const sv = P; P = Object.assign({}, P, p);
    try { const o = calc(Object.assign({}, b, bb)); return { n, cf: o.sim ? o.sim.cfMoyen : o.cfNet, enr: o.sim ? o.sim.enrichissement : null }; }
    finally { P = sv; }
  });
}

/* ---------------- ventes réelles autour du bien (DVF) ----------------
   Base DVF géolocalisée publiée par l'État, interrogée via OpenDataSoft (qui
   accepte les appels directs depuis la page). Ventes comparables : même type,
   surface de 60 % à 160 %, 3 dernières années, à 500 m (puis 1 et 2 km s'il y
   en a trop peu) ; sans position, toute la commune. */
const DVF = "https://public.opendatasoft.com/api/explore/v2.1/catalog/datasets/buildingref-france-demande-de-valeurs-foncieres-geolocalisee-millesime/records";
const ventesEnCours = new Set(), ventesErreur = new Set();
function cleVentes(b){ const r = refMarche(b); return [b.lat || "", b.lng || "", (r && r.insee) || "", b.type, +b.surface || 0].join("|"); }
const ventesAJour = b => !!(b.ventes && b.ventes.cle === cleVentes(b) && Date.now() - b.ventes.date < 30 * 864e5);
function distanceKm(la1, lo1, la2, lo2){
  const R = Math.PI / 180, x = (lo2 - lo1) * R * Math.cos((la1 + la2) / 2 * R), y = (la2 - la1) * R;
  return Math.sqrt(x * x + y * y) * 6371;
}
function mediane(l){ const s = l.slice().sort((x, y) => x - y), m = s.length / 2; return s.length ? (s.length % 2 ? s[m - 0.5] : (s[m - 1] + s[m]) / 2) : null; }
function nettoyerVentes(rows, b){
  // une vente de plusieurs logements d'un coup n'a pas de prix au m² fiable : on l'écarte
  const nb = {}; rows.forEach(r => { nb[r.id_mutation] = (nb[r.id_mutation] || 0) + 1; });
  return rows.filter(r => nb[r.id_mutation] === 1 && r.valeur_fonciere > 0 && r.surface_reelle_bati > 0).map(r => ({
    d:r.date_mutation, v:r.valeur_fonciere, s:r.surface_reelle_bati, p:r.nombre_pieces_principales || null,
    a:[r.adresse_numero, r.adresse_nom_voie].filter(Boolean).join(" "), m2:Math.round(r.valeur_fonciere / r.surface_reelle_bati),
    km: b.lat && b.lng && r.latitude ? distanceKm(b.lat, b.lng, r.latitude, r.longitude) : null
  })).filter(x => x.m2 >= 400 && x.m2 <= 20000);
}
async function chargerVentes(b){
  const s = +b.surface, ref = refMarche(b), type = b.type === "maison" ? "Maison" : "Appartement";
  const depuis = new Date(Date.now() - 3 * 365 * 864e5).toISOString().slice(0, 10);
  const filtre = 'type_local="' + type + '" and nature_mutation="Vente" and date_mutation>=date\'' + depuis + '\' and surface_reelle_bati>=' + Math.floor(s * 0.6) + ' and surface_reelle_bati<=' + Math.ceil(s * 1.6);
  const champs = "id_mutation,date_mutation,valeur_fonciere,surface_reelle_bati,nombre_pieces_principales,adresse_numero,adresse_nom_voie,latitude,longitude";
  const req = w => jget(DVF + "?select=" + champs + "&where=" + encodeURIComponent(w + " and " + filtre) + "&order_by=date_mutation%20desc&limit=100", 20000).then(r => r.results || []);
  const geo = !!(b.lat && b.lng);
  let rayon = null, l = [];
  if(geo){
    for(rayon of [500, 1000, 2000]){
      l = nettoyerVentes(await req("within_distance(geo_point, geom'POINT(" + b.lng + " " + b.lat + ")', " + rayon + "m)"), b);
      if(l.length >= 8) break;
    }
    l.sort((x, y) => x.km - y.km);
  } else l = nettoyerVentes(await req('com_code="' + ref.insee + '"'), b);
  const m2 = l.map(x => x.m2);
  return { cle:cleVentes(b), date:Date.now(), mode: geo ? "rayon" : "commune", rayon, n:l.length, depuis,
    med: m2.length ? Math.round(mediane(m2)) : null, liste:l.slice(0, 40) };
}
async function assurerVentes(b, force){
  if(ventesEnCours.has(b.id) || !navigator.onLine || !(+b.surface)) return;
  if(!force && (ventesAJour(b) || ventesErreur.has(b.id))) return;
  if(!(b.lat && b.lng) && !(refMarche(b) || {}).insee) return;
  ventesEnCours.add(b.id); ventesErreur.delete(b.id);
  try { b.ventes = await chargerVentes(b); sauverB(); }
  catch(e){ ventesErreur.add(b.id); }
  finally { ventesEnCours.delete(b.id); }
  if(bienCourant() === b && vue === "analyse") rendreResultats();
}

/* ---------------- frais de notaire ----------------
   Ancien : droits de mutation (part départementale P.dmto + 1,2 % communale + frais d'assiette
   de 2,37 % sur la part départementale), émoluments du notaire au barème (TVA 20 %),
   contribution de sécurité immobilière (0,1 %) et ≈ 1 000 € de débours et formalités.
   Neuf : taxe de publicité foncière de 0,715 % au lieu des droits de mutation. */
function fraisNotaire(prix, neuf){
  if(!(prix > 0)) return { total:0, dmto:0, emol:0, autres:0 };
  const dmto = neuf ? prix * 0.00715 : prix * ((+P.dmto || 5) / 100 * 1.0237 + 0.012);
  let emol = 0, bas = 0;
  for(const [haut, taux] of [[6500, 0.0387], [17000, 0.01596], [60000, 0.01064], [Infinity, 0.00799]]){ if(prix > bas) emol += (Math.min(prix, haut) - bas) * taux; bas = haut; }
  emol *= 1.2;
  const autres = Math.max(15, prix * 0.001) + 1000;
  return { total: dmto + emol + autres, dmto, emol, autres };
}

/* ---------------- score : stratégies ---------------- */
const STRATEGIES = {
  equilibre:  { n:"Équilibrée", w:{ rdt:30, cf:20, prix:15, dpe:10, loyer:10, tri:10, ville:5 } },
  cashflow:   { n:"Cash-flow d'abord", w:{ rdt:30, cf:40, prix:5, dpe:10, loyer:10, tri:5, ville:0 } },
  patrimoine: { n:"Patrimoine d'abord", w:{ rdt:10, cf:5, prix:25, dpe:15, loyer:5, tri:25, ville:15 } }
};
function poidsScore(){
  if(P.strategie === "perso") return { rdt:+P.pRdt || 0, cf:+P.pCf || 0, prix:+P.pPrix || 0, dpe:+P.pDpe || 0, loyer:+P.pLoyer || 0, tri:+P.pTri || 0, ville:+P.pVille || 0 };
  return (STRATEGIES[P.strategie] || STRATEGIES.equilibre).w;
}
const nomStrategie = () => P.strategie === "perso" ? "personnalisée" : (STRATEGIES[P.strategie] || STRATEGIES.equilibre).n.toLowerCase();

/* ---------------- capacité d'emprunt ----------------
   Règle du HCSF : mensualités (assurance comprise) ≤ 35 % des revenus ; les banques
   retiennent en général 70 % des loyers perçus ou attendus (méthode classique). */
const endettement = (mensualites, loyers) => { const r = (+P.revenus || 0) + 0.7 * (loyers || 0); return r > 0 ? mensualites / r : 0; };
function capitalEmpruntable(mensualite){
  // mensualité totale → capital, assurance comprise, sur la durée et au taux des réglages
  const r = P.taux / 100 / 12, n = Math.max(1, P.duree * 12), fAss = P.assurance / 100 / 12;
  const parEuro = (r ? r / (1 - Math.pow(1 + r, -n)) : 1 / n) + fAss;
  return mensualite > 0 ? mensualite / parEuro : 0;
}

/* ---------------- qualité de la ville ----------------
   Tension locative : zonage ABC du ministère du Logement (A bis, A et B1 = marché tendu).
   Démographie : population actuelle (geo.api.gouv.fr) comparée au recensement le plus ancien
   disponible sur OpenDataSoft. Risques : risques majeurs recensés par Géorisques. */
const ENCADREMENT = {
  "75":["paris"], "69":["lyon", "villeurbanne"], "59":["lille"], "34":["montpellier"], "33":["bordeaux"],
  "93":["aubervilliers", "epinay sur seine", "l ile saint denis", "la courneuve", "pierrefitte sur seine", "saint denis", "saint ouen sur seine", "stains", "villetaneuse",
        "bagnolet", "bobigny", "bondy", "le pre saint gervais", "les lilas", "montreuil", "noisy le sec", "pantin", "romainville"],
  "64":["anglet", "arbonne", "arcangues", "ascain", "bassussarry", "bayonne", "biarritz", "bidart", "biriatou", "boucau", "ciboure", "guethary", "hendaye",
        "jatxou", "lahonce", "larressore", "mouguerre", "saint jean de luz", "saint pierre d irube", "urcuit", "urrugne", "ustaritz", "villefranque", "ahetze"]
};
const estEncadree = m => { const l = ENCADREMENT[(m.insee || "").slice(0, 2)]; return !!(l && l.includes(norm(m.ville))); };
const villeEnCours = new Set();
const villeAJour = m => !!(m.info && Date.now() - m.info.date < 90 * 864e5);
async function assurerInfoVille(m){
  if(!m || !m.insee || villeEnCours.has(m.insee) || villeAJour(m) || !navigator.onLine) return;
  villeEnCours.add(m.insee);
  try {
    const q = encodeURIComponent('code_insee="' + m.insee + '"');
    const [abc, hist, geo, risq] = await Promise.allSettled([
      jget(API_T + "13f7282b-8a25-43ab-9713-8bb4e476df55/data/?CODGEO__exact=" + m.insee),
      jget("https://public.opendatasoft.com/api/explore/v2.1/catalog/datasets/population-francaise-communes/records?where=" + q + "&select=annee_recensement,population_municipale&order_by=annee_recensement&limit=1"),
      jget("https://geo.api.gouv.fr/communes/" + m.insee + "?fields=population,centre"),
      jget("https://georisques.gouv.fr/api/v1/gaspar/risques?code_insee=" + m.insee)]);
    const ok = x => x.status === "fulfilled" ? x.value : null;
    const ra = ok(abc) && ok(abc).data && ok(abc).data[0], rh = ok(hist) && ok(hist).results && ok(hist).results[0], g = ok(geo), rq = ok(risq);
    const zone = ra ? String(ra[Object.keys(ra).find(k => /^zonage/i.test(k))] || "").trim() : "";
    const anNow = new Date().getFullYear() - 4;   // la population légale publiée a environ 4 ans de recul
    const croissance = g && g.population && rh && rh.population_municipale && +rh.annee_recensement < anNow
      ? Math.pow(g.population / rh.population_municipale, 1 / (anNow - +rh.annee_recensement)) - 1 : null;
    // familles de risques (codes à 2 chiffres) ; tempêtes, transport de matières dangereuses et radon, présents presque partout, ne comptent pas
    const fam = rq && rq.data && rq.data[0] ? rq.data[0].risques_detail.filter(r => String(r.num_risque).length === 2).map(r => r.libelle_risque_long) : null;
    const majeurs = fam ? fam.filter(l => !/atmosph|transport de marchandises|radon/i.test(l)) : null;
    const fT = { "Abis":1, "A":1, "B1":0.8, "B2":0.5, "C":0.25 }[zone.replace(/\s/g, "")];
    const parts = [[fT, 40], [croissance == null ? null : clamp(0.5 + croissance / 0.02, 0, 1), 30], [majeurs ? clamp(1 - 0.15 * majeurs.length, 0, 1) : null, 30]].filter(x => x[0] != null);
    const pt = parts.reduce((s, x) => s + x[1], 0);
    if(g && g.centre) m.centre = g.centre.coordinates;
    m.info = { date:Date.now(), zone, pop: g && g.population, popAnc: rh && rh.population_municipale, anAnc: rh && +rh.annee_recensement, anNow, croissance,
      risques: majeurs, encadre: estEncadree(m), score: pt ? Math.round(parts.reduce((s, x) => s + x[0] * x[1], 0) / pt * 100) : null };
    sauverP();
  } catch(e){}
  finally { villeEnCours.delete(m.insee); }
  apresMarche();
}

/* ---------------- taux du marché ----------------
   Taux moyen des nouveaux crédits à l'habitat en France (statistiques MIR de la
   Banque de France, publiées par la BCE, qui accepte les appels depuis la page).
   Mis à jour une fois par semaine au plus ; un taux saisi à la main n'est plus remplacé. */
const moisLong = m => new Date(m + "-01T12:00:00").toLocaleDateString("fr-FR", { month:"long", year:"numeric" });
async function majTauxMarche(force){
  if(!navigator.onLine) return;
  if(!force && P.tauxMarche && Date.now() - P.tauxMarche.date < 7 * 864e5) return;
  try {
    const r = await fetch("https://data-api.ecb.europa.eu/service/data/MIR/M.FR.B.A2C.AM.R.A.2250.EUR.N?lastNObservations=1&format=csvdata");
    if(!r.ok) return;
    const l = (await r.text()).split("\n").filter(x => x.startsWith("MIR.")).pop();
    const c = l ? l.split(",") : [], v = +c[12], mois = c[11];
    if(!(v > 0 && v < 15) || !/^\d{4}-\d{2}$/.test(mois)) return;
    P.tauxMarche = { v, mois, date:Date.now() };
    if(P.tauxAuto !== false) P.taux = Math.round(v * 100) / 100;
    sauverP();
    if(vue === "reglages"){ const a = document.activeElement; if(!(a && a.closest && a.closest("#v-reglages") && a.tagName === "INPUT")) rendreReglages(); }
    else rendre();
  } catch(e){}
}

/* ---------------- état du bien ----------------
   Coût de travaux au m² (ordre de grandeur 2026, hors gros œuvre) et mois sans loyer
   pendant le chantier. L'état vient de l'annonce quand son texte le dit, sinon de la fiche. */
const ETATS = {
  bon:        { n:"Bon état",           m2:0,    mois:0 },
  rafraichir: { n:"À rafraîchir",       m2:300,  mois:1 },
  travaux:    { n:"Travaux importants", m2:700,  mois:3 },
  plateau:    { n:"Plateau à rénover",  m2:1100, mois:5 }
};
function detecterEtat(txt){
  // « aucun travaux à prévoir », « pas de travaux » ne comptent pas
  const s = String(txt || "").toLowerCase().replace(/(aucuns?|pas de|sans)\s+(gros\s+|petits\s+)?travaux[^.\n]*/g, "");
  if(/(état de|en|vendu en|livré en)\s+plateau|plateau [àa] (r[ée]nover|am[ée]nager)|enti[eè]rement [àa] r[ée]nover|[àa] r[ée]nover enti[eè]rement|r[ée]novation (compl[eè]te|totale|lourde|int[ée]grale)|tout [àa] refaire|[àa] r[ée]habiliter|gros travaux|non habitable|inhabitable/.test(s)) return "plateau";
  if(/refait [àa] neuf|enti[eè]rement r[ée]nov[ée]|r[ée]cemment r[ée]nov[ée]|r[ée]nov[ée] en 20\d\d|cl[ée]s? en main/.test(s)) return "bon";
  if(/[àa] r[ée]nover|travaux (importants|[àa] pr[ée]voir|[àa] r[ée]aliser)|r[ée]novation [àa] pr[ée]voir|[àa] moderniser/.test(s)) return "travaux";
  if(/[àa] rafra[iî]chir|rafra[iî]chissement|petits travaux|[àa] remettre au go[uû]t du jour/.test(s)) return "rafraichir";
  return null;
}
// copropriété sous procédure (« Procédure en cours », mention obligatoire des annonces)
const procedureCopro = txt => /proc[ée]dure (en cours|judiciaire)|copropri[ée]t[ée] en difficult[ée]|administrateur (judiciaire|provisoire)|plan de sauvegarde/
  .test(String(txt || "").toLowerCase().replace(/(aucune|pas de|sans)\s+proc[ée]dure[^.\n]*/g, ""));

/* ---------------- calculs ---------------- */
function refMarche(b){
  const v = norm(b.ville);
  if(!v) return b.cp ? P.marche.find(m => m.cp === String(b.cp)) || null : null;
  return P.marche.find(m => norm(m.ville) === v)
      || P.marche.find(m => { const n = norm(m.ville); return n && (v.startsWith(n) || n.startsWith(v)); })
      || null;
}
function calc(b){
  const o = {};
  const s = +b.surface || 0, prix = +b.prix || 0, obj = P.objectif / 100;
  o.ok = prix > 0 && s > 0;
  o.ref = refMarche(b);
  // les petites surfaces se louent plus cher au m², les grandes moins cher
  o.coefS = P.ajusterSurface && s ? clamp(Math.pow(45 / s, 0.2), 0.8, 1.25) : 1;
  const maison = b.type === "maison";
  o.loyerM2Ref = o.ref ? (maison && o.ref.loyerM2Maison ? o.ref.loyerM2Maison : o.ref.loyerM2) : null;
  o.prixM2Ref = o.ref ? (maison && o.ref.prixM2Maison ? o.ref.prixM2Maison : o.ref.prixM2) : null;
  // les ventes comparables autour du bien sont plus précises que la moyenne de la commune
  o.refVentes = !!(b.ventes && b.ventes.n >= 5 && b.ventes.med && b.ventes.cle === cleVentes(b));
  if(o.refVentes) o.prixM2Ref = b.ventes.med;
  o.loyerMarche = o.loyerM2Ref && s ? o.loyerM2Ref * s * o.coefS * (b.meuble ? 1.1 : 1) : null;
  if(b.coloc){
    // colocation : ≈ +25 % par rapport à une location meublée classique, réparti entre les chambres
    o.chambres = Math.max(1, Math.round(+b.chambres || Math.max(2, (+b.pieces || 3) - 1)));
    o.loyerChambreMarche = o.loyerMarche ? Math.round(o.loyerMarche * (b.meuble ? 1 : 1.1) * 1.25 / o.chambres / 5) * 5 : null;
    o.loyerEstime = b.loyerChambre == null || b.loyerChambre === "";
    o.loyer = o.chambres * (!o.loyerEstime ? +b.loyerChambre : (o.loyerChambreMarche || 0));
  } else {
    o.loyerEstime = b.loyer == null || b.loyer === "";
    o.loyer = !o.loyerEstime ? +b.loyer : (o.loyerMarche || 0);
  }
  o.chargesColoc = b.coloc ? (+b.chargesColoc || 0) * 12 : 0;
  o.notaire = fraisNotaire(prix, b.neuf);
  o.frais = o.notaire.total;
  o.notairePct = prix ? o.frais / prix * 100 : 0;
  // sans montant saisi, les travaux sont estimés d'après l'état du bien
  o.etat = ETATS[b.etat] ? b.etat : null;
  o.travauxEstime = !(+b.travaux) && !!o.etat && ETATS[o.etat].m2 > 0;
  o.travaux = +b.travaux || (o.travauxEstime ? Math.round(ETATS[o.etat].m2 * s / 500) * 500 : 0);
  o.moisTravaux = o.etat ? ETATS[o.etat].mois : 0;
  o.mobilier = +b.mobilier || 0;
  o.cout = prix + o.frais + o.travaux + o.mobilier;
  o.loyerAn = o.loyer * 12;
  o.brutAnnonce = prix ? o.loyerAn / prix : 0;        // la formule du fichier Excel
  o.brut = o.cout ? o.loyerAn / o.cout : 0;           // brut sur le coût réel
  // charges du propriétaire
  o.tfEst = b.tf == null || b.tf === "";
  o.tf = !o.tfEst ? +b.tf : o.loyer;                  // à défaut : ≈ un mois de loyer
  o.coproEst = b.copro == null || b.copro === "";
  o.coproTotal = !o.coproEst ? +b.copro : (b.type === "maison" ? 0 : 30 * s);
  o.coproProprio = o.coproTotal * P.coproNonRecup / 100;
  o.vacance = o.loyerAn * P.vacance / 100;
  o.gestion = o.loyerAn * P.gestion / 100;
  o.entretien = o.loyerAn * P.entretien / 100;
  o.gli = o.loyerAn * P.gli / 100;
  o.pno = +P.pno || 0;
  o.charges = o.tf + o.coproProprio + o.pno + o.gestion + o.entretien + o.gli + o.chargesColoc;
  o.encaisse = o.loyerAn - o.vacance;
  o.revenuNet = o.encaisse - o.charges;
  o.net = o.cout ? o.revenuNet / o.cout : 0;
  // crédit
  o.apport = !P.credit ? o.cout : P.apportMode === "frais" ? Math.min(o.cout, o.frais) : P.apportMode === "zero" ? 0 : Math.min(o.cout, +P.apportFixe || 0);
  o.emprunt = P.credit ? Math.max(0, o.cout - o.apport) : 0;
  const r = P.taux / 100 / 12, n = Math.max(1, P.duree * 12);
  o.mensCredit = o.emprunt ? (r ? o.emprunt * r / (1 - Math.pow(1 + r, -n)) : o.emprunt / n) : 0;
  o.mensAss = o.emprunt * P.assurance / 100 / 12;
  o.mens = o.mensCredit + o.mensAss;
  let cap = o.emprunt, it = 0;
  for(let i = 0; i < 12 && cap > 0; i++){ const x = cap * r; it += x; cap -= o.mensCredit - x; }
  o.interets1 = it;
  // impôt : celui du régime le plus avantageux sur la durée de détention (voir simuler)
  o.sim = o.ok ? meilleurRegime(b, o) : null;
  o.regime = o.sim ? o.sim.nom : "";
  o.impot = o.sim ? o.sim.annees[0].impot : 0;
  o.netNet = o.cout ? (o.revenuNet - o.impot) / o.cout : 0;
  o.cf = o.revenuNet / 12 - o.mens;
  o.cfNet = o.cf - o.impot / 12;
  // marché
  o.prixM2 = s ? prix / s : 0;
  o.ecartPrix = o.prixM2Ref && s ? o.prixM2 / o.prixM2Ref - 1 : null;
  o.ratioLoyer = (!o.loyerEstime && o.loyerMarche && !b.coloc) ? o.loyer / o.loyerMarche : null;
  // prix d'achat maximal (frais de notaire, travaux, mobilier compris) pour un rendement visé
  const rev = P.base === "nette" ? o.revenuNet : o.loyerAn;
  o.prixMax = t => Math.max(0, (rev / t - o.travaux - o.mobilier) / (1 + o.notairePct / 100));
  o.offre = o.prixMax(obj);
  o.nego = prix ? 1 - o.offre / prix : 0;
  o.rendObj = P.base === "nette" ? o.net : o.brut;
  // score
  // score : chaque critère noté de 0 à 1, pondéré selon la stratégie choisie (Réglages → Score)
  const lo = obj * 0.5, w = poidsScore();
  const dpeF = { A:1, B:1, C:1, D:0.8, E:0.47, F:0.13, G:0 };
  const t = o.sim && o.sim.tri, info = o.ref && o.ref.info;
  const crit = [
    ["rdt", "Rendement " + (P.base === "nette" ? "net" : "brut") + " vs objectif " + fmtN(P.objectif, 1) + " %", clamp((o.rendObj - lo) / (obj - lo), 0, 1)],
    ["cf", "Cash-flow moyen sur 5 ans, après crédit et impôt", clamp(((o.sim ? o.sim.cf5 : o.cfNet) + 150) / 250, 0, 1)],
    ["prix", "Prix au m² vs " + (o.refVentes ? "ventes autour" : "marché"), o.ecartPrix == null ? 0.5 : clamp((0.15 - o.ecartPrix) / 0.35, 0, 1)],
    ["dpe", "DPE", b.dpe && dpeF[b.dpe] != null ? dpeF[b.dpe] : 0.47],
    ["loyer", "Fiabilité du loyer", o.loyerEstime ? 0.6 : o.ratioLoyer == null ? 0.7 : clamp((1.3 - o.ratioLoyer) / 0.3, 0, 1)],
    ["tri", "TRI sur " + fmtN(P.detention) + " ans", !o.sim ? 0.5 : t != null ? clamp(t / 0.10, 0, 1) : o.sim.enrichissement > 0 ? 1 : 0],
    ["ville", "Qualité de la ville", info && info.score != null ? info.score / 100 : 0.5]
  ];
  const tot = crit.reduce((s, c) => s + (w[c[0]] || 0), 0) || 1;
  o.parts = crit.filter(c => w[c[0]] > 0).map(([k, n, fr]) => ({ n, p: fr * w[k] / tot * 100, m: Math.round(w[k] / tot * 100) }));
  o.score = Math.round(o.parts.reduce((a, x) => a + x.p, 0));
  if(b.dpe === "G" && !o.travaux) o.score = Math.min(o.score, 35);
  if(b.coproProcedure) o.score = Math.min(o.score, 40);
  if(!o.ok) o.score = 0;
  o.verdict = o.score >= 75 ? ["Fonce", "Coche les cases de ton objectif. Vérifie les charges réelles et visite."]
            : o.score >= 60 ? ["À négocier", "Intéressant si le prix baisse ou si le loyer se confirme."]
            : o.score >= 45 ? ["Moyen", "Loin de l'objectif en l'état : il faudrait une vraie baisse de prix."]
            : ["Passe ton chemin", "Ne colle pas à l'objectif de rendement."];
  o.couleur = couleurScore(o.score);
  o.alertes = alertes(b, o);
  return o;
}
function couleurScore(s){ return s >= 75 ? "var(--bon)" : s >= 60 ? "var(--ok)" : s >= 45 ? "var(--moyen)" : "var(--mauvais)"; }
function alertes(b, o){
  const a = [], R = "var(--mauvais)", M = "var(--moyen)", I = "var(--gris)";
  if(!o.ok){ a.push([I, "Il manque le prix ou la surface pour calculer."]); return a; }
  if(b.dpe === "G") a.push([R, "DPE G : location interdite pour tout nouveau bail depuis le 1er janvier 2025. Travaux de rénovation obligatoires avant de louer (à chiffrer dans « Travaux »)."]);
  else if(b.dpe === "F") a.push([M, "DPE F : interdit à la location pour tout nouveau bail à partir du 1er janvier 2028. Prévois les travaux."]);
  else if(b.dpe === "E") a.push([M, "DPE E : interdit à la location à partir du 1er janvier 2034."]);
  else if(!b.dpe) a.push([I, "DPE inconnu : à demander (compté comme neutre dans le score)."]);
  if(o.etat && o.etat !== "bon") a.push([o.etat === "plateau" ? R : M, ETATS[o.etat].n + " : " + (o.travauxEstime ? "travaux estimés à ≈ " + eur(o.travaux) + " (" + fmtN(ETATS[o.etat].m2) + " €/m²)" : "travaux de " + eur(o.travaux)) +
    " inclus dans le coût, et ≈ " + o.moisTravaux + " mois sans loyer la 1re année (" + eur(o.loyer * o.moisTravaux) + "). Fais chiffrer les travaux et saisis le montant."]);
  if(b.coproProcedure) a.push([R, "Copropriété sous procédure : charges et travaux imprévisibles, crédit et revente plus difficiles. Demande les PV d'AG et la nature de la procédure. Score plafonné à 40."]);
  if(o.loyerEstime) a.push([M, o.loyerM2Ref ? "Loyer estimé d'après le marché (" + fmtN(o.loyerM2Ref, 1) + " €/m²" + (o.coefS !== 1 ? ", ajusté à la surface" : "") + ") : vérifie avec des annonces de location comparables." : "Pas de loyer : saisis-le, ou ajoute la ville dans Réglages → Marché pour l'estimer."]);
  else if(o.ratioLoyer && o.ratioLoyer > 1.15) a.push([M, "Loyer saisi " + pct(o.ratioLoyer - 1, 0) + " au-dessus du marché estimé (" + eur(o.loyerMarche) + ") : risque de vacance ou de surestimation."]);
  if(!o.ref) a.push([I, b.ville ? (marcheEnCours.has(norm(b.ville)) ? "Chargement des prix et loyers de « " + b.ville + " »…" : "Pas de référence marché pour « " + b.ville + " » (hors ligne ou commune introuvable) : vérifie l'orthographe ou ajoute-la dans Réglages → Marché.") : "Indique la ville pour comparer au marché."]);
  if(o.tfEst || (o.coproEst && b.type !== "maison")) a.push([I, "Estimé faute d'info : " + [o.tfEst ? "taxe foncière (≈ 1 mois de loyer)" : "", o.coproEst && b.type !== "maison" ? "charges de copro (≈ 30 €/m²/an)" : ""].filter(Boolean).join(", ") + ". À demander au vendeur."]);
  if(o.ecartPrix != null && o.ecartPrix < -0.25) a.push([M, "Prix " + pct(-o.ecartPrix, 0) + " sous le marché : cherche pourquoi (travaux, copro en difficulté, rez-de-chaussée, bruit, bien occupé…)."]);
  if(o.ecartPrix != null && o.ecartPrix > 0.10) a.push([M, "Prix " + pct(o.ecartPrix, 0) + " au-dessus du marché du secteur."]);

const SP = "[\\s\\u00a0\\u202f]";
const MONT = "(\\d{1,3}(?:[ \\u00a0\\u202f.]\\d{3})+|\\d+)(?:,\\d+)?";
const argent = s => parseFloat(String(s).replace(/[\s  .]/g, "").replace(",", "."));
const decimal = s => parseFloat(String(s).replace(/[\s  ]/g, "").replace(",", "."));
function sourceDe(u){
  const h = String(u || "").toLowerCase();
  return h.includes("leboncoin") ? "leboncoin" : h.includes("seloger") ? "seloger" : h.includes("bienici") ? "bienici"
       : h.includes("pap.fr") ? "pap" : h.includes("logic-immo") ? "logic-immo" : h.includes("figaro") ? "figaro immobilier" : h ? "web" : "";
}
function parseTexte(txt){
  // « Ancien prix : 585.000 € » (PAP, baisse de prix) n'est pas le prix de vente
  const t = String(txt || "").replace(/\r/g, "").replace(/ancien\s+prix\s*:?\s*[\d .\u00a0\u202f]+€/gi, "");
  const f = {};

  if((m = t.match(new RegExp("prix(?:\\s+de\\s+vente)?(?:\\s+FAI)?\\s*:?\\s*" + MONT + SP + "?€", "i")))) { const v = argent(m[1]); if(v >= 10000 && v <= 5e6) f.prix = v; }
  if(f.prix == null){
    const re = new RegExp(MONT + SP + "?€", "g");
    while((m = re.exec(t))){
      const v = argent(m[1]);
      const apres = t.slice(re.lastIndex, re.lastIndex + 14), avant = t.slice(Math.max(0, m.index - 40), m.index);
      if(v < 15000 || v > 5e6) continue;
      if(/^\s*(\/|par)\s*(m|mois|an)/i.test(apres) || /^\s*(cc|hc)\b/i.test(apres)) continue;
      if(/(charges?|taxe|loyer|frais|honoraires|budget|quote)[^\n]{0,30}$/i.test(avant)) continue;
      f.prix = v; break;
    }
  }
  // surface habitable (pas le terrain)
  if((m = t.match(/(?:surface(?:\s+habitable)?|superficie(?:\s+habitable)?|surface\s+loi\s+carrez)\s*:?\s*(\d+(?:[.,]\d+)?)\s*m(?:²|2)/i))) f.surface = decimal(m[1]);
  if(f.surface == null){
    const re = /(\d+(?:[.,]\d+)?)\s*m(?:²|2)(?![\w\/])/g;
    while((m = re.exec(t))){
      const v = decimal(m[1]), avant = t.slice(Math.max(0, m.index - 25), m.index);
      if(v < 9 || v > 1000 || /terrain|jardin|parcelle|€/i.test(avant)) continue;
      f.surface = v; break;
    }
  }
  if((m = t.match(/nombre\s+de\s+pi[eè]ces\s*:?\s*(\d+)/i)) || (m = t.match(/(\d+)\s*pi[eè]ces?\b/i)) || (m = t.match(/\b[TF](\d)\b/))) f.pieces = +m[1];
  if(/\bstudio\b/i.test(t) && !f.pieces) f.pieces = 1;
  const im = t.search(/\b(maison|villa|pavillon)\b/i), ia = t.search(/\b(appartement|studio|duplex|loft|T\d)\b/i);
  if(im >= 0 || ia >= 0) f.type = (im >= 0 && (ia < 0 || im < ia)) ? "maison" : "appartement";
  // une échelle complète « A B C D… » (PAP) ne dit pas quelle lettre est la bonne : on l'ignore
  if((m = t.match(/(?:classe\s+[ée]nergie|DPE|performance\s+[ée]nerg[ée]tique|[ée]tiquette\s+[ée]nergie|consommation\s+[ée]nerg[ée]tique|bilan\s+[ée]nergie(?:\s+du\s+bien)?)\s*(?:\(?DPE\)?)?\s*:?\s*(?:classe\s*)?\(?([A-G])\b(?![a-zà-ÿ'])/i))
    && !/^\s*B\s+C\s+D/.test(t.slice(m.index + m[0].length, m.index + m[0].length + 40).replace(/\s+/g, " "))) f.dpe = m[1].toUpperCase();
  // charges de copropriété (annuelles)
  if((m = t.match(new RegExp("quote[- ]part[^\\n€]{0,80}?" + MONT + SP + "?€", "i")))) f.copro = argent(m[1]);
  else if((m = t.match(new RegExp("charges?(?:\\s+de\\s+copro\\w*)?(?:\\s+courantes)?\\s*(?:annuelles?|par\\s+an|\\/\\s?an)\\s*:?[^\\d€\\n]{0,20}" + MONT + SP + "?€", "i")))) f.copro = argent(m[1]);
  else if((m = t.match(new RegExp("charges?(?:\\s+de\\s+copro\\w*)?[^\\d€\\n]{0,25}" + MONT + SP + "?€\\s*(?:\\/|par)\\s*(mois|an)", "i")))) f.copro = argent(m[1]) * (/mois/i.test(m[2]) ? 12 : 1);
  else if((m = t.match(new RegExp(MONT + SP + "?€\\s*(?:de\\s+)?charges?\\s*(annuelles?|par\\s+an|\\/\\s?an|mensuelles?|par\\s+mois|\\/\\s?mois)", "i")))) f.copro = argent(m[1]) * (/mois|mens/i.test(m[2]) ? 12 : 1);
  if(f.copro != null && (f.copro < 20 || f.copro > 20000)) delete f.copro;
  if((m = t.match(new RegExp("taxe\\s+fonci[eè]re[^\\d€\\n]{0,30}" + MONT + SP + "?€", "i")))) { const v = argent(m[1]); if(v > 50 && v < 10000) f.tf = v; }
  if((m = t.match(new RegExp("(?:lou[ée]e?\\s+(?:actuellement\\s+)?(?:à|a|au\\s+prix\\s+de|pour)?|loyer(?:\\s+actuel)?(?:\\s+mensuel)?(?:\\s+hors\\s+charges|\\s+HC|\\s+CC)?\\s*:?|bail\\s+en\\s+cours[^\\d€\\n]{0,30})\\s*" + MONT + SP + "?€", "i")))) { const v = argent(m[1]); if(v >= 150 && v <= 6000) f.loyer = v; }
  if(/\bmeubl[ée]e?\b/i.test(t) && !/non[- ]meubl/i.test(t)) f.meuble = true;
  // ville et code postal
  const reCp = /\(?\b((?:0[1-9]|[1-8]\d|9[0-5])\d{3})\b\)?/g;
  while((m = reCp.exec(t))){
    const ligneAv = t.slice(0, m.index).split("\n").pop();
    const ligneAp = t.slice(reCp.lastIndex).split("\n")[0];
    if(/€|m²|m2/.test(t.slice(reCp.lastIndex, reCp.lastIndex + 4))) continue;
    let v = (ligneAv.match(/([A-ZÀ-Ý][A-Za-zÀ-ÿ'’\-]+(?:[ \-](?:[Ss]ur|[Ss]ous|en|le|la|les|de|du|des|d'|l'|aux|[A-ZÀ-Ý][A-Za-zÀ-ÿ'’\-]+))*)\s*[,(\-–]?\s*$/) || [])[1];
    if(!v) v = (ligneAp.match(/^\s*[)\-–,]?\s*([A-ZÀ-Ý][A-Za-zÀ-ÿ'’\-]+(?:[ \-](?:[Ss]ur|[Ss]ous|en|le|la|les|de|du|des|[A-ZÀ-Ý][A-Za-zÀ-ÿ'’\-]+))*)/) || [])[1];
    if(v && !/^(Appartement|Maison|Studio|Prix|Vente|Achat|Bien|Charges)$/i.test(v)){ f.ville = v.trim(); f.cp = m[1]; break; }
    if(!f.cp) f.cp = m[1];
  }
  const et = detecterEtat(t); if(et) f.etat = et;
  if(procedureCopro(t)) f.coproProcedure = true;
  const u = t.match(/https?:\/\/[^\s"'<>]+/);
  if(u){ f.url = u[0].replace(/[).,;]+$/, ""); f.source = sourceDe(f.url); }
  return f;
}
/* données structurées : Leboncoin (__NEXT_DATA__) et JSON-LD (SeLoger, Bien'ici…) */
function parseLD(liste){
  const f = {};
  const visite = o => {
    if(!o || typeof o !== "object") return;
    if(Array.isArray(o)){ o.forEach(visite); return; }
    if(o["@graph"]) visite(o["@graph"]);
    if(/Breadcrumb|Organization|WebSite/i.test(String(o["@type"]))) return;   // fil d'Ariane, éditeur du site : rien sur le bien
    const of = o.offers && (Array.isArray(o.offers) ? o.offers[0] : o.offers);
    if(of && of.price && f.prix == null){ const v = argent(of.price); if(v >= 10000) f.prix = v; }
    if(o.price && f.prix == null){ const v = argent(o.price); if(v >= 10000) f.prix = v; }
    const fs = o.floorSize && (o.floorSize.value || o.floorSize);
    if(fs && f.surface == null && !isNaN(decimal(fs))) f.surface = decimal(fs);
    if(o.numberOfRooms && f.pieces == null) f.pieces = parseInt(o.numberOfRooms.value || o.numberOfRooms, 10) || null;
    if(o.geo && f.lat == null && +o.geo.latitude && +o.geo.longitude){ f.lat = +o.geo.latitude; f.lng = +o.geo.longitude; f.posApprox = true; }
    const ad = o.address || (o.itemOffered && o.itemOffered.address);
    if(ad && typeof ad === "object"){ if(ad.addressLocality && !f.ville) f.ville = ad.addressLocality; if(ad.postalCode && !f.cp) f.cp = String(ad.postalCode); }
    if(o.name && !f.titre && typeof o.name === "string" && o.name.length < 140 && !/ListItem|Breadcrumb|Organization|WebSite|WebPage|Person|Place/i.test(String(o["@type"]))) f.titre = o.name;
    if(o.image && !f.photos){
      const im = [].concat(o.image).map(x => typeof x === "string" ? x : x && (x.url || x.contentUrl)).filter(u => /^https?:\/\//.test(u || ""));
      if(im.length) f.photos = im.slice(0, 10);
    }
    for(const k in o){ if(o[k] && typeof o[k] === "object" && k !== "offers" && k !== "address") visite(o[k]); }
  };
  (liste || []).forEach(s => { try { visite(JSON.parse(s)); } catch(e){} });
  return f;
}
/* « Vente maison 135&nbsp;m² Saint-Nazaire (44600) - 545.000 € | PAP » → « Maison 135 m² Saint-Nazaire (44600) » */
function nettoyerTitre(s){
  const t = String(s).replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/\s*[|:]\s*(particulier|figaro|seloger|leboncoin|bien.?ici|logic).*$/i, "")
    .replace(/^(achat|vente)\s+/i, "").replace(/\s+à vendre\b/i, "").replace(/[,\s]*[-–]?\s*\d[\d .\u00a0\u202f]{3,}\s*€.*$/, "").replace(/\s+/g, " ").trim();
  return t ? (t[0].toUpperCase() + t.slice(1)).slice(0, 120) : s;
}
function parsePayload(d){
  let f = {};
  if(d.lbc){
    const a = d.lbc;
    if(a.s) f.titre = a.s;
    const p = Array.isArray(a.p) ? a.p[0] : a.p;
    if(p) f.prix = +p;
    if(a.c) f.ville = a.c;
    if(a.z) f.cp = String(a.z);
    if(+a.la && +a.lo){ f.lat = +a.la; f.lng = +a.lo; f.posApprox = true; }
    (a.at || []).forEach(([k, v, lab]) => {
      if(k === "square" && v) f.surface = decimal(v);
      else if(k === "rooms" && v) f.pieces = parseInt(v, 10);
      else if(k === "real_estate_type") f.type = /maison/i.test(lab || "") || v === "1" ? "maison" : "appartement";
      else if(k === "energy_rate" && /^[a-g]$/i.test(v || "")) f.dpe = v.toUpperCase();
      else if(k === "furnished" && (v === "1" || /meubl/i.test(lab || ""))) f.meuble = true;
      // noms de caractéristiques variables selon les annonces : on reconnaît le sens plutôt qu'une clé exacte
      else if(/charge|copro/i.test(k) && !/inclu/i.test(k) && argent(v) > 0) f.copro = argent(v) * (/month|mensu/i.test(k) ? 12 : 1);
      else if(/tax|fonci/i.test(k) && argent(v) > 50) f.tf = argent(v);
    });
    if(Array.isArray(a.im) && a.im.length) f.photos = a.im.slice(0, 10);
    if(Array.isArray(a.th) && a.th[0]) f.vignette = a.th[0];
    const fd = parseTexte(a.b || "");
    for(const k of ["copro", "tf", "loyer", "dpe", "surface", "pieces", "meuble", "etat", "coproProcedure"]) if(f[k] == null && fd[k] != null) f[k] = fd[k];
  }
  const ld = parseLD(d.ld);
  for(const k in ld) if(f[k] == null) f[k] = ld[k];
  // le texte de la page s'arrête avant les « annonces similaires », qui parlent d'autres biens
  const tx = parseTexte(String(d.x || "").split(/annonces similaires|biens similaires|vous aimerez aussi|ces annonces pourraient|d[ée]couvrez les biens similaires|autres annonces/i)[0]);
  for(const k in tx) if(f[k] == null && k !== "url") f[k] = tx[k];
  const tt = parseTexte(d.t || "");
  for(const k of ["ville", "cp", "surface", "pieces"]) if(f[k] == null && tt[k] != null) f[k] = tt[k];
  const pi = Array.isArray(d.pi) ? d.pi.filter(u => /^https?:\/\//.test(u)) : [];
  if(!(d.lbc && Array.isArray(d.lbc.im) && d.lbc.im.length) && pi.length > (f.photos || []).length) f.photos = pi.slice(0, 10);
  if(!f.photos && /^https?:\/\//.test(d.og || "")) f.photos = [d.og];
  if(!f.vignette && f.photos) f.vignette = f.photos[0];
  if(!f.titre && d.t) f.titre = String(d.t).split(/[|–-]\s*(leboncoin|seloger|bien'ici)/i)[0].trim().slice(0, 120);
  if(f.titre) f.titre = nettoyerTitre(f.titre);
  f.url = d.u || f.url || "";
  f.source = sourceDe(d.h || f.url);
  return f;
}
const LIBELLES = { prix:"prix", surface:"surface", pieces:"pièces", type:"type", dpe:"DPE", ville:"ville", cp:"code postal", copro:"charges copro", tf:"taxe foncière", loyer:"loyer", meuble:"meublé", titre:"titre", etat:"état du bien", coproProcedure:"procédure en copro" };
const ESSENTIELS = ["prix", "surface", "ville", "dpe", "loyer", "copro", "tf"];

/* identifiant d'une annonce : le numéro Leboncoin quand il y en a un (liens partagés,
   liens du site et anciens formats .htm désignent la même annonce), sinon le lien sans paramètres */
function cleAnnonce(u){
  const s = String(u || ""), m = /leboncoin\.fr\/\S*?(\d{8,12})/i.exec(s);
  return m ? "lbc:" + m[1] : s.split("#")[0].split("?")[0].replace(/\/$/, "").toLowerCase();
}
/* titre d'un partage : première ligne utile, sans le lien ni les formules de l'appli */
function titrePartage(titre, texte){
  const l = [titre, texte].filter(Boolean).join("\n").replace(/https?:\/\/\S+/g, "").split("\n").map(s => s.trim()).filter(Boolean);
  const t = (l[0] || "").replace(/^(regarde|découvre|decouvre|voici|vu sur)[^:]*:\s*/i, "")
    .replace(/\s*[-|–:]\s*(sur\s+)?leboncoin.*$/i, "").replace(/^leboncoin\s*[-|–:]?\s*/i, "").trim();
  return t.length >= 4 ? t.slice(0, 120) : "";
}
/* applique ce qui a été lu : met à jour le bien de la même annonce, ou en crée un */
function integrer(f, origine){
  let b = f.url ? biens.find(x => x.url && cleAnnonce(x.url) === cleAnnonce(f.url)) : null;
  const nouveau = !b;
  if(!b){ b = nouveauBien(); biens.unshift(b); }
  const trouves = [];
  for(const k in f){
    if(f[k] == null || f[k] === "" || k === "source" || k === "url" || (Array.isArray(f[k]) && !f[k].length)) continue;
    if(k === "prix" && b.prix && b.prix !== f.prix) b.hist.push({ d:Date.now(), prix:b.prix });
    b[k] = f[k]; if(LIBELLES[k]) trouves.push(k);
  }
  if(f.url){ b.url = f.url; b.source = f.source || sourceDe(f.url); }
  if(!b.titre) b.titre = [b.type === "maison" ? "Maison" : "Appartement", b.surface ? fmtN(b.surface) + " m²" : "", b.ville].filter(Boolean).join(" · ");
  b.maj = Date.now();
  sauverB();
  courant = b.id; store.set("courant", courant);
  derniereLecture = { trouves, manquants: ESSENTIELS.filter(k => !trouves.includes(k) && (b[k] == null || b[k] === "")), nouveau, origine, url:b.url };
  setTimeout(() => assurerMarche(b), 0);
  prechargerPhotos(b);
  return b;
}

function analyserSaisie(texte){

/* réception : favori (#import=…) ou partage Android (?url=&text=) */
function recevoir(){
  const h = location.hash;
  if(h.startsWith("#liste=")){
    try {
      recevoirListe(JSON.parse(decodeURIComponent(escape(atob(h.slice(7))))));
      history.replaceState(null, "", location.pathname + location.search);
      allerVue("tri");
      return true;
    } catch(e){ toast("Liste illisible"); history.replaceState(null, "", location.pathname); }
  }
  if(h.startsWith("#import=")){
    try {
      const d = JSON.parse(decodeURIComponent(escape(atob(h.slice(8)))));
      const f = parsePayload(d);
      history.replaceState(null, "", location.pathname + location.search);
      // page pas encore affichée (Bien'ici met quelques secondes) : on ne crée pas de fiche vide
      if(!f.prix && !f.surface){ allerVue("biens"); toast("Rien de lisible sur cette page : attends qu'elle soit entièrement affichée, puis relance le favori"); return true; }
      integrer(f, "favori");
      allerVue("analyse");
      return true;
    } catch(e){ toast("Import illisible"); history.replaceState(null, "", location.pathname); }
  }
  const q = new URLSearchParams(location.search);
  if(q.has("url") || q.has("text")){
    const txt = [q.get("title"), q.get("text"), q.get("url")].filter(Boolean).join("\n");
    const f = parseTexte(txt);
    if(f.url && /leboncoin/i.test(f.url)) f.url = f.url.split("?")[0];
    const titre = titrePartage(q.get("title"), q.get("text"));
    if(titre) f.titre = titre;
    if(f.url || f.prix || f.surface) integrer(f, "partage");
    history.replaceState(null, "", location.pathname);
    allerVue("analyse");
    return true;
  }
  return false;
}
